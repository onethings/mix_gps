<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 180" width="120" height="180">
  <defs>
    <!-- 1. 車身主體金屬烤漆漸層 (深酒紅 #7D1111 到亮寶石紅 #E33939) -->
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7D1111" />
      <stop offset="22%" stop-color="#B82222" />
      <stop offset="50%" stop-color="#E33939" />
      <stop offset="78%" stop-color="#B82222" />
      <stop offset="100%" stop-color="#6B0D0D" />
    </linearGradient>

    <!-- 2. 車頂頂蓋垂直金屬光影漸層 -->
    <linearGradient id="roofGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF7A7A" stop-opacity="0.88" />
      <stop offset="100%" stop-color="#A61919" stop-opacity="0.82" />
    </linearGradient>

    <!-- 3. 車窗與前後擋風玻璃漸層 -->
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E262C" />
      <stop offset="35%" stop-color="#37434D" />
      <stop offset="70%" stop-color="#222B32" />
      <stop offset="100%" stop-color="#11161A" />
    </linearGradient>

    <!-- 4. 停車狀態暗紅色擴散光暈濾鏡 (parkedRedGlow) -->
    <filter id="parkedRedGlow" x="-45%" y="-45%" width="190%" height="190%">
      <!-- 內層濃郁暗紅光暈 -->
      <feGaussianBlur in="SourceAlpha" stdDeviation="4.5" result="blurInner" />
      <feFlood flood-color="#8A0E0E" flood-opacity="0.55" result="colorInner" />
      <feComposite in="colorInner" in2="blurInner" operator="in" result="glowInner" />
      
      <!-- 外層柔和擴散光暈 -->
      <feGaussianBlur in="SourceAlpha" stdDeviation="9" result="blurOuter" />
      <feFlood flood-color="#B81D1D" flood-opacity="0.35" result="colorOuter" />
      <feComposite in="colorOuter" in2="blurOuter" operator="in" result="glowOuter" />

      <feMerge>
        <feMergeNode in="glowOuter" />
        <feMergeNode in="glowInner" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- 裁切路徑：限制玻璃及漆面反光條不溢出邊界 -->
    <clipPath id="windshieldClip">
      <path d="M 32 45 C 44 39, 76 39, 88 45 L 84 65 C 68 62, 52 62, 36 65 Z" />
    </clipPath>
    <clipPath id="rearWindowClip">
      <path d="M 35 150 L 85 150 L 88 161 C 72 164, 48 164, 32 161 Z" />
    </clipPath>
    <clipPath id="hoodClip">
      <path d="M 46 21 C 55 19, 65 19, 74 21 L 71 37 C 63 35.5, 57 35.5, 49 37 Z" />
    </clipPath>
    <clipPath id="roofClip">
      <rect x="35" y="68" width="50" height="79" rx="7" ry="7" />
    </clipPath>
  </defs>

  <!-- 停車狀態暗紅色擴散光暈層（背景 100% 透明） -->
  <rect x="27" y="14" width="66" height="152" rx="18" ry="18" fill="#7D1111" filter="url(#parkedRedGlow)" />

  <!-- 車輛主體群組 -->
  <g id="van-vehicle-parked">
    
    <!-- 後視鏡 (左 / 右) -->
    <path d="M 27 49 L 18 52 C 16 52.5, 16 56.5, 18 57 L 27 56 Z" fill="#7D1111" stroke="#520909" stroke-width="1.5" stroke-linejoin="round" />
    <path d="M 93 49 L 102 52 C 104 52.5, 104 56.5, 102 57 L 93 56 Z" fill="#6B0D0D" stroke="#520909" stroke-width="1.5" stroke-linejoin="round" />

    <!-- 車身外殼輪廓 -->
    <path d="M 42 13 
             L 78 13 
             C 88 13, 93 19, 93 30 
             L 93 153 
             C 93 162, 88 167, 78 167 
             L 42 167 
             C 32 167, 27 162, 27 153 
             L 27 30 
             C 27 19, 32 13, 42 13 Z" fill="url(#bodyGrad)" stroke="#520909" stroke-width="1.8" />

    <!-- 側窗設計 -->
    <path d="M 28.5 64 L 31.5 68 L 31.5 144 L 28.5 148 Z" fill="url(#glassGrad)" />
    <path d="M 91.5 64 L 88.5 68 L 88.5 144 L 91.5 148 Z" fill="url(#glassGrad)" />
    <line x1="29.5" y1="78" x2="30.5" y2="92" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.18" />
    <line x1="90.5" y1="78" x2="89.5" y2="92" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.18" />

    <!-- 引擎蓋壓線與高光 -->
    <path d="M 38 18 L 41 40" stroke="#5E0B0B" stroke-width="1.2" stroke-opacity="0.55" fill="none" stroke-linecap="round" />
    <path d="M 82 18 L 79 40" stroke="#5E0B0B" stroke-width="1.2" stroke-opacity="0.55" fill="none" stroke-linecap="round" />
    <path d="M 46 21 C 55 19, 65 19, 74 21 L 71 37 C 63 35.5, 57 35.5, 49 37 Z" fill="#FF6B6B" opacity="0.55" />
    
    <!-- 引擎蓋左側斜向金屬漆面高光反光 -->
    <g clip-path="url(#hoodClip)">
      <polygon points="44,18 53,18 46,39 37,39" fill="#FFFFFF" opacity="0.28" />
      <polygon points="56,18 60,18 53,39 49,39" fill="#FFD1D1" opacity="0.22" />
    </g>

    <!-- 前擋風玻璃 -->
    <path d="M 32 45 C 44 39, 76 39, 88 45 L 84 65 C 68 62, 52 62, 36 65 Z" fill="url(#glassGrad)" stroke="#11161A" stroke-width="1" />
    
    <!-- 前擋風玻璃斜向白色高光條 -->
    <g clip-path="url(#windshieldClip)">
      <polygon points="34,36 47,36 33,69 20,69" fill="#FFFFFF" opacity="0.15" />
      <polygon points="52,36 58,36 44,69 38,69" fill="#FFFFFF" opacity="0.15" />
    </g>

    <!-- 車頂頂蓋區域 -->
    <rect x="35" y="68" width="50" height="79" rx="7" ry="7" fill="url(#roofGrad)" stroke="#7D1111" stroke-width="0.8" />
    
    <!-- 車頂頂蓋光澤強化條與導流壓線 -->
    <rect x="43" y="72" width="34" height="70" rx="4" ry="4" fill="#FF8585" opacity="0.2" />
    <line x1="42" y1="74" x2="42" y2="141" stroke="#5E0B0B" stroke-width="1" stroke-opacity="0.35" stroke-linecap="round" />
    <line x1="78" y1="74" x2="78" y2="141" stroke="#5E0B0B" stroke-width="1" stroke-opacity="0.35" stroke-linecap="round" />

    <!-- 車頂左側斜向金屬漆面高光反光 -->
    <g clip-path="url(#roofClip)">
      <polygon points="33,66 49,66 36,125 20,125" fill="#FFFFFF" opacity="0.24" />
      <polygon points="53,66 59,66 46,125 40,125" fill="#FFD6D6" opacity="0.18" />
    </g>

    <!-- 後擋風玻璃 -->
    <path d="M 35 150 L 85 150 L 88 161 C 72 164, 48 164, 32 161 Z" fill="url(#glassGrad)" stroke="#11161A" stroke-width="1" />

    <!-- 後擋風玻璃斜向白色高光條 -->
    <g clip-path="url(#rearWindowClip)">
      <polygon points="40,147 51,147 41,167 30,167" fill="#FFFFFF" opacity="0.15" />
      <polygon points="56,147 61,147 51,167 46,167" fill="#FFFFFF" opacity="0.15" />
    </g>

    <!-- 雨刷細節 -->
    <path d="M 41 43 L 57 41.5" stroke="#11161A" stroke-width="1.3" stroke-linecap="round" />
    <path d="M 62 42.5 L 78 41.5" stroke="#11161A" stroke-width="1.3" stroke-linecap="round" />

    <!-- 車頭燈 (駐車微光白燈) -->
    <path d="M 30 22 C 30 17, 35 15, 42 15 L 40 20 C 35 20.5, 32 22.5, 30 26 Z" fill="#FFF0F0" opacity="0.85" />
    <path d="M 90 22 C 90 17, 85 15, 78 15 L 80 20 C 85 20.5, 88 22.5, 90 26 Z" fill="#FFF0F0" opacity="0.85" />

    <!-- 車尾燈 (警示紅光 #FF4D4D) -->
    <path d="M 29.5 157 C 29.5 162, 33 165, 40 165.5 L 40 163 C 35 162.5, 32 160.5, 31.5 157 Z" fill="#FF4D4D" />
    <path d="M 90.5 157 C 90.5 162, 87 165, 80 165.5 L 80 163 C 85 162.5, 88 160.5, 88.5 157 Z" fill="#FF4D4D" />

    <!-- 前保險桿進氣格柵細節 -->
    <path d="M 49 14.5 Q 60 13.8 71 14.5" stroke="#520909" stroke-width="1.2" fill="none" stroke-linecap="round" />
  </g>
</svg>