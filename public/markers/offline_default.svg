<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- 離線/靜止銀灰狀態：柔和深灰底部懸浮陰影（背景 100% 透明） -->
    <filter id="metallicSilverShadow" x="-30%" y="-25%" width="160%" height="165%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4.2" result="blurShadow" />
      <feOffset in="blurShadow" dx="0" dy="4.5" result="offsetShadow" />
      <feFlood flood-color="#22262C" flood-opacity="0.42" result="colorShadow" />
      <feComposite in="colorShadow" in2="offsetShadow" operator="in" result="dropShadowMain" />

      <feGaussianBlur in="SourceAlpha" stdDeviation="1.5" result="blurTight" />
      <feOffset in="blurTight" dx="0" dy="1.8" result="offsetTight" />
      <feFlood flood-color="#1A1D22" flood-opacity="0.4" result="colorTight" />
      <feComposite in="colorTight" in2="offsetTight" operator="in" result="dropShadowTight" />

      <feMerge>
        <feMergeNode in="dropShadowMain" />
        <feMergeNode in="dropShadowTight" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- 橫向金屬銀漸層：亮銀白 (#E4E8ED) 至 冷鐵灰 (#7D838B) -->
    <linearGradient id="metallicSilverBase" x1="0%" y1="45%" x2="100%" y2="55%">
      <stop offset="0%" stop-color="#E4E8ED" />
      <stop offset="30%" stop-color="#C5CCD4" />
      <stop offset="68%" stop-color="#9CA3AC" />
      <stop offset="100%" stop-color="#7D838B" />
    </linearGradient>

    <!-- 中心箭頭專用橫向金屬銀漸層（確保箭頭寬度內完整呈現亮銀白至冷鐵灰過渡） -->
    <linearGradient id="arrowSilverBase" x1="0%" y1="45%" x2="100%" y2="55%">
      <stop offset="0%" stop-color="#E4E8ED" />
      <stop offset="34%" stop-color="#C5CCD4" />
      <stop offset="70%" stop-color="#9CA3AC" />
      <stop offset="100%" stop-color="#7D838B" />
    </linearGradient>

    <!-- 左側銀白高光反光漸層 -->
    <linearGradient id="silverLeftGloss" x1="0%" y1="20%" x2="72%" y2="80%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.78" />
      <stop offset="35%" stop-color="#F2F5F8" stop-opacity="0.32" />
      <stop offset="65%" stop-color="#E4E8ED" stop-opacity="0" />
    </linearGradient>

    <!-- 裁切路徑：確保金屬高光只作用在圓環與箭頭本體上 -->
    <clipPath id="silverIconClip">
      <path fill-rule="evenodd" d="M64,14 A50,50 0 1,0 64,114 A50,50 0 1,0 64,14 Z M64,22 A42,42 0 1,1 64,106 A42,42 0 1,1 64,22 Z" />
      <path d="M64,37 C65.8,37 67.3,38.1 68.2,39.8 L86.5,75.8 C87.8,78.4 85.4,81.2 82.6,80.2 L65.5,74.1 C64.5,73.7 63.5,73.7 62.5,74.1 L45.4,80.2 C42.6,81.2 40.2,78.4 41.5,75.8 L59.8,39.8 C60.7,38.1 62.2,37 64,37 Z" />
    </clipPath>
  </defs>

  <!-- 主圖層（套用深灰底部懸浮陰影，背景 100% 透明） -->
  <g filter="url(#metallicSilverShadow)">
    <!-- 1. 外圓環金屬銀主體 + 深灰色外框線 (#4A5058) -->
    <path fill-rule="evenodd" d="M64,14 A50,50 0 1,0 64,114 A50,50 0 1,0 64,14 Z M64,22 A42,42 0 1,1 64,106 A42,42 0 1,1 64,22 Z" fill="url(#metallicSilverBase)" stroke="#4A5058" stroke-width="1.5" stroke-linejoin="round" />

    <!-- 2. 中心導航箭頭金屬銀主體 + 深灰色外框線 (#4A5058) -->
    <path d="M64,37 C65.8,37 67.3,38.1 68.2,39.8 L86.5,75.8 C87.8,78.4 85.4,81.2 82.6,80.2 L65.5,74.1 C64.5,73.7 63.5,73.7 62.5,74.1 L45.4,80.2 C42.6,81.2 40.2,78.4 41.5,75.8 L59.8,39.8 C60.7,38.1 62.2,37 64,37 Z" fill="url(#arrowSilverBase)" stroke="#4A5058" stroke-width="1.5" stroke-linejoin="round" />

    <!-- 3. 左側亮銀白高光反光層 -->
    <g clip-path="url(#silverIconClip)">
      <!-- 斜向銀面反光帶 -->
      <polygon points="8,10 66,10 36,118 -12,118" fill="url(#silverLeftGloss)" />
      <!-- 外環左側亮銀弧形高光線 -->
      <path d="M20,46 A46,46 0 0,1 54,18" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" opacity="0.82" />
      <!-- 箭頭左側斜邊亮銀高光 -->
      <line x1="62.5" y1="40.5" x2="44.5" y2="75.5" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round" opacity="0.85" />
    </g>
  </g>
</svg>