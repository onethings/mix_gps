<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <defs>
    <!-- 柔和深琥珀棕與暖金微光懸浮陰影濾鏡（確保淺色/白色地圖高辨識度，背景 100% 透明） -->
    <filter id="metallicYellowGlowShadow" x="-30%" y="-30%" width="160%" height="165%">
      <!-- 底部柔和深琥珀棕懸浮陰影 -->
      <feGaussianBlur in="SourceAlpha" stdDeviation="7.5" result="blurShadow" />
      <feOffset in="blurShadow" dx="0" dy="6.5" result="offsetShadow" />
      <feFlood flood-color="#2B1C02" flood-opacity="0.54" result="colorShadow" />
      <feComposite in="colorShadow" in2="offsetShadow" operator="in" result="deepBronzeShadow" />

      <!-- 周圍微凝聚古銅金邊緣暈光（防止在白色地圖上邊緣融化） -->
      <feGaussianBlur in="SourceAlpha" stdDeviation="2.4" result="blurRim" />
      <feFlood flood-color="#9E6E08" flood-opacity="0.5" result="colorRim" />
      <feComposite in="colorRim" in2="blurRim" operator="in" result="softGoldRim" />

      <feMerge>
        <feMergeNode in="deepBronzeShadow" />
        <feMergeNode in="softGoldRim" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- 橫向金屬烤漆黃／香檳金主漸層（亮香檳金 #FFF0A6 -> 耀眼電鍍金黃 #FFD01A -> 琥珀金 #D9960B -> 深古銅棕 #4D3203） -->
    <linearGradient id="metallicYellowMainGrad" x1="0%" y1="30%" x2="100%" y2="70%">
      <stop offset="0%" stop-color="#FFF0A6" />
      <stop offset="22%" stop-color="#FFE047" />
      <stop offset="50%" stop-color="#F5B80F" />
      <stop offset="78%" stop-color="#B57B07" />
      <stop offset="100%" stop-color="#4D3203" />
    </linearGradient>

    <!-- 外環立體陽極氧化金屬金黃漸層 -->
    <linearGradient id="ringMetallicYellowGrad" x1="0%" y1="15%" x2="100%" y2="85%">
      <stop offset="0%" stop-color="#FFEB8F" />
      <stop offset="26%" stop-color="#FFD01A" />
      <stop offset="58%" stop-color="#A87006" />
      <stop offset="82%" stop-color="#3D2703" />
      <stop offset="100%" stop-color="#D99B0E" />
    </linearGradient>

    <!-- 深古銅褐與暗曜棕高對比外框線（確保純白與淺灰地圖清晰辨識） -->
    <linearGradient id="darkBronzeOutlineGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5C3D08" />
      <stop offset="50%" stop-color="#382303" />
      <stop offset="100%" stop-color="#1F1201" />
    </linearGradient>

    <!-- 內側象牙白金金屬倒角高光線 -->
    <linearGradient id="yellowInnerBevelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF0" stop-opacity="0.98" />
      <stop offset="35%" stop-color="#FFE885" stop-opacity="0.9" />
      <stop offset="72%" stop-color="#B57B07" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#FFF0AD" stop-opacity="0.9" />
    </linearGradient>

    <!-- 左側斜向象牙白金鏡面高光反光漸層 -->
    <linearGradient id="yellowSpecularGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFF5" stop-opacity="0.75" />
      <stop offset="38%" stop-color="#FFF0A8" stop-opacity="0.38" />
      <stop offset="75%" stop-color="#FFD01A" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#4D3203" stop-opacity="0" />
    </linearGradient>

    <!-- 旗面（含中空五角星）的複合路徑與裁切 -->
    <mask id="flagStarMask">
      <rect x="0" y="0" width="300" height="300" fill="white" />
      <!-- 中央鏤空五角星（保持地圖底圖 100% 透明穿透） -->
      <polygon points="154,107 162.5,124.2 181.5,127 167.8,140.4 171,159.3 154,150.4 137,159.3 140.2,140.4 126.5,127 145.5,124.2" fill="black" />
    </mask>

    <clipPath id="flagBodyClip">
      <path d="M 85 95 C 115 74, 152 80, 178 86 C 194 89, 205 83, 212 76 L 226 164 C 216 173, 202 178, 185 174 C 158 168, 125 166, 102 184 L 85 95 Z" />
    </clipPath>

    <clipPath id="ringClip">
      <path fill-rule="evenodd" d="M 150 28 A 122 122 0 1 0 150 272 A 122 122 0 1 0 150 28 Z M 150 40 A 110 110 0 1 1 150 260 A 110 110 0 1 1 150 40 Z" />
    </clipPath>
  </defs>

  <!-- 整體套用柔和深琥珀棕懸浮陰影與暖金微暈 -->
  <g filter="url(#metallicYellowGlowShadow)">

    <!-- 1. 外圍精密幾何金屬金黃圓環 -->
    <g>
      <!-- 圓環立體暗古銅陰影底座 -->
      <circle cx="151" cy="152.5" r="116" fill="none" stroke="#261702" stroke-width="12.5" opacity="0.82" />
      <!-- 圓環主體陽極氧化金屬金黃漸層 -->
      <circle cx="150" cy="150" r="116" fill="none" stroke="url(#ringMetallicYellowGrad)" stroke-width="11" />
      <!-- 圓環左側及上半部象牙金斜向鏡面高光 -->
      <g clip-path="url(#ringClip)">
        <path d="M 20 155 Q 135 100 265 65 L 265 15 L 20 15 Z" fill="url(#yellowSpecularGrad)" />
      </g>
      <!-- 圓環內側象牙白金倒角高光線 -->
      <circle cx="150" cy="150" r="120.2" fill="none" stroke="url(#yellowInnerBevelGrad)" stroke-width="1.2" />
      <circle cx="150" cy="150" r="111.5" fill="none" stroke="url(#yellowInnerBevelGrad)" stroke-width="1.1" />
      <!-- 圓環最外緣與最內緣深古銅外框線（確保淺色/白色地圖清晰辨識） -->
      <circle cx="150" cy="150" r="121.6" fill="none" stroke="url(#darkBronzeOutlineGrad)" stroke-width="1.5" />
      <circle cx="150" cy="150" r="110.4" fill="none" stroke="url(#darkBronzeOutlineGrad)" stroke-width="1.4" />
    </g>

    <!-- 2. 精密幾何金屬金黃星形旗幟與旗桿 -->
    <g>
      <!-- 旗幟與旗桿立體厚度暗古銅陰影層 -->
      <g transform="translate(2, 2.8)" mask="url(#flagStarMask)">
        <path d="M 79 94 C 78.2 89, 85.8 87.8, 86.8 92.8 L 87.2 94.5 C 116 74, 152 80, 178 86 C 194 89, 205 83, 212 76 L 226 164 C 216 173, 202 178, 185 174 C 158 168, 125 166, 102 184 L 109.5 227 C 110.3 232, 102.7 233.3, 101.8 228.3 L 79 94 Z" fill="#332003" />
      </g>

      <!-- 旗幟與旗桿主體（套用五角星透明遮罩） -->
      <g mask="url(#flagStarMask)">
        <!-- 旗桿 + 旗面主金屬金黃橫向漸層 -->
        <path d="M 79 94 C 78.2 89, 85.8 87.8, 86.8 92.8 L 87.2 94.5 C 116 74, 152 80, 178 86 C 194 89, 205 83, 212 76 L 226 164 C 216 173, 202 178, 185 174 C 158 168, 125 166, 102 184 L 109.5 227 C 110.3 232, 102.7 233.3, 101.8 228.3 L 79 94 Z" fill="url(#metallicYellowMainGrad)" />

        <!-- 旗面左側斜向象牙白金烤漆高光反光帶 -->
        <g clip-path="url(#flagBodyClip)">
          <polygon points="72,68 158,68 118,195 65,195" fill="url(#yellowSpecularGrad)" />
          <path d="M 75 70 L 225 65 L 228 106 Q 145 118 88 142 Z" fill="url(#yellowSpecularGrad)" opacity="0.72" />
        </g>

        <!-- 旗桿左側極亮象牙金白圓柱高光反光線 -->
        <line x1="82.5" y1="93" x2="104.5" y2="226" stroke="#FFFFF0" stroke-width="2" stroke-linecap="round" opacity="0.9" />
      </g>

      <!-- 旗幟內層象牙白金倒角高光描邊 -->
      <path d="M 79 94 C 78.2 89, 85.8 87.8, 86.8 92.8 L 87.2 94.5 C 116 74, 152 80, 178 86 C 194 89, 205 83, 212 76 L 226 164 C 216 173, 202 178, 185 174 C 158 168, 125 166, 102 184 L 109.5 227 C 110.3 232, 102.7 233.3, 101.8 228.3 L 79 94 Z" fill="none" stroke="url(#yellowInnerBevelGrad)" stroke-width="2.1" stroke-linejoin="round" />

      <!-- 旗幟最外緣深古銅外框線 -->
      <path d="M 79 94 C 78.2 89, 85.8 87.8, 86.8 92.8 L 87.2 94.5 C 116 74, 152 80, 178 86 C 194 89, 205 83, 212 76 L 226 164 C 216 173, 202 178, 185 174 C 158 168, 125 166, 102 184 L 109.5 227 C 110.3 232, 102.7 233.3, 101.8 228.3 L 79 94 Z" fill="none" stroke="url(#darkBronzeOutlineGrad)" stroke-width="1.3" stroke-linejoin="round" />

      <!-- 中央鏤空五角星象牙白金倒角與深古銅雙層描邊 -->
      <polygon points="154,107 162.5,124.2 181.5,127 167.8,140.4 171,159.3 154,150.4 137,159.3 140.2,140.4 126.5,127 145.5,124.2" fill="none" stroke="url(#yellowInnerBevelGrad)" stroke-width="2.2" stroke-linejoin="round" />
      <polygon points="154,107 162.5,124.2 181.5,127 167.8,140.4 171,159.3 154,150.4 137,159.3 140.2,140.4 126.5,127 145.5,124.2" fill="none" stroke="url(#darkBronzeOutlineGrad)" stroke-width="1.2" stroke-linejoin="round" />
    </g>

  </g>
</svg>