<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <!-- 柔和的深古銅琥珀底部懸浮陰影 (背景 100% 透明) -->
    <filter id="orangeHoverShadow" x="-35%" y="-35%" width="170%" height="170%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#421402" flood-opacity="0.55" />
      <feDropShadow dx="0" dy="1.5" stdDeviation="10" flood-color="#8C2D04" flood-opacity="0.35" />
    </filter>

    <!-- 機身主體橫向金屬銀橘漸層 (銀白高光 -> 亮琥珀橘 -> 金屬銅橘 -> 深古銅) -->
    <linearGradient id="fuselageSilverOrange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A83A08" />
      <stop offset="22%" stop-color="#FF9A44" />
      <stop offset="48%" stop-color="#FFE6CC" />
      <stop offset="76%" stop-color="#E35D12" />
      <stop offset="100%" stop-color="#8C2D04" />
    </linearGradient>

    <!-- 機身中央金屬銀橘烤漆脊線 -->
    <linearGradient id="fuselageOrangeSheen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8C2D04" stop-opacity="0.55" />
      <stop offset="30%" stop-color="#FF9A44" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#FFF2E6" stop-opacity="0.95" />
      <stop offset="70%" stop-color="#F26E1D" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#8C2D04" stop-opacity="0.65" />
    </linearGradient>

    <!-- 左主翼金屬銀橘漸層 -->
    <linearGradient id="leftWingOrangeGrad" x1="0%" y1="0%" x2="100%" y2="60%">
      <stop offset="0%" stop-color="#FFAA5C" />
      <stop offset="45%" stop-color="#EB6617" />
      <stop offset="100%" stop-color="#8C2D04" />
    </linearGradient>

    <!-- 右主翼金屬銀橘漸層 -->
    <linearGradient id="rightWingOrangeGrad" x1="0%" y1="20%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#F78234" />
      <stop offset="55%" stop-color="#C94B0A" />
      <stop offset="100%" stop-color="#8C2D04" />
    </linearGradient>

    <!-- 引擎橫向金屬銀橘漸層 -->
    <linearGradient id="engineOrangeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8C2D04" />
      <stop offset="42%" stop-color="#FFAC63" />
      <stop offset="75%" stop-color="#D9530B" />
      <stop offset="100%" stop-color="#6E2102" />
    </linearGradient>

    <!-- 駕駛艙擋風玻璃漸層 -->
    <linearGradient id="cockpitGlass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4A525D" />
      <stop offset="45%" stop-color="#22262C" />
      <stop offset="100%" stop-color="#111317" />
    </linearGradient>

    <!-- 左側斜向銀橘金屬高光反光漸層 -->
    <linearGradient id="orangeDiagonalSheen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.85" />
      <stop offset="45%" stop-color="#FFE0C2" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#FF9A44" stop-opacity="0" />
    </linearGradient>

    <!-- 垂直尾翼尾燈發光漸層 -->
    <linearGradient id="tailBeacon" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8C2D04" />
      <stop offset="55%" stop-color="#C92A2A" />
      <stop offset="85%" stop-color="#FF3B1F" />
      <stop offset="100%" stop-color="#FFCC80" />
    </linearGradient>
  </defs>

  <!-- 整機群組套用柔和深古銅懸浮陰影 -->
  <g filter="url(#orangeHoverShadow)">

    <!-- 1. 左右引擎 (位於主翼前緣下方) -->
    <!-- 左引擎 -->
    <g>
      <rect x="74" y="84" width="14" height="22" rx="4.5" fill="url(#engineOrangeGrad)" stroke="#4D1602" stroke-width="2" />
      <path d="M 76 87 Q 81 85 86 87" fill="none" stroke="#FFF2E6" stroke-width="1.3" stroke-linecap="round" opacity="0.9" />
    </g>
    <!-- 右引擎 -->
    <g>
      <rect x="152" y="84" width="14" height="22" rx="4.5" fill="url(#engineOrangeGrad)" stroke="#4D1602" stroke-width="2" />
      <path d="M 154 87 Q 159 85 164 87" fill="none" stroke="#FFF2E6" stroke-width="1.3" stroke-linecap="round" opacity="0.9" />
    </g>

    <!-- 2. 左右主翼 -->
    <!-- 左主翼 -->
    <path d="M 105 90 L 42 127 C 37 130 35 134 35 140 L 35 147 C 35 149 37 150 39 149 L 92 132 L 105 132 Z" fill="url(#leftWingOrangeGrad)" stroke="#4D1602" stroke-width="2.2" stroke-linejoin="round" />
    <!-- 左翼前緣高光與翼面折線 -->
    <path d="M 103 93 L 44 128 C 40 131 38 134 38 139" fill="none" stroke="#FFEBD6" stroke-width="1.6" stroke-linecap="round" opacity="0.88" />
    <path d="M 103 124 L 84 124 L 40 142" fill="none" stroke="#611D03" stroke-width="1.2" opacity="0.65" />

    <!-- 右主翼 -->
    <path d="M 135 90 L 198 127 C 203 130 205 134 205 140 L 205 147 C 205 149 203 150 201 149 L 148 132 L 135 132 Z" fill="url(#rightWingOrangeGrad)" stroke="#4D1602" stroke-width="2.2" stroke-linejoin="round" />
    <!-- 右翼前緣高光與翼面折線 -->
    <path d="M 137 93 L 196 128 C 200 131 202 134 202 139" fill="none" stroke="#FFD9B3" stroke-width="1.4" stroke-linecap="round" opacity="0.75" />
    <path d="M 137 124 L 156 124 L 200 142" fill="none" stroke="#611D03" stroke-width="1.2" opacity="0.65" />

    <!-- 3. 左右水平尾翼 -->
    <!-- 左水平尾翼 -->
    <path d="M 109 175 L 78 193 C 75 195 74 197 74 200 L 74 205 C 74 207 76 208 78 207 L 111 196 Z" fill="url(#leftWingOrangeGrad)" stroke="#4D1602" stroke-width="2.2" stroke-linejoin="round" />
    <path d="M 108 178 L 80 194" fill="none" stroke="#FFEBD6" stroke-width="1.2" stroke-linecap="round" opacity="0.85" />

    <!-- 右水平尾翼 -->
    <path d="M 131 175 L 162 193 C 165 195 166 197 166 200 L 166 205 C 166 207 164 208 162 207 L 129 196 Z" fill="url(#rightWingOrangeGrad)" stroke="#4D1602" stroke-width="2.2" stroke-linejoin="round" />
    <path d="M 132 178 L 160 194" fill="none" stroke="#FFD9B3" stroke-width="1.1" stroke-linecap="round" opacity="0.7" />

    <!-- 4. 機身主體 (深古銅外框線確保在任何淺灰/白色地圖上輪廓鮮明) -->
    <path d="M 120 20
             C 132 20 137 42 137 64
             L 137 156
             C 137 182 127 206 120 206
             C 113 206 103 182 103 156
             L 103 64
             C 103 42 108 20 120 20 Z" fill="url(#fuselageSilverOrange)" stroke="#4D1602" stroke-width="2.4" />

    <!-- 機身中央金屬銀橘光澤帶 -->
    <path d="M 120 24
             C 129 24 133 44 133 65
             L 133 155
             C 133 178 125 201 120 201
             C 115 201 107 178 107 155
             L 107 65
             C 107 44 111 24 120 24 Z" fill="url(#fuselageOrangeSheen)" />

    <!-- 機鼻與機身左側斜向高光反光，重現銀底橘漆金屬質感 -->
    <!-- 機鼻高光 -->
    <path d="M 111 35 C 113 26 117 23 120 23 C 123 23 126 26 128 33 C 123 30 116 31 111 35 Z" fill="#FFF8F0" opacity="0.82" />
    <!-- 機身左側斜向高光反光帶 -->
    <path d="M 110 62 L 122 52 L 122 142 L 110 154 Z" fill="url(#orangeDiagonalSheen)" />
    <path d="M 106 58 C 106 43 110 29 116 25" fill="none" stroke="#FFF2E6" stroke-width="1.6" stroke-linecap="round" opacity="0.9" />

    <!-- 5. 駕駛艙擋風玻璃與反光 -->
    <path d="M 107 57
             C 107 46 113 40 120 40
             C 127 40 133 46 133 57
             C 133 60 130 61 128 59
             C 125 56 122 55 120 55
             C 118 55 115 56 112 59
             C 110 61 107 60 107 57 Z" fill="url(#cockpitGlass)" stroke="#23140D" stroke-width="1.2" />
    <!-- 玻璃窗框分割線與斜向反光 -->
    <path d="M 120 40 L 120 55 M 113 43 L 115 56 M 127 43 L 125 56" stroke="#592208" stroke-width="1.1" opacity="0.85" />
    <polygon points="113,44 116,42 114,54 111,55" fill="#FFF2E6" opacity="0.4" />
    <polygon points="117,42 119,41 117,54 115,54" fill="#FFF2E6" opacity="0.25" />

    <!-- 6. 機身兩側長條客艙舷窗 -->
    <!-- 左側舷窗條 -->
    <rect x="106.5" y="70" width="2.8" height="68" rx="1.4" fill="#1D2026" />
    <line x1="107.9" y1="88" x2="107.9" y2="95" stroke="#E0C3A8" stroke-width="1.2" stroke-linecap="round" />
    <line x1="107.9" y1="101" x2="107.9" y2="108" stroke="#E0C3A8" stroke-width="1.2" stroke-linecap="round" />

    <!-- 右側舷窗條 -->
    <rect x="130.7" y="70" width="2.8" height="68" rx="1.4" fill="#1D2026" />
    <line x1="132.1" y1="88" x2="132.1" y2="95" stroke="#E0C3A8" stroke-width="1.2" stroke-linecap="round" />
    <line x1="132.1" y1="101" x2="132.1" y2="108" stroke="#E0C3A8" stroke-width="1.2" stroke-linecap="round" />

    <!-- 7. 垂直尾翼與尾部航行燈 -->
    <path d="M 120 158
             C 122 158 123 176 122.2 198
             C 121.8 202 120.8 204 120 204
             C 119.2 204 118.2 202 117.8 198
             C 117 176 118 158 120 158 Z" fill="url(#tailBeacon)" stroke="#4D1602" stroke-width="1.3" />
    <!-- 尾端亮紅光點 -->
    <ellipse cx="120" cy="197" rx="1.3" ry="4.5" fill="#FF6B4A" opacity="0.95" />

  </g>
</svg>