<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <!-- 主體橫向金屬烤漆漸層：亮天藍 (#87B8FF) 至 鈷藍 (#2D5FBD) -->
    <linearGradient id="metallicBlue" x1="0%" y1="15%" x2="100%" y2="85%">
      <stop offset="0%" stop-color="#87B8FF" />
      <stop offset="35%" stop-color="#5B93E6" />
      <stop offset="75%" stop-color="#3B72D1" />
      <stop offset="100%" stop-color="#2D5FBD" />
    </linearGradient>

    <!-- 左側冰藍色高光反光漸層 -->
    <linearGradient id="iceHighlight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EBF5FF" stop-opacity="0.95" />
      <stop offset="40%" stop-color="#A8CEFF" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#2D5FBD" stop-opacity="0" />
    </linearGradient>

    <!-- 棋盤格內層微凹光影 -->
    <linearGradient id="innerRim" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#9BC5FF" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#1E438A" stop-opacity="0.3" />
    </linearGradient>

    <!-- 柔和深藍色底部懸浮陰影濾鏡 -->
    <filter id="floatingShadow" x="-20%" y="-20%" width="140%" height="145%">
      <feDropShadow dx="0" dy="10" stdDeviation="7" flood-color="#0E244D" flood-opacity="0.38" />
      <feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-color="#1B3F82" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- 整體套用懸浮陰影，背景完全透明 -->
  <g filter="url(#floatingShadow)">
    
    <!-- 1. 外圓環主體 -->
    <circle cx="128" cy="124" r="96" fill="none" stroke="url(#metallicBlue)" stroke-width="11" />
    <!-- 外圓環左側冰藍高光反光 -->
    <path d="M 60 192 A 96 96 0 0 1 196 56" fill="none" stroke="url(#iceHighlight)" stroke-width="3.5" stroke-linecap="round" />
    <!-- 外圓環右側金屬邊緣微光 -->
    <path d="M 196 56 A 96 96 0 0 1 60 192" fill="none" stroke="#1F4691" stroke-width="1.5" stroke-opacity="0.4" />

    <!-- 2. 旗幟主體（採用 evenodd 挖空白色方格，確保透明穿透） -->
    <g transform="translate(2, -2)">
      <!-- 旗桿與波浪旗面底色 -->
      <path fill="url(#metallicBlue)" fill-rule="evenodd" d="
        M 72 80
        C 68.5 81, 66.5 84.5, 67.5 88
        L 94 188
        C 95 191.5, 98.5 193.5, 102 192.5
        C 105.5 191.5, 107.5 188, 106.5 184.5
        L 98.5 154
        C 113 145, 128 147, 143 151
        C 158 155, 173 156, 188 147
        C 190.5 145.5, 191.8 142.5, 191 139.5
        L 175 79
        C 174 75.5, 170 74, 167 76
        C 154 84, 140 83, 126 79
        C 111 75, 95 73, 78 80
        Z

        /* 挖空方格：第1列第1格 (左上白格) */
        M 82 88
        C 91 84.5, 99 84.5, 107 86
        L 111 101
        C 103 99.5, 95 99.5, 86 103
        Z

        /* 挖空方格：第1列第3格 (中上白格) */
        M 129 90.5
        C 137 92.5, 145 93, 152 91.5
        L 156 106.5
        C 149 108, 141 107.5, 133 105.5
        Z

        /* 挖空方格：第2列第2格 (中左白格) */
        M 111 101
        C 118 102.5, 125 104, 133 105.5
        L 137 121
        C 129 119.5, 122 118, 115 116.5
        Z

        /* 挖空方格：第2列第4格 (右中白格) */
        M 156 106.5
        C 162 105, 167 102.5, 172 99
        L 176 114.5
        C 171 118, 166 120.5, 160 122
        Z

        /* 挖空方格：第3列第1格 (左下白格) */
        M 90 118.5
        C 99 115, 107 115, 115 116.5
        L 119 132
        C 111 130.5, 103 130.5, 94 134
        Z

        /* 挖空方格：第3列第3格 (中下白格) */
        M 137 121
        C 145 123, 153 123.5, 160 122
        L 164 137.5
        C 157 139, 149 138.5, 141 136.5
        Z
      " />

      <!-- 旗桿左側冰藍色烤漆高光線 -->
      <path d="M 71 85 L 97.5 186" fill="none" stroke="#E0F0FF" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.85" />
      
      <!-- 旗面上緣冰藍色高光反光 -->
      <path d="M 78 82 C 95 75.5, 111 77.5, 126 81.5 C 140 85.5, 154 86.5, 167 78.5" fill="none" stroke="#D9ECFF" stroke-width="2.2" stroke-linecap="round" stroke-opacity="0.8" />
    </g>
  </g>
</svg>