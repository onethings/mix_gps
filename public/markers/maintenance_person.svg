<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <!-- 金屬烤漆光澤：亮鈦合金炭灰 (#6E7682) 至 深曜石純黑 (#0E1013) 橫向多段金屬漸層 -->
    <linearGradient id="metallicBlackBody" x1="0%" y1="35%" x2="100%" y2="65%">
      <stop offset="0%" stop-color="#6E7682" />
      <stop offset="28%" stop-color="#2E333B" />
      <stop offset="55%" stop-color="#4B525E" />
      <stop offset="82%" stop-color="#1B1E24" />
      <stop offset="100%" stop-color="#0E1013" />
    </linearGradient>

    <!-- 高光銀灰與純黑交織外框線漸層 (確保黑色系在深色夜間地圖與淺色地圖上皆具清晰立體輪廓) -->
    <linearGradient id="metallicBlackRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8A93A0" />
      <stop offset="50%" stop-color="#252930" />
      <stop offset="100%" stop-color="#050608" />
    </linearGradient>

    <!-- 左側冷銀白高光反光漸層 -->
    <linearGradient id="leftTitaniumSheen" x1="0%" y1="10%" x2="85%" y2="80%">
      <stop offset="0%" stop-color="#F5F8FC" stop-opacity="0.72" />
      <stop offset="35%" stop-color="#B0BAC9" stop-opacity="0.34" />
      <stop offset="65%" stop-color="#E1E8F2" stop-opacity="0.0" />
    </linearGradient>

    <!-- 柔和的深曜石黑底部懸浮陰影 (背景 100% 透明) -->
    <filter id="blackDropShadow" x="-45%" y="-45%" width="190%" height="190%">
      <feDropShadow dx="0" dy="3.2" stdDeviation="5.2" flood-color="#000000" flood-opacity="0.65" />
      <feDropShadow dx="0" dy="1.2" stdDeviation="2.0" flood-color="#16191F" flood-opacity="0.78" />
    </filter>

    <!-- 左鞋前掌與鞋跟裁切路徑 -->
    <clipPath id="leftSoleClip">
      <path d="M 38 30 C 47 30, 52 40, 50 53 C 49 60, 46 64, 46 68 L 31 68 C 31 64, 28 59, 27 51 C 25 39, 30 30, 38 30 Z" />
    </clipPath>
    <clipPath id="leftHeelClip">
      <path d="M 31 73 L 46 73 L 46 84 C 46 90, 43 94, 38.5 94 C 34 94, 31 90, 31 84 Z" />
    </clipPath>

    <!-- 右鞋前掌與鞋跟裁切路徑 -->
    <clipPath id="rightSoleClip">
      <path d="M 82 18 C 90 18, 95 27, 93 39 C 92 47, 89 52, 89 56 L 74 56 C 74 52, 71 48, 70 41 C 68 28, 73 18, 82 18 Z" />
    </clipPath>
    <clipPath id="rightHeelClip">
      <path d="M 74 61 L 89 61 L 89 72 C 89 78, 86 82, 81.5 82 C 77 82, 74 78, 74 72 Z" />
    </clipPath>
  </defs>

  <!-- 雙鞋印主體 (完全保留上一版鞋印造型、比例與正上方朝向，背景 100% 透明) -->
  <g filter="url(#blackDropShadow)">
    <!-- 左鞋前掌 -->
    <path d="M 38 30 C 47 30, 52 40, 50 53 C 49 60, 46 64, 46 68 L 31 68 C 31 64, 28 59, 27 51 C 25 39, 30 30, 38 30 Z" fill="url(#metallicBlackBody)" stroke="url(#metallicBlackRim)" stroke-width="1.7" />
    <!-- 左鞋跟 -->
    <path d="M 31 73 L 46 73 L 46 84 C 46 90, 43 94, 38.5 94 C 34 94, 31 90, 31 84 Z" fill="url(#metallicBlackBody)" stroke="url(#metallicBlackRim)" stroke-width="1.7" />

    <!-- 左鞋左側冷銀白高光反光 -->
    <g clip-path="url(#leftSoleClip)">
      <polygon points="22,28 43,28 32,70 18,70" fill="url(#leftTitaniumSheen)" />
      <path d="M 31 37 C 29 44, 29 51, 31 58" fill="none" stroke="#E8EEF5" stroke-width="1.6" stroke-linecap="round" stroke-opacity="0.72" />
    </g>
    <g clip-path="url(#leftHeelClip)">
      <polygon points="26,72 40,72 34,96 24,96" fill="url(#leftTitaniumSheen)" />
    </g>

    <!-- 右鞋前掌 -->
    <path d="M 82 18 C 90 18, 95 27, 93 39 C 92 47, 89 52, 89 56 L 74 56 C 74 52, 71 48, 70 41 C 68 28, 73 18, 82 18 Z" fill="url(#metallicBlackBody)" stroke="url(#metallicBlackRim)" stroke-width="1.7" />
    <!-- 右鞋跟 -->
    <path d="M 74 61 L 89 61 L 89 72 C 89 78, 86 82, 81.5 82 C 77 82, 74 78, 74 72 Z" fill="url(#metallicBlackBody)" stroke="url(#metallicBlackRim)" stroke-width="1.7" />

    <!-- 右鞋左側冷銀白高光反光 -->
    <g clip-path="url(#rightSoleClip)">
      <polygon points="65,16 86,16 75,58 61,58" fill="url(#leftTitaniumSheen)" />
      <path d="M 74 25 C 72 32, 72 39, 74 46" fill="none" stroke="#E8EEF5" stroke-width="1.6" stroke-linecap="round" stroke-opacity="0.72" />
    </g>
    <g clip-path="url(#rightHeelClip)">
      <polygon points="69,60 83,60 77,84 67,84" fill="url(#leftTitaniumSheen)" />
    </g>
  </g>
</svg>