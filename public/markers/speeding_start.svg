<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <defs>
    <!-- 柔和深焦糖褐與暖琥珀金外光暈懸浮陰影濾鏡（背景 100% 透明） -->
    <filter id="metallicOrangeGlowShadow" x="-30%" y="-30%" width="160%" height="165%">
      <!-- 底部柔和深焦糖褐懸浮陰影 -->
      <feGaussianBlur in="SourceAlpha" stdDeviation="7.5" result="blurShadow" />
      <feOffset in="blurShadow" dx="0" dy="6.5" result="offsetShadow" />
      <feFlood flood-color="#291003" flood-opacity="0.54" result="colorShadow" />
      <feComposite in="colorShadow" in2="offsetShadow" operator="in" result="deepEspressoShadow" />

      <!-- 周圍微凝聚烈焰橘邊緣光暈（提升淺色與深色地圖辨識度） -->
      <feGaussianBlur in="SourceAlpha" stdDeviation="2.6" result="blurRim" />
      <feFlood flood-color="#D9530F" flood-opacity="0.46" result="colorRim" />
      <feComposite in="colorRim" in2="blurRim" operator="in" result="softAmberRim" />

      <feMerge>
        <feMergeNode in="deepEspressoShadow" />
        <feMergeNode in="softAmberRim" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- 橫向金屬烤漆橘主漸層（亮杏桃金 #FFD28F -> 耀眼電鍍橘 #FF7A1A -> 深赤銅橘 #C43D08 -> 焦糖暗褐 #4A1604） -->
    <linearGradient id="metallicOrangeMainGrad" x1="0%" y1="30%" x2="100%" y2="70%">
      <stop offset="0%" stop-color="#FFD28F" />
      <stop offset="22%" stop-color="#FF942E" />
      <stop offset="50%" stop-color="#FF620A" />
      <stop offset="78%" stop-color="#B83506" />
      <stop offset="100%" stop-color="#4A1604" />
    </linearGradient>

    <!-- 外環立體陽極氧化金屬橘漸層 -->
    <linearGradient id="ringMetallicOrangeGrad" x1="0%" y1="15%" x2="100%" y2="85%">
      <stop offset="0%" stop-color="#FFC675" />
      <stop offset="26%" stop-color="#FF7A1A" />
      <stop offset="58%" stop-color="#A83207" />
      <stop offset="82%" stop-color="#3D1405" />
      <stop offset="100%" stop-color="#E65A0E" />
    </linearGradient>

    <!-- 深赤褐與炭銅棕高對比外框線（確保純白與淺灰地圖清晰辨識） -->
    <linearGradient id="darkCopperOutlineGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5E2109" />
      <stop offset="50%" stop-color="#381104" />
      <stop offset="100%" stop-color="#1F0801" />
    </linearGradient>

    <!-- 內側香檳金橘金屬倒角高光線 -->
    <linearGradient id="orangeInnerBevelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF2DC" stop-opacity="0.98" />
      <stop offset="35%" stop-color="#FFBD6B" stop-opacity="0.9" />
      <stop offset="72%" stop-color="#B83506" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#FFD494" stop-opacity="0.9" />
    </linearGradient>

    <!-- 左側斜向香檳金白鏡面高光反光漸層 -->
    <linearGradient id="orangeSpecularGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF6E8" stop-opacity="0.72" />
      <stop offset="38%" stop-color="#FFCA80" stop-opacity="0.36" />
      <stop offset="75%" stop-color="#FF7A1A" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#4A1604" stop-opacity="0" />
    </linearGradient>

    <!-- 旗面（含中空五角星）的複合路徑與裁切 -->
    <mask id="flagStarMask">
      <rect x="0" y="0" width="300" height="300" fill="white" />
      <!-- 中央鏤空五角星（保持地圖底圖 100% 透明穿透） -->
      <polygon points="154,107 162.5,124.2 181.5,127 167.8,140.4 171,159.3 154,150.4 137,159.3 140.2,140.4 126.5,127 145.5,124.2" fill="black" />
    </mask>

    <clipPath id="flagBodyClip">
      <path d="M 85 95 C 115 74, 152 80, 178 86 C 194 89, 205 83, 212 76 L 226 164 C 216 173, 202 178, 185 174 C 158 168, 125 166, 102 184 L 85 95 Z" />
    </clipPath>

    <clipPath id="ringClip">
      <path fill-rule="evenodd" d="M 150 28 A 122 122 0 1 0 150 272 A 122 122 0 1 0 150 28 Z M 150 40 A 110 110 0 1 1 150 260 A 110 110 0 1 1 150 40 Z" />
    </clipPath>
  </defs>

  <!-- 整體套用柔和深焦糖褐懸浮陰影與琥珀橘微暈 -->
  <g filter="url(#metallicOrangeGlowShadow)">

    <!-- 1. 外圍精密幾何金屬橘圓環 -->
    <g>
      <!-- 圓環立體深炭褐陰影底座 -->
      <circle cx="151" cy="152.5" r="116" fill="none" stroke="#240A02" stroke-width="12.5" opacity="0.82" />
      <!-- 圓環主體陽極氧化金屬橘漸層 -->
      <circle cx="150" cy="150" r="116" fill="none" stroke="url(#ringMetallicOrangeGrad)" stroke-width="11" />
      <!-- 圓環左側及上半部香檳金斜向鏡面高光 -->
      <g clip-path="url(#ringClip)">
        <path d="M 20 155 Q 135 100 265 65 L 265 15 L 20 15 Z" fill="url(#orangeSpecularGrad)" />
      </g>
      <!-- 圓環內側香檳金橘倒角高光線 -->
      <circle cx="150" cy="150" r="120.2" fill="none" stroke="url(#orangeInnerBevelGrad)" stroke-width="1.2" />
      <circle cx="150" cy="150" r="111.5" fill="none" stroke="url(#orangeInnerBevelGrad)" stroke-width="1.1" />
      <!-- 圓環最外緣與最內緣深赤褐外框線（確保淺色地圖清晰辨識） -->
      <circle cx="150" cy="150" r="121.6" fill="none" stroke="url(#darkCopperOutlineGrad)" stroke-width="1.5" />
      <circle cx="150" cy="150" r="110.4" fill="none" stroke="url(#darkCopperOutlineGrad)" stroke-width="1.4" />
    </g>

    <!-- 2. 精密幾何金屬橘星形旗幟與旗桿 -->
    <g>
      <!-- 旗幟與旗桿立體厚度暗銅褐陰影層 -->
      <g transform="translate(2, 2.8)" mask="url(#flagStarMask)">
        <path d="M 79 94 C 78.2 89, 85.8 87.8, 86.8 92.8 L 87.2 94.5 C 116 74, 152 80, 178 86 C 194 89, 205 83, 212 76 L 226 164 C 216 173, 202 178, 185 174 C 158 168, 125 166, 102 184 L 109.5 227 C 110.3 232, 102.7 233.3, 101.8 228.3 L 79 94 Z" fill="#331003" />
      </g>

      <!-- 旗幟與旗桿主體（套用五角星透明遮罩） -->
      <g mask="url(#flagStarMask)">
        <!-- 旗桿 + 旗面主金屬橘橫向漸層 -->
        <path d="M 79 94 C 78.2 89, 85.8 87.8, 86.8 92.8 L 87.2 94.5 C 116 74, 152 80, 178 86 C 194 89, 205 83, 212 76 L 226 164 C 216 173, 202 178, 185 174 C 158 168, 125 166, 102 184 L 109.5 227 C 110.3 232, 102.7 233.3, 101.8 228.3 L 79 94 Z" fill="url(#metallicOrangeMainGrad)" />

        <!-- 旗面左側斜向香檳金橘烤漆高光反光帶 -->
        <g clip-path="url(#flagBodyClip)">
          <polygon points="72,68 158,68 118,195 65,195" fill="url(#orangeSpecularGrad)" />
          <path d="M 75 70 L 225 65 L 228 106 Q 145 118 88 142 Z" fill="url(#orangeSpecularGrad)" opacity="0.72" />
        </g>

        <!-- 旗桿左側暖金白圓柱高光反光線 -->
        <line x1="82.5" y1="93" x2="104.5" y2="226" stroke="#FFF4E0" stroke-width="2" stroke-linecap="round" opacity="0.88" />
      </g>

      <!-- 旗幟內層香檳金橘倒角高光描邊 -->
      <path d="M 79 94 C 78.2 89, 85.8 87.8, 86.8 92.8 L 87.2 94.5 C 116 74, 152 80, 178 86 C 194 89, 205 83, 212 76 L 226 164 C 216 173, 202 178, 185 174 C 158 168, 125 166, 102 184 L 109.5 227 C 110.3 232, 102.7 233.3, 101.8 228.3 L 79 94 Z" fill="none" stroke="url(#orangeInnerBevelGrad)" stroke-width="2.1" stroke-linejoin="round" />

      <!-- 旗幟最外緣深赤褐外框線 -->
      <path d="M 79 94 C 78.2 89, 85.8 87.8, 86.8 92.8 L 87.2 94.5 C 116 74, 152 80, 178 86 C 194 89, 205 83, 212 76 L 226 164 C 216 173, 202 178, 185 174 C 158 168, 125 166, 102 184 L 109.5 227 C 110.3 232, 102.7 233.3, 101.8 228.3 L 79 94 Z" fill="none" stroke="url(#darkCopperOutlineGrad)" stroke-width="1.3" stroke-linejoin="round" />

      <!-- 中央鏤空五角星香檳金橘倒角與深赤褐雙層描邊 -->
      <polygon points="154,107 162.5,124.2 181.5,127 167.8,140.4 171,159.3 154,150.4 137,159.3 140.2,140.4 126.5,127 145.5,124.2" fill="none" stroke="url(#orangeInnerBevelGrad)" stroke-width="2.2" stroke-linejoin="round" />
      <polygon points="154,107 162.5,124.2 181.5,127 167.8,140.4 171,159.3 154,150.4 137,159.3 140.2,140.4 126.5,127 145.5,124.2" fill="none" stroke="url(#darkCopperOutlineGrad)" stroke-width="1.2" stroke-linejoin="round" />
    </g>

  </g>
</svg>