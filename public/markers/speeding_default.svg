<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- 橙色狀態光暈與底部懸浮陰影（背景 100% 透明） -->
    <filter id="metallicOrangeShadow" x="-30%" y="-25%" width="160%" height="165%">
      <!-- 底部柔和深棕橙懸浮影 -->
      <feGaussianBlur in="SourceAlpha" stdDeviation="4.2" result="blurShadow" />
      <feOffset in="blurShadow" dx="0" dy="4.5" result="offsetShadow" />
      <feFlood flood-color="#5C2400" flood-opacity="0.44" result="colorShadow" />
      <feComposite in="colorShadow" in2="offsetShadow" operator="in" result="dropShadowMain" />

      <!-- 內層微暖琥珀光暈（提升淺色地圖辨識度） -->
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.8" result="blurGlow" />
      <feFlood flood-color="#D95300" flood-opacity="0.38" result="colorGlow" />
      <feComposite in="colorGlow" in2="blurGlow" operator="in" result="innerGlow" />

      <feMerge>
        <feMergeNode in="dropShadowMain" />
        <feMergeNode in="innerGlow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- 橫向金屬橙烤漆主漸層：亮琥珀金橙 (#FFB84D) 至 深焦糖橘 (#C84600) -->
    <linearGradient id="metallicOrangeBase" x1="0%" y1="45%" x2="100%" y2="55%">
      <stop offset="0%" stop-color="#FFB84D" />
      <stop offset="28%" stop-color="#FF8A1E" />
      <stop offset="65%" stop-color="#EB6105" />
      <stop offset="100%" stop-color="#C84600" />
    </linearGradient>

    <!-- 中心箭頭專用橫向金屬橙漸層（確保箭頭寬度內完整呈現亮橙至深橘過渡） -->
    <linearGradient id="arrowOrangeBase" x1="0%" y1="45%" x2="100%" y2="55%">
      <stop offset="0%" stop-color="#FFB84D" />
      <stop offset="32%" stop-color="#FF8A1E" />
      <stop offset="68%" stop-color="#EB6105" />
      <stop offset="100%" stop-color="#C84600" />
    </linearGradient>

    <!-- 左側暖金高光反光漸層 -->
    <linearGradient id="orangeLeftGloss" x1="0%" y1="20%" x2="72%" y2="80%">
      <stop offset="0%" stop-color="#FFF5E0" stop-opacity="0.75" />
      <stop offset="34%" stop-color="#FFD48A" stop-opacity="0.32" />
      <stop offset="64%" stop-color="#FFB84D" stop-opacity="0" />
    </linearGradient>

    <!-- 裁切路徑：確保金屬高光只作用在圓環與箭頭本體上 -->
    <clipPath id="orangeIconClip">
      <path fill-rule="evenodd" d="M64,14 A50,50 0 1,0 64,114 A50,50 0 1,0 64,14 Z M64,22 A42,42 0 1,1 64,106 A42,42 0 1,1 64,22 Z" />
      <path d="M64,37 C65.8,37 67.3,38.1 68.2,39.8 L86.5,75.8 C87.8,78.4 85.4,81.2 82.6,80.2 L65.5,74.1 C64.5,73.7 63.5,73.7 62.5,74.1 L45.4,80.2 C42.6,81.2 40.2,78.4 41.5,75.8 L59.8,39.8 C60.7,38.1 62.2,37 64,37 Z" />
    </clipPath>
  </defs>

  <!-- 主圖層（套用深棕橙底部懸浮陰影與微光暈，背景 100% 透明） -->
  <g filter="url(#metallicOrangeShadow)">
    <!-- 1. 外圓環金屬橙主體 + 深赤褐外框線 (#8C2D00) -->
    <path fill-rule="evenodd" d="M64,14 A50,50 0 1,0 64,114 A50,50 0 1,0 64,14 Z M64,22 A42,42 0 1,1 64,106 A42,42 0 1,1 64,22 Z" fill="url(#metallicOrangeBase)" stroke="#8C2D00" stroke-width="1.5" stroke-linejoin="round" />

    <!-- 2. 中心導航箭頭金屬橙主體 + 深赤褐外框線 (#8C2D00) -->
    <path d="M64,37 C65.8,37 67.3,38.1 68.2,39.8 L86.5,75.8 C87.8,78.4 85.4,81.2 82.6,80.2 L65.5,74.1 C64.5,73.7 63.5,73.7 62.5,74.1 L45.4,80.2 C42.6,81.2 40.2,78.4 41.5,75.8 L59.8,39.8 C60.7,38.1 62.2,37 64,37 Z" fill="url(#arrowOrangeBase)" stroke="#8C2D00" stroke-width="1.5" stroke-linejoin="round" />

    <!-- 3. 左側暖金高光反光層 -->
    <g clip-path="url(#orangeIconClip)">
      <!-- 斜向清漆反光帶 -->
      <polygon points="8,10 66,10 36,118 -12,118" fill="url(#orangeLeftGloss)" />
      <!-- 外環左側亮金橙弧形高光線 -->
      <path d="M20,46 A46,46 0 0,1 54,18" fill="none" stroke="#FFF5E0" stroke-width="1.8" stroke-linecap="round" opacity="0.82" />
      <!-- 箭頭左側斜邊亮金橙高光 -->
      <line x1="62.5" y1="40.5" x2="44.5" y2="75.5" stroke="#FFE6B8" stroke-width="1.6" stroke-linecap="round" opacity="0.85" />
    </g>
  </g>
</svg>