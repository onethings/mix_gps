<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <defs>
    <!-- 柔和深藍色底部懸浮陰影濾鏡（背景 100% 透明） -->
    <filter id="skyBlueFloatShadow" x="-30%" y="-30%" width="160%" height="165%">
      <!-- 底部柔和懸浮大陰影 -->
      <feGaussianBlur in="SourceAlpha" stdDeviation="8" result="blurShadow" />
      <feOffset in="blurShadow" dx="0" dy="7" result="offsetShadow" />
      <feFlood flood-color="#102A63" flood-opacity="0.52" result="colorShadow" />
      <feComposite in="colorShadow" in2="offsetShadow" operator="in" result="deepBlueShadow" />

      <!-- 周圍微凝聚深藍邊緣暈光（提升淺色地圖辨識度） -->
      <feGaussianBlur in="SourceAlpha" stdDeviation="2.5" result="blurRim" />
      <feFlood flood-color="#1E4694" flood-opacity="0.45" result="colorRim" />
      <feComposite in="colorRim" in2="blurRim" operator="in" result="softBlueRim" />

      <feMerge>
        <feMergeNode in="deepBlueShadow" />
        <feMergeNode in="softBlueRim" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- 橫向金屬烤漆主漸層（亮天藍 #87B8FF 至 鈷藍 #2D5FBD） -->
    <linearGradient id="metallicSkyBlueGrad" x1="0%" y1="35%" x2="100%" y2="65%">
      <stop offset="0%" stop-color="#A6CEFF" />
      <stop offset="22%" stop-color="#87B8FF" />
      <stop offset="52%" stop-color="#4B82DB" />
      <stop offset="80%" stop-color="#2D5FBD" />
      <stop offset="100%" stop-color="#1D438F" />
    </linearGradient>

    <!-- 外環立體橫向金屬漸層 -->
    <linearGradient id="ringSkyBlueGrad" x1="0%" y1="20%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#9EC7FF" />
      <stop offset="30%" stop-color="#87B8FF" />
      <stop offset="65%" stop-color="#2D5FBD" />
      <stop offset="100%" stop-color="#1C3F87" />
    </linearGradient>

    <!-- 冰藍色與亮銀藍金屬倒角描邊漸層 -->
    <linearGradient id="iceBevelStrokeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0F8FF" stop-opacity="0.98" />
      <stop offset="35%" stop-color="#B8DCFF" stop-opacity="0.9" />
      <stop offset="72%" stop-color="#244FA3" stop-opacity="0.92" />
      <stop offset="100%" stop-color="#87B8FF" stop-opacity="0.85" />
    </linearGradient>

    <!-- 左側冰藍色斜向高光反光漸層 -->
    <linearGradient id="iceBlueSpecularGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.62" />
      <stop offset="40%" stop-color="#D6ECFF" stop-opacity="0.32" />
      <stop offset="80%" stop-color="#87B8FF" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#2D5FBD" stop-opacity="0" />
    </linearGradient>

    <!-- 旗面（含中空五角星）的複合路徑與裁切 -->
    <mask id="flagStarMask">
      <rect x="0" y="0" width="300" height="300" fill="white" />
      <!-- 中央鏤空五角星（保持地圖底圖 100% 透明穿透） -->
      <polygon points="154,107 162.5,124.2 181.5,127 167.8,140.4 171,159.3 154,150.4 137,159.3 140.2,140.4 126.5,127 145.5,124.2" fill="black" />
    </mask>

    <clipPath id="flagBodyClip">
      <path d="M 85 95 C 115 74, 152 80, 178 86 C 194 89, 205 83, 212 76 L 226 164 C 216 173, 202 178, 185 174 C 158 168, 125 166, 102 184 L 85 95 Z" />
    </clipPath>

    <clipPath id="ringClip">
      <path fill-rule="evenodd" d="M 150 28 A 122 122 0 1 0 150 272 A 122 122 0 1 0 150 28 Z M 150 40 A 110 110 0 1 1 150 260 A 110 110 0 1 1 150 40 Z" />
    </clipPath>
  </defs>

  <!-- 整體套用柔和深藍色底部懸浮陰影 -->
  <g filter="url(#skyBlueFloatShadow)">

    <!-- 1. 外圍精密幾何金屬圓環 -->
    <g>
      <!-- 圓環立體深藍陰影底座 -->
      <circle cx="151" cy="152.5" r="116" fill="none" stroke="#132D66" stroke-width="12" opacity="0.75" />
      <!-- 圓環主體天藍至鈷藍橫向漸層 -->
      <circle cx="150" cy="150" r="116" fill="none" stroke="url(#ringSkyBlueGrad)" stroke-width="11" />
      <!-- 圓環左側及上半部冰藍色斜向鏡面高光 -->
      <g clip-path="url(#ringClip)">
        <path d="M 20 155 Q 135 100 265 65 L 265 15 L 20 15 Z" fill="url(#iceBlueSpecularGrad)" />
      </g>
      <!-- 圓環外緣與內緣冰藍色金屬倒角高光線 -->
      <circle cx="150" cy="150" r="121.5" fill="none" stroke="url(#iceBevelStrokeGrad)" stroke-width="1.3" />
      <circle cx="150" cy="150" r="110.5" fill="none" stroke="url(#iceBevelStrokeGrad)" stroke-width="1.2" />
    </g>

    <!-- 2. 精密幾何星形旗幟與旗桿 -->
    <g>
      <!-- 旗幟與旗桿立體厚度深藍陰影層（營造立體浮雕厚實感） -->
      <g transform="translate(2, 2.8)" mask="url(#flagStarMask)">
        <path d="M 79 94 C 78.2 89, 85.8 87.8, 86.8 92.8 L 87.2 94.5 C 116 74, 152 80, 178 86 C 194 89, 205 83, 212 76 L 226 164 C 216 173, 202 178, 185 174 C 158 168, 125 166, 102 184 L 109.5 227 C 110.3 232, 102.7 233.3, 101.8 228.3 L 79 94 Z" fill="#11285C" />
      </g>

      <!-- 旗幟與旗桿主體（套用五角星透明遮罩） -->
      <g mask="url(#flagStarMask)">
        <!-- 旗桿 + 旗面亮天藍至鈷藍橫向金屬漸層 -->
        <path d="M 79 94 C 78.2 89, 85.8 87.8, 86.8 92.8 L 87.2 94.5 C 116 74, 152 80, 178 86 C 194 89, 205 83, 212 76 L 226 164 C 216 173, 202 178, 185 174 C 158 168, 125 166, 102 184 L 109.5 227 C 110.3 232, 102.7 233.3, 101.8 228.3 L 79 94 Z" fill="url(#metallicSkyBlueGrad)" />

        <!-- 旗面左側斜向冰藍色烤漆高光反光帶 -->
        <g clip-path="url(#flagBodyClip)">
          <polygon points="72,68 158,68 118,195 65,195" fill="url(#iceBlueSpecularGrad)" />
          <path d="M 75 70 L 225 65 L 228 106 Q 145 118 88 142 Z" fill="url(#iceBlueSpecularGrad)" opacity="0.7" />
        </g>

        <!-- 旗桿左側冰藍色圓柱高光反光線 -->
        <line x1="82.5" y1="93" x2="104.5" y2="226" stroke="#E3F2FF" stroke-width="2" stroke-linecap="round" opacity="0.75" />
      </g>

      <!-- 旗幟外輪廓冰藍色金屬倒角高光描邊 -->
      <path d="M 79 94 C 78.2 89, 85.8 87.8, 86.8 92.8 L 87.2 94.5 C 116 74, 152 80, 178 86 C 194 89, 205 83, 212 76 L 226 164 C 216 173, 202 178, 185 174 C 158 168, 125 166, 102 184 L 109.5 227 C 110.3 232, 102.7 233.3, 101.8 228.3 L 79 94 Z" fill="none" stroke="url(#iceBevelStrokeGrad)" stroke-width="1.4" stroke-linejoin="round" />

      <!-- 中央鏤空五角星內圈冰藍色金屬倒角描邊 -->
      <polygon points="154,107 162.5,124.2 181.5,127 167.8,140.4 171,159.3 154,150.4 137,159.3 140.2,140.4 126.5,127 145.5,124.2" fill="none" stroke="url(#iceBevelStrokeGrad)" stroke-width="1.6" stroke-linejoin="round" />
    </g>

  </g>
</svg>