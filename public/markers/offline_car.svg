<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 180" width="120" height="180">
  <defs>
    <!-- 金屬銀車身主漸層 -->
    <linearGradient id="silverBodyGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8E949C" />
      <stop offset="25%" stop-color="#C4C9D0" />
      <stop offset="50%" stop-color="#E4E8ED" />
      <stop offset="75%" stop-color="#C4C9D0" />
      <stop offset="100%" stop-color="#7D838B" />
    </linearGradient>

    <!-- 車頂銀灰光澤漸層 -->
    <linearGradient id="silverRoofGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2F5F8" stop-opacity="0.95" />
      <stop offset="55%" stop-color="#C2C7CE" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#8A9099" stop-opacity="0.95" />
    </linearGradient>

    <!-- 引擎蓋斜向金屬高光 -->
    <linearGradient id="silverHoodHighlight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.65" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <!-- 深色玻璃漸層 -->
    <linearGradient id="silverDarkGlassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141619" />
      <stop offset="45%" stop-color="#2D3138" />
      <stop offset="55%" stop-color="#191C20" />
      <stop offset="100%" stop-color="#0B0C0E" />
    </linearGradient>

    <!-- 柔和底部立體陰影 -->
    <filter id="silverDropShadow" x="-25%" y="-20%" width="150%" height="145%">
      <feDropShadow dx="0" dy="5" stdDeviation="4.5" flood-color="#1F2329" flood-opacity="0.32" />
    </filter>
  </defs>

  <g filter="url(#silverDropShadow)">
    <!-- 左右後視鏡 -->
    <path d="M26 62 L15 65 C13 66 13 70 16 71 L26 70 Z" fill="#A6ACB5" stroke="#6E737A" stroke-width="0.8" />
    <path d="M94 62 L105 65 C107 66 107 70 104 71 L94 70 Z" fill="#A6ACB5" stroke="#6E737A" stroke-width="0.8" />

    <!-- 車身主體輪廓 -->
    <path d="M60 14 
             C42 14, 28 24, 27 42 
             L26 138 
             C26 154, 38 164, 60 164 
             C82 164, 94 154, 94 138 
             L93 42 
             C92 24, 78 14, 60 14 Z" fill="url(#silverBodyGrad)" stroke="#686D75" stroke-width="1.5" />

    <!-- 車頭水箱護罩細節 -->
    <path d="M47 16 Q60 14 73 16 L70 19 Q60 17 50 19 Z" fill="#23262B" />

    <!-- 引擎蓋斜向金屬反光 -->
    <path d="M36 26 Q60 18 76 23 L65 51 Q52 49 41 53 Z" fill="url(#silverHoodHighlight)" />
    <!-- 引擎蓋折線 -->
    <path d="M38 30 L42 52 M82 30 L78 52" fill="none" stroke="#707680" stroke-width="1.2" opacity="0.55" />

    <!-- 前擋風玻璃 -->
    <path d="M35 55 C45 48, 75 48, 85 55 L80 74 C67 70, 53 70, 40 74 Z" fill="url(#silverDarkGlassGrad)" />
    <!-- 前擋風玻璃反光 -->
    <path d="M41 54 L56 51 L50 70 L39 69 Z" fill="#FFFFFF" opacity="0.22" />

    <!-- 側邊車窗與 B 柱 -->
    <path d="M30 61 L36 77 L36 116 L30 127 Z" fill="#141619" />
    <path d="M90 61 L84 77 L84 116 L90 127 Z" fill="#141619" />
    <!-- 側窗 B 柱分隔線 -->
    <line x1="30" y1="95" x2="36" y2="95" stroke="#999FA8" stroke-width="2.5" />
    <line x1="90" y1="95" x2="84" y2="95" stroke="#999FA8" stroke-width="2.5" />

    <!-- 後擋風玻璃 -->
    <path d="M39 122 C53 125, 67 125, 81 122 L84 139 C72 145, 48 145, 36 139 Z" fill="url(#silverDarkGlassGrad)" />
    <!-- 後擋風玻璃反光 -->
    <path d="M42 124 L55 125 L52 141 L39 138 Z" fill="#FFFFFF" opacity="0.15" />

    <!-- 車頂蓋 -->
    <rect x="39" y="75" width="42" height="45" rx="8" fill="url(#silverRoofGrad)" stroke="#7D838C" stroke-width="1" />
    <!-- 車頂左側高光 -->
    <path d="M41 78 L58 78 L52 117 L41 117 Z" fill="#FFFFFF" opacity="0.35" />

    <!-- 車頭燈 (冷白光) -->
    <path d="M31 27 Q37 21 45 22 Q39 27 32 32 Z" fill="#F7F9FC" />
    <path d="M89 27 Q83 21 75 22 Q81 27 88 32 Z" fill="#F7F9FC" />

    <!-- 車尾燈 (低調暗紅/熄滅狀態質感) -->
    <path d="M31 151 Q39 158 48 157 L46 153 Q39 154 33 148 Z" fill="#B83B3B" />
    <path d="M89 151 Q81 158 72 157 L74 153 Q81 154 87 148 Z" fill="#B83B3B" />
  </g>
</svg>