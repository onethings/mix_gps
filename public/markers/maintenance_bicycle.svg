<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 180" width="120" height="180">
  <defs>
    <!-- 柔和的純黑石墨底部懸浮陰影 (背景 100% 透明) -->
    <filter id="blackDropShadow" x="-30%" y="-20%" width="160%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#050709" flood-opacity="0.48" />
    </filter>

    <!-- 車身主體曜石黑金屬烤漆漸層 (bodyGrad：深淵黑 #0D1014 至 槍鐵灰高光 #586373) -->
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0D1014" />
      <stop offset="22%" stop-color="#1F242B" />
      <stop offset="48%" stop-color="#3C444F" />
      <stop offset="56%" stop-color="#586373" />
      <stop offset="78%" stop-color="#1F242B" />
      <stop offset="100%" stop-color="#080A0C" />
    </linearGradient>

    <!-- 車頂/後土除曜石黑烤漆光影漸層 (roofGrad) -->
    <linearGradient id="roofGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#697587" stop-opacity="0.88" />
      <stop offset="45%" stop-color="#2D343D" stop-opacity="0.88" />
      <stop offset="100%" stop-color="#0D1014" stop-opacity="0.92" />
    </linearGradient>

    <!-- 金屬黑漆面左側斜向冷銀高光反光漸層 -->
    <linearGradient id="obsidianSheen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0" stop-opacity="0.55" />
      <stop offset="50%" stop-color="#94A3B8" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#E2E8F0" stop-opacity="0" />
    </linearGradient>

    <!-- 消光深碳黑玻璃/橡膠質感漸層 (glassGrad) - 應用於座墊、輪胎與握把 -->
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#171B20" />
      <stop offset="35%" stop-color="#293038" />
      <stop offset="70%" stop-color="#161A1F" />
      <stop offset="100%" stop-color="#090B0D" />
    </linearGradient>

    <!-- 車頭燈 LED 晶鑽冷白光暈漸層 -->
    <radialGradient id="headlightGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95" />
      <stop offset="50%" stop-color="#CBD5E1" stop-opacity="0.38" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </radialGradient>

    <!-- 車尾燈紅光光暈漸層 -->
    <radialGradient id="taillightGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF4D4D" stop-opacity="0.9" />
      <stop offset="55%" stop-color="#FF3333" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#FF4D4D" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- 整體圖示群組 (套用柔和的底部懸浮陰影與中心對齊) -->
  <g filter="url(#blackDropShadow)">
    
    <!-- 1. 前後輪胎 (深碳橡膠材質) -->
    <rect x="56.5" y="10" width="7" height="32" rx="3.5" fill="url(#glassGrad)" stroke="#050709" stroke-width="1" />
    <rect x="56.5" y="138" width="7" height="32" rx="3.5" fill="url(#glassGrad)" stroke="#050709" stroke-width="1" />

    <!-- 2. 腳踏板與曲柄機構 -->
    <!-- 左曲柄與踏板 -->
    <path d="M56 96 L46 96 L46 102" fill="none" stroke="#2D343D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <rect x="36" y="98" width="14" height="9" rx="2" fill="url(#glassGrad)" stroke="#050709" stroke-width="1" />
    <line x1="38" y1="101" x2="48" y2="101" stroke="#475569" stroke-width="1.2" />
    <line x1="38" y1="104" x2="48" y2="104" stroke="#475569" stroke-width="1.2" />

    <!-- 右曲柄與踏板 -->
    <path d="M64 88 L74 88 L74 82" fill="none" stroke="#2D343D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <rect x="70" y="77" width="14" height="9" rx="2" fill="url(#glassGrad)" stroke="#050709" stroke-width="1" />
    <line x1="72" y1="80" x2="82" y2="80" stroke="#475569" stroke-width="1.2" />
    <line x1="72" y1="83" x2="82" y2="83" stroke="#475569" stroke-width="1.2" />

    <!-- 傳動鏈條與齒盤護蓋 -->
    <rect x="63.5" y="86" width="2.5" height="62" rx="1" fill="#161A1F" />

    <!-- 3. 車架主體 (曜石黑金屬烤漆橫向漸層 + 純黑高對比外框 #050709) -->
    <!-- 前叉肩蓋 -->
    <path d="M51 35 Q60 44 69 35" fill="none" stroke="url(#bodyGrad)" stroke-width="4.5" stroke-linecap="round" />
    <path d="M51 35 Q60 44 69 35" fill="none" stroke="#050709" stroke-width="1.15" />

    <!-- 主車架上管 / 下管融合體 -->
    <path d="M55.5 34 L64.5 34 L63.5 96 L56.5 96 Z" fill="url(#bodyGrad)" stroke="#050709" stroke-width="1.3" stroke-linejoin="round" />
    
    <!-- 車架中央冷銀折線與左側斜向高光反光 -->
    <line x1="60" y1="36" x2="60" y2="84" stroke="#94A3B8" stroke-width="1.4" stroke-opacity="0.72" stroke-linecap="round" />
    <!-- 左側斜向高光帶 -->
    <polygon points="56.5,40 61.5,36 61.5,46 56.5,50" fill="url(#obsidianSheen)" />
    <polygon points="56.8,60 61.8,56 61.8,65 56.8,69" fill="url(#obsidianSheen)" />
    <!-- 兩側細微壓線 -->
    <line x1="57.2" y1="37" x2="57.8" y2="84" stroke="#050709" stroke-width="0.8" stroke-opacity="0.75" />
    <line x1="62.8" y1="37" x2="62.2" y2="84" stroke="#050709" stroke-width="0.8" stroke-opacity="0.75" />

    <!-- 後上叉與後下叉車架結構 -->
    <path d="M56.5 96 L54 152 L56.5 152 L58.5 104 Z" fill="url(#bodyGrad)" stroke="#050709" stroke-width="1.15" />
    <path d="M63.5 96 L66 152 L63.5 152 L61.5 104 Z" fill="url(#bodyGrad)" stroke="#050709" stroke-width="1.15" />

    <!-- 後輪土除 (泥除) -->
    <rect x="55" y="114" width="10" height="40" rx="4" fill="url(#bodyGrad)" stroke="#050709" stroke-width="1.3" />
    <!-- 土除頂蓋高光漸層 (roofGrad) -->
    <rect x="57" y="116" width="6" height="36" rx="2.5" fill="url(#roofGrad)" />
    <!-- 土除左側斜向高光反光 -->
    <polygon points="57,120 61,117 61,124 57,127" fill="url(#obsidianSheen)" />
    <polygon points="57,136 61,133 61,140 57,143" fill="url(#obsidianSheen)" />
    <line x1="60" y1="118" x2="60" y2="150" stroke="#94A3B8" stroke-width="1.2" stroke-opacity="0.7" stroke-linecap="round" />

    <!-- 4. 後貨架 (槍灰描邊金屬網格結構，確保在黑車架上依然層次分明) -->
    <g stroke="#333B45" stroke-width="2" fill="none" stroke-linejoin="round">
      <rect x="50" y="116" width="20" height="36" rx="4" stroke="#050709" stroke-width="2.3" />
      <rect x="50" y="116" width="20" height="36" rx="4" stroke="#475569" stroke-width="0.8" />
      <line x1="50" y1="125" x2="70" y2="125" />
      <line x1="50" y1="134" x2="70" y2="134" />
      <line x1="50" y1="143" x2="70" y2="143" />
      <line x1="56.5" y1="116" x2="56.5" y2="152" />
      <line x1="63.5" y1="116" x2="63.5" y2="152" />
    </g>

    <!-- 5. 幾何流線座墊 (採用 glassGrad 深碳質感 + 亮銀斜向反光條) -->
    <path d="M60 82 C63.5 82 65.5 92 69 101 C71.5 107.5 67.5 113 60 113 C52.5 113 48.5 107.5 51 101 C54.5 92 56.5 82 60 82 Z" fill="url(#glassGrad)" stroke="#333B45" stroke-width="1.2" />
    <path d="M60 109 L67 102 L68 104 L62 110 Z" fill="#FFFFFF" fill-opacity="0.24" />
    <path d="M57 108 L65 100 L66 101 L58 109 Z" fill="#FFFFFF" fill-opacity="0.18" />

    <!-- 6. 車把手、煞車線與握把 -->
    <path d="M36 27 Q48 25 56 34" fill="none" stroke="#2D343D" stroke-width="1.2" />
    <path d="M84 27 Q72 25 64 34" fill="none" stroke="#2D343D" stroke-width="1.2" />

    <!-- 車把手橫管 (曜石黑金屬橫向漸層 + 純黑外框 #050709) -->
    <path d="M34 32 C42 26 48 34 60 34 C72 34 78 26 86 32" fill="none" stroke="#050709" stroke-width="5.4" stroke-linecap="round" />
    <path d="M34 32 C42 26 48 34 60 34 C72 34 78 26 86 32" fill="none" stroke="url(#bodyGrad)" stroke-width="3.4" stroke-linecap="round" />
    <path d="M36 31.5 C42 26.5 48 33.5 60 33.5 C72 33.5 78 26.5 84 31.5" fill="none" stroke="#94A3B8" stroke-width="1" stroke-opacity="0.75" stroke-linecap="round" />

    <!-- 左右煞車拉桿 -->
    <path d="M36 28 L25 23" stroke="#2D343D" stroke-width="2" stroke-linecap="round" />
    <path d="M84 28 L95 23" stroke="#2D343D" stroke-width="2" stroke-linecap="round" />

    <!-- 左右橡膠握把 (glassGrad + 微亮灰邊區分) -->
    <rect x="21" y="30" width="15" height="5" rx="2.5" transform="rotate(-12 28.5 32.5)" fill="url(#glassGrad)" stroke="#333B45" stroke-width="1" />
    <rect x="84" y="30" width="15" height="5" rx="2.5" transform="rotate(12 91.5 32.5)" fill="url(#glassGrad)" stroke="#333B45" stroke-width="1" />

    <!-- 龍頭立管蓋 -->
    <circle cx="60" cy="34" r="3.5" fill="url(#glassGrad)" stroke="#475569" stroke-width="1.1" />

    <!-- 7. 車頭燈 (LED 晶鑽冷白光) -->
    <ellipse cx="60" cy="22" rx="14" ry="8" fill="url(#headlightGlow)" />
    <rect x="56" y="23" width="8" height="6" rx="2" fill="url(#glassGrad)" stroke="#333B45" stroke-width="1" />
    <path d="M56.5 23.5 Q60 21.5 63.5 23.5 Z" fill="#FFFFFF" />

    <!-- 8. 車尾燈 (警示紅光 #FF4D4D) -->
    <ellipse cx="60" cy="156" rx="13" ry="7" fill="url(#taillightGlow)" />
    <rect x="54.5" y="152" width="11" height="3.2" rx="1.5" fill="#FF4D4D" stroke="#050709" stroke-width="0.8" />
    <line x1="56.5" y1="153.2" x2="63.5" y2="153.2" stroke="#FFB3B3" stroke-width="0.8" />

  </g>
</svg>