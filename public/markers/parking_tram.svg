<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <!-- 停車狀態暗紅色擴散光暈 + 底部立體陰影 (parkedRedGlow) -->
    <filter id="parkedRedGlow" x="-40%" y="-40%" width="180%" height="180%">
      <!-- 外層柔和暗紅停車光暈 -->
      <feGaussianBlur in="SourceAlpha" stdDeviation="5.5" result="outerGlowBlur" />
      <feFlood flood-color="#8A0E0E" flood-opacity="0.55" result="glowColor" />
      <feComposite in="glowColor" in2="outerGlowBlur" operator="in" result="softRedGlow" />

      <!-- 內層緊貼車身的暗紅光邊 -->
      <feGaussianBlur in="SourceAlpha" stdDeviation="2" result="innerGlowBlur" />
      <feFlood flood-color="#B81D1D" flood-opacity="0.45" result="innerGlowColor" />
      <feComposite in="innerGlowColor" in2="innerGlowBlur" operator="in" result="tightRedGlow" />

      <!-- 底部懸浮立體陰影 -->
      <feGaussianBlur in="SourceAlpha" stdDeviation="3.5" result="shadowBlur" />
      <feOffset in="shadowBlur" dx="0" dy="2.5" result="offsetShadow" />
      <feFlood flood-color="#2B0505" flood-opacity="0.4" result="shadowColor" />
      <feComposite in="shadowColor" in2="offsetShadow" operator="in" result="dropShadow" />

      <feMerge>
        <feMergeNode in="softRedGlow" />
        <feMergeNode in="dropShadow" />
        <feMergeNode in="tightRedGlow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- 車身主體金屬烤漆橫向多段漸層 (bodyGrad) -->
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6B0D0D" />
      <stop offset="16%" stop-color="#9E1919" />
      <stop offset="38%" stop-color="#D42C2C" />
      <stop offset="50%" stop-color="#E33939" />
      <stop offset="65%" stop-color="#C92424" />
      <stop offset="85%" stop-color="#8F1414" />
      <stop offset="100%" stop-color="#630B0B" />
    </linearGradient>

    <!-- 車頂頂蓋金屬烤漆垂直漸層 (roofGrad) -->
    <linearGradient id="roofGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F05959" stop-opacity="0.92" />
      <stop offset="45%" stop-color="#C72222" stop-opacity="0.88" />
      <stop offset="100%" stop-color="#7D1111" stop-opacity="0.85" />
    </linearGradient>

    <!-- 車窗玻璃漸層 (glassGrad) -->
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E262C" />
      <stop offset="40%" stop-color="#37434D" />
      <stop offset="70%" stop-color="#222B32" />
      <stop offset="100%" stop-color="#11161A" />
    </linearGradient>

    <!-- 引擎蓋金屬烤漆反光漸層 -->
    <linearGradient id="hoodHighlight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9E9E" stop-opacity="0.65" />
      <stop offset="55%" stop-color="#FF6B6B" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#E33939" stop-opacity="0.05" />
    </linearGradient>

    <!-- 左側斜向金屬高光反光漸層 -->
    <linearGradient id="metallicSheenLeft" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.38" />
      <stop offset="60%" stop-color="#FF9E9E" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <!-- 裁切路徑：車窗與車頂反光條用 -->
    <clipPath id="frontGlassClip">
      <path d="M 48 16 Q 60 14 72 16 L 75 23 Q 60 21 45 23 Z" />
    </clipPath>
    <clipPath id="rearGlassClip">
      <path d="M 45 97 Q 60 99 75 97 L 72 104 Q 60 106 48 104 Z" />
    </clipPath>
    <clipPath id="roofClip">
      <rect x="50" y="37" width="20" height="46" rx="2.5" />
    </clipPath>
  </defs>

  <!-- 整體置中 (中心點 60, 60)，套用 parkedRedGlow 停車狀態光暈 -->
  <g filter="url(#parkedRedGlow)">
    <!-- 車身外殼 -->
    <path d="
      M 49 12
      Q 60 10 71 12
      C 76 14 78 21 78 29
      L 78 91
      C 78 99 76 106 71 108
      Q 60 110 49 108
      C 44 106 42 99 42 91
      L 42 29
      C 42 21 44 14 49 12 Z" fill="url(#bodyGrad)" stroke="#520909" stroke-width="1.3" />

    <!-- 車身左側圓弧金屬光澤帶 -->
    <path d="
      M 46.5 16
      C 44.5 20 44 25 44 31
      L 44 89
      C 44 95 44.5 100 46.5 104
      L 49.5 102
      C 48 98 47.5 94 47.5 89
      L 47.5 31
      C 47.5 26 48 22 49.5 18 Z" fill="url(#metallicSheenLeft)" />

    <!-- 車頭燈 (LED 晶鑽白光) -->
    <path d="M 47 13.5 Q 49.5 12.8 52 13.2 L 51 15.2 Q 48.5 15 46.5 15.5 Z" fill="#FFF2F2" />
    <path d="M 73 13.5 Q 70.5 12.8 68 13.2 L 69 15.2 Q 71.5 15 73.5 15.5 Z" fill="#FFF2F2" />

    <!-- 車尾燈 (警示紅光) -->
    <path d="M 46.5 104.5 Q 48.5 105 51 104.8 L 52 106.8 Q 49.5 107.2 47 106.5 Z" fill="#FF4D4D" />
    <path d="M 73.5 104.5 Q 71.5 105 69 104.8 L 68 106.8 Q 70.5 107.2 73 106.5 Z" fill="#FF4D4D" />

    <!-- 前擋風玻璃與左右三角窗 -->
    <path d="M 48 16 Q 60 14 72 16 L 75 23 Q 60 21 45 23 Z" fill="url(#glassGrad)" stroke="#1E262C" stroke-width="0.6" />
    <path d="M 45.5 16.8 L 44 23.5 L 43 23.5 C 43 19.5 44 17.5 45.5 16.8 Z" fill="url(#glassGrad)" />
    <path d="M 74.5 16.8 L 76 23.5 L 77 23.5 C 77 19.5 76 17.5 74.5 16.8 Z" fill="url(#glassGrad)" />

    <!-- 前擋斜向白色高光條 -->
    <g clip-path="url(#frontGlassClip)">
      <polygon points="48,25 55,13 58,13 51,25" fill="#FFFFFF" fill-opacity="0.16" />
      <polygon points="54,25 61,13 62.5,13 55.5,25" fill="#FFFFFF" fill-opacity="0.16" />
    </g>

    <!-- 後擋風玻璃與左右三角窗 -->
    <path d="M 45 97 Q 60 99 75 97 L 72 104 Q 60 106 48 104 Z" fill="url(#glassGrad)" stroke="#1E262C" stroke-width="0.6" />
    <path d="M 45.5 103.2 L 44 96.5 L 43 96.5 C 43 100.5 44 102.5 45.5 103.2 Z" fill="url(#glassGrad)" />
    <path d="M 74.5 103.2 L 76 96.5 L 77 96.5 C 77 100.5 76 102.5 74.5 103.2 Z" fill="url(#glassGrad)" />

    <!-- 後擋斜向白色高光條 -->
    <g clip-path="url(#rearGlassClip)">
      <polygon points="56,106 63,95 66,95 59,106" fill="#FFFFFF" fill-opacity="0.16" />
      <polygon points="62,106 69,95 70.5,95 63.5,106" fill="#FFFFFF" fill-opacity="0.16" />
    </g>

    <!-- 引擎蓋折線反光、左側斜向高光與兩側細微壓線 -->
    <polygon points="49,24.5 71,24.5 68,34 52,34" fill="url(#hoodHighlight)" />
    <!-- 引擎蓋左側斜向金屬高光條 -->
    <polygon points="49.5,24.5 55.5,24.5 53,34 51,34" fill="#FFFFFF" fill-opacity="0.26" />
    <path d="M 47.5 24.5 L 46 35.5" stroke="#4D0707" stroke-opacity="0.6" stroke-width="0.9" fill="none" stroke-linecap="round" />
    <path d="M 72.5 24.5 L 74 35.5" stroke="#4D0707" stroke-opacity="0.6" stroke-width="0.9" fill="none" stroke-linecap="round" />

    <!-- 車尾蓋折線反光與兩側壓線 -->
    <polygon points="52,86 68,86 71,95.5 49,95.5" fill="url(#hoodHighlight)" opacity="0.55" />
    <path d="M 46 84.5 L 47.5 95.5" stroke="#4D0707" stroke-opacity="0.6" stroke-width="0.9" fill="none" stroke-linecap="round" />
    <path d="M 74 84.5 L 72.5 95.5" stroke="#4D0707" stroke-opacity="0.6" stroke-width="0.9" fill="none" stroke-linecap="round" />

    <!-- 左側車窗 (3扇精簡比例) -->
    <rect x="43" y="34" width="2.5" height="14" rx="1" fill="url(#glassGrad)" />
    <rect x="43" y="53" width="2.5" height="14" rx="1" fill="url(#glassGrad)" />
    <rect x="43" y="72" width="2.5" height="14" rx="1" fill="url(#glassGrad)" />
    <!-- 左側窗反光 -->
    <line x1="43" y1="42" x2="45.5" y2="39" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="1" />
    <line x1="43" y1="61" x2="45.5" y2="58" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="1" />
    <line x1="43" y1="80" x2="45.5" y2="77" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="1" />

    <!-- 右側車窗 (3扇精簡比例) -->
    <rect x="74.5" y="34" width="2.5" height="14" rx="1" fill="url(#glassGrad)" />
    <rect x="74.5" y="53" width="2.5" height="14" rx="1" fill="url(#glassGrad)" />
    <rect x="74.5" y="72" width="2.5" height="14" rx="1" fill="url(#glassGrad)" />
    <!-- 右側窗反光 -->
    <line x1="74.5" y1="42" x2="77" y2="39" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="1" />
    <line x1="74.5" y1="61" x2="77" y2="58" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="1" />
    <line x1="74.5" y1="80" x2="77" y2="77" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="1" />

    <!-- 車頂深酒紅框線與車頂頂蓋 -->
    <rect x="48" y="35" width="24" height="50" rx="3.5" fill="#590A0A" />
    <rect x="50" y="37" width="20" height="46" rx="2.5" fill="url(#roofGrad)" />

    <!-- 車頂左側斜向金屬高光反光 -->
    <g clip-path="url(#roofClip)">
      <polygon points="48,54 62,36 67,36 52,55" fill="#FFFFFF" fill-opacity="0.24" />
      <polygon points="48,61 69,36 71,36 49,63" fill="#FFFFFF" fill-opacity="0.12" />
    </g>

    <!-- 車頂分隔線 -->
    <line x1="50" y1="60" x2="70" y2="60" stroke="#590A0A" stroke-width="1" />

    <!-- 集電弓 (Pantograph) 細節 -->
    <g stroke="#3D0606" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <!-- 底座與支架 -->
      <circle cx="60" cy="56" r="1.5" fill="#C72222" stroke-width="1" />
      <line x1="60" y1="56" x2="60" y2="51" stroke-width="1.4" />
      <polygon points="57,47 63,47 61,51 59,51" stroke-width="1.1" fill="#F05959" fill-opacity="0.55" />
      <!-- 集電弓橫向滑板 -->
      <path d="M 52 45 Q 60 44 68 45" stroke-width="1.3" />
      <path d="M 53 46.5 Q 60 45.5 67 46.5" stroke-width="0.9" />
      <!-- 右側配線盒 -->
      <rect x="61.5" y="54" width="7.5" height="4" rx="0.5" stroke-width="0.9" />
      <line x1="61.5" y1="56" x2="69" y2="56" stroke-width="0.8" />
    </g>
  </g>
</svg>