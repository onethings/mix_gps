<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 180" width="120" height="180">
  <defs>
    <!-- 1. 車身主體橫向立體漸層 -->
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58B838" />
      <stop offset="22%" stop-color="#7EE05A" />
      <stop offset="50%" stop-color="#96F272" />
      <stop offset="78%" stop-color="#7EE05A" />
      <stop offset="100%" stop-color="#4FA832" />
    </linearGradient>

    <!-- 2. 車頂頂蓋垂直光影漸層 -->
    <linearGradient id="roofGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#B8FF9E" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#68CC47" stop-opacity="0.8" />
    </linearGradient>

    <!-- 3. 車窗與前後擋風玻璃漸層 -->
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E262C" />
      <stop offset="35%" stop-color="#37434D" />
      <stop offset="70%" stop-color="#222B32" />
      <stop offset="100%" stop-color="#11161A" />
    </linearGradient>

    <!-- 4. 底部立體懸浮陰影濾鏡 -->
    <filter id="dropShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5" />
      <feOffset dx="0" dy="5" result="offsetblur" />
      <feFlood flood-color="#1A3312" flood-opacity="0.35" />
      <feComposite in2="offsetblur" operator="in" />
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- 裁切路徑：用於限制玻璃反光條不溢出窗框 -->
    <clipPath id="windshieldClip">
      <path d="M 32 45 C 44 39, 76 39, 88 45 L 84 65 C 68 62, 52 62, 36 65 Z" />
    </clipPath>
    <clipPath id="rearWindowClip">
      <path d="M 35 150 L 85 150 L 88 161 C 72 164, 48 164, 32 161 Z" />
    </clipPath>
  </defs>

  <!-- 底部懸浮陰影層（獨立於車輛主體外框以保持陰影柔和） -->
  <rect x="27" y="15" width="66" height="152" rx="18" ry="18" fill="#1A3312" opacity="0.35" filter="url(#dropShadow)" />

  <!-- 車輛主體群組 -->
  <g id="van-vehicle">
    
    <!-- 後視鏡 (左 / 右) -->
    <path d="M 27 49 L 18 52 C 16 52.5, 16 56.5, 18 57 L 27 56 Z" fill="#58B838" stroke="#3D8A24" stroke-width="1.5" stroke-linejoin="round" />
    <path d="M 93 49 L 102 52 C 104 52.5, 104 56.5, 102 57 L 93 56 Z" fill="#4FA832" stroke="#3D8A24" stroke-width="1.5" stroke-linejoin="round" />

    <!-- 車身外殼輪廓 (Van 較方正且修長的寬體造型) -->
    <path d="M 42 13 
             L 78 13 
             C 88 13, 93 19, 93 30 
             L 93 153 
             C 93 162, 88 167, 78 167 
             L 42 167 
             C 32 167, 27 162, 27 153 
             L 27 30 
             C 27 19, 32 13, 42 13 Z" fill="url(#bodyGrad)" stroke="#3D8A24" stroke-width="1.8" />

    <!-- 側窗設計 (左右窄版反光側窗，強化 Van 的商用/休旅車視覺特徵) -->
    <path d="M 28.5 64 L 31.5 68 L 31.5 144 L 28.5 148 Z" fill="url(#glassGrad)" />
    <path d="M 91.5 64 L 88.5 68 L 88.5 144 L 91.5 148 Z" fill="url(#glassGrad)" />
    <!-- 側窗玻璃微弱反光 -->
    <line x1="29.5" y1="78" x2="30.5" y2="92" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.18" />
    <line x1="90.5" y1="78" x2="89.5" y2="92" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.18" />

    <!-- 引擎蓋壓線與中央折線高光 -->
    <path d="M 38 18 L 41 40" stroke="#47992C" stroke-width="1.2" stroke-opacity="0.5" fill="none" stroke-linecap="round" />
    <path d="M 82 18 L 79 40" stroke="#47992C" stroke-width="1.2" stroke-opacity="0.5" fill="none" stroke-linecap="round" />
    <path d="M 46 21 C 55 19, 65 19, 74 21 L 71 37 C 63 35.5, 57 35.5, 49 37 Z" fill="#B6FF9C" opacity="0.7" />

    <!-- 前擋風玻璃 -->
    <path d="M 32 45 C 44 39, 76 39, 88 45 L 84 65 C 68 62, 52 62, 36 65 Z" fill="url(#glassGrad)" stroke="#11161A" stroke-width="1" />
    
    <!-- 前擋風玻璃斜向白色高光條 -->
    <g clip-path="url(#windshieldClip)">
      <polygon points="34,36 47,36 33,69 20,69" fill="#FFFFFF" opacity="0.15" />
      <polygon points="52,36 58,36 44,69 38,69" fill="#FFFFFF" opacity="0.15" />
    </g>

    <!-- 車頂頂蓋區域 (Van 擁有大面積平坦車頂) -->
    <rect x="35" y="68" width="50" height="79" rx="7" ry="7" fill="url(#roofGrad)" stroke="#58B838" stroke-width="0.8" />
    
    <!-- 車頂頂蓋光澤強化條與導流壓線 -->
    <rect x="43" y="72" width="34" height="70" rx="4" ry="4" fill="#B8FF9E" opacity="0.25" />
    <line x1="42" y1="74" x2="42" y2="141" stroke="#47992C" stroke-width="1" stroke-opacity="0.35" stroke-linecap="round" />
    <line x1="78" y1="74" x2="78" y2="141" stroke="#47992C" stroke-width="1" stroke-opacity="0.35" stroke-linecap="round" />

    <!-- 後擋風玻璃 -->
    <path d="M 35 150 L 85 150 L 88 161 C 72 164, 48 164, 32 161 Z" fill="url(#glassGrad)" stroke="#11161A" stroke-width="1" />

    <!-- 後擋風玻璃斜向白色高光條 -->
    <g clip-path="url(#rearWindowClip)">
      <polygon points="40,147 51,147 41,167 30,167" fill="#FFFFFF" opacity="0.15" />
      <polygon points="56,147 61,147 51,167 46,167" fill="#FFFFFF" opacity="0.15" />
    </g>

    <!-- 雨刷細節 (前擋風玻璃下緣) -->
    <path d="M 41 43 L 57 41.5" stroke="#11161A" stroke-width="1.3" stroke-linecap="round" />
    <path d="M 62 42.5 L 78 41.5" stroke="#11161A" stroke-width="1.3" stroke-linecap="round" />

    <!-- 車頭燈 (LED 晶鑽白光 #E8FFDE) -->
    <path d="M 30 22 C 30 17, 35 15, 42 15 L 40 20 C 35 20.5, 32 22.5, 30 26 Z" fill="#E8FFDE" />
    <path d="M 90 22 C 90 17, 85 15, 78 15 L 80 20 C 85 20.5, 88 22.5, 90 26 Z" fill="#E8FFDE" />

    <!-- 車尾燈 (警示紅光 #FF4D4D) -->
    <path d="M 29.5 157 C 29.5 162, 33 165, 40 165.5 L 40 163 C 35 162.5, 32 160.5, 31.5 157 Z" fill="#FF4D4D" />
    <path d="M 90.5 157 C 90.5 162, 87 165, 80 165.5 L 80 163 C 85 162.5, 88 160.5, 88.5 157 Z" fill="#FF4D4D" />

    <!-- 前保險桿進氣格柵微調細節 -->
    <path d="M 49 14.5 Q 60 13.8 71 14.5" stroke="#3D8A24" stroke-width="1.2" fill="none" stroke-linecap="round" />
  </g>
</svg>