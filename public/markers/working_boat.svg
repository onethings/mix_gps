<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 180" width="120" height="180">
  <defs>
    <!-- 柔和的深藍色底部懸浮陰影濾鏡 (blueFloatShadow) -->
    <filter id="blueFloatShadow" x="-35%" y="-35%" width="170%" height="170%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5.5" result="blurOuter" />
      <feOffset dx="0" dy="4" in="blurOuter" result="offsetOuter" />
      <feFlood flood-color="#0B1E45" flood-opacity="0.45" result="shadowColor" />
      <feComposite in="shadowColor" in2="offsetOuter" operator="in" result="softShadow" />
      <feGaussianBlur in="SourceAlpha" stdDeviation="2" result="blurTight" />
      <feFlood flood-color="#07132B" flood-opacity="0.4" result="tightColor" />
      <feComposite in="tightColor" in2="blurTight" operator="in" result="tightShadow" />
      <feMerge>
        <feMergeNode in="softShadow" />
        <feMergeNode in="tightShadow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- LED 航行燈微光濾鏡 -->
    <filter id="ledGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- 船身金屬烤漆橫向多段漸層 (亮天藍 #87B8FF 至 鈷藍 #2D5FBD) -->
    <linearGradient id="metallicBlueBody" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#16336E" />
      <stop offset="15%" stop-color="#2D5FBD" />
      <stop offset="38%" stop-color="#6BA3FF" />
      <stop offset="50%" stop-color="#87B8FF" />
      <stop offset="65%" stop-color="#487EE0" />
      <stop offset="88%" stop-color="#2D5FBD" />
      <stop offset="100%" stop-color="#132B5C" />
    </linearGradient>

    <!-- 船頭甲板金屬烤漆漸層 -->
    <linearGradient id="bowDeckGrad" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#A8CCFF" />
      <stop offset="45%" stop-color="#6099F5" />
      <stop offset="100%" stop-color="#2D5FBD" />
    </linearGradient>

    <!-- 船艙頂蓋金屬漆漸層 -->
    <linearGradient id="metallicBlueRoof" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9CC4FF" />
      <stop offset="48%" stop-color="#528CEB" />
      <stop offset="100%" stop-color="#2D5FBD" />
    </linearGradient>

    <!-- 船舷兩側金屬高光邊條漸層 -->
    <linearGradient id="gunwaleSheen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#D9EAFF" stop-opacity="0.92" />
      <stop offset="35%" stop-color="#87B8FF" stop-opacity="0.55" />
      <stop offset="75%" stop-color="#2D5FBD" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#B5D4FF" stop-opacity="0.65" />
    </linearGradient>

    <!-- 冰藍色斜向高光反光條漸層 -->
    <linearGradient id="iceBlueGlossGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.65" />
      <stop offset="55%" stop-color="#D6E8FF" stop-opacity="0.38" />
      <stop offset="100%" stop-color="#9EC5FF" stop-opacity="0.08" />
    </linearGradient>

    <!-- 擋風玻璃與側窗深色反光漸層 (glassGrad) -->
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E262C" />
      <stop offset="40%" stop-color="#37434D" />
      <stop offset="75%" stop-color="#222B32" />
      <stop offset="100%" stop-color="#11161A" />
    </linearGradient>

    <!-- 舷外機金屬漸層 -->
    <linearGradient id="motorGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1A2026" />
      <stop offset="35%" stop-color="#525E69" />
      <stop offset="65%" stop-color="#2B333B" />
      <stop offset="100%" stop-color="#11161A" />
    </linearGradient>

    <!-- 裁切路徑：船頭內甲板區域 -->
    <clipPath id="bowClip">
      <path d="M 60 22 C 72 36, 78 52, 80 68 C 67 62, 53 62, 40 68 C 42 52, 48 36, 60 22 Z" />
    </clipPath>

    <!-- 裁切路徑：前擋風玻璃 -->
    <clipPath id="windshieldClip">
      <path d="M 38 69 C 52 62, 68 62, 82 69 L 76 82 C 66 77, 54 77, 44 82 Z" />
    </clipPath>

    <!-- 裁切路徑：船艙頂蓋 -->
    <clipPath id="roofClip">
      <path d="M 44 84 C 54 80, 66 80, 76 84 L 74 128 C 66 132, 54 132, 46 128 Z" />
    </clipPath>
  </defs>

  <!-- 整體群組套用柔和的深藍色底部懸浮陰影，中心對齊 (60, 90) -->
  <g filter="url(#blueFloatShadow)">

    <!-- 船尾舷外機與螺旋槳 (位於船尾下方) -->
    <g>
      <!-- 螺旋槳葉片 -->
      <path d="M 55 168 C 51 171, 53 175, 58 171 Z" fill="#8C99A6" stroke="#1E262C" stroke-width="0.8" />
      <path d="M 65 168 C 69 171, 67 175, 62 171 Z" fill="#8C99A6" stroke="#1E262C" stroke-width="0.8" />
      <ellipse cx="60" cy="171" rx="1.6" ry="3.5" fill="#B8C4D0" stroke="#1E262C" stroke-width="0.8" />
      <!-- 舷外機外殼 -->
      <rect x="52" y="153" width="16" height="15" rx="5" fill="url(#motorGrad)" stroke="#11161A" stroke-width="1.4" />
      <path d="M 55 155 C 58 154, 62 154, 65 155 L 64 163 C 61 164, 59 164, 56 163 Z" fill="#63707D" fill-opacity="0.55" />
    </g>

    <!-- 1. 快艇主船體外輪廓 -->
    <path d="M 60 10 
             C 78 28, 91 58, 91 96 
             L 88 148 
             C 88 154, 83 158, 76 158 
             L 69 158 L 68 153 L 52 153 L 51 158 
             L 44 158 
             C 37 158, 32 154, 32 148 
             L 29 96 
             C 29 58, 42 28, 60 10 Z" fill="url(#metallicBlueBody)" stroke="#10254D" stroke-width="2" stroke-linejoin="round" />

    <!-- 船舷內側凹槽陰影框 -->
    <path d="M 60 15 
             C 75 32, 86 60, 86 96 
             L 83 145 
             C 83 149, 79 151, 74 151 
             L 46 151 
             C 41 151, 37 149, 37 145 
             L 34 96 
             C 34 60, 45 32, 60 15 Z" fill="#122957" fill-opacity="0.45" stroke="#10254D" stroke-width="1" />

    <!-- 兩側船舷金屬烤漆高光邊線 -->
    <path d="M 57 14 C 43 32, 33 60, 33 96 L 36 146" fill="none" stroke="url(#gunwaleSheen)" stroke-width="1.8" stroke-linecap="round" />
    <path d="M 63 14 C 77 32, 87 60, 87 96 L 84 146" fill="none" stroke="#87B8FF" stroke-opacity="0.45" stroke-width="1.2" stroke-linecap="round" />

    <!-- 2. 船頭甲板 (引擎蓋區域) -->
    <path d="M 60 22 C 72 36, 78 52, 80 68 C 67 62, 53 62, 40 68 C 42 52, 48 36, 60 22 Z" fill="url(#bowDeckGrad)" stroke="#142D5E" stroke-width="1.4" stroke-linejoin="round" />

    <!-- 船頭尖端三角形飾蓋與中脊線 -->
    <path d="M 60 22 L 66 32 Q 60 30 54 32 Z" fill="#2D5FBD" stroke="#142D5E" stroke-width="1" />
    <line x1="60" y1="31" x2="60" y2="63" stroke="#163166" stroke-width="1.3" />
    <line x1="60.8" y1="31" x2="60.8" y2="63" stroke="#CCE2FF" stroke-opacity="0.6" stroke-width="0.8" />

    <!-- 船頭甲板左側冰藍色斜向高光反光帶 -->
    <g clip-path="url(#bowClip)">
      <polygon points="34,42 64,20 74,28 36,58" fill="url(#iceBlueGlossGrad)" />
      <polygon points="38,63 77,32 80,36 42,68" fill="#E3F0FF" fill-opacity="0.42" />
    </g>

    <!-- 3. 環繞式前擋風玻璃 (glassGrad) -->
    <path d="M 38 69 C 52 62, 68 62, 82 69 L 76 82 C 66 77, 54 77, 44 82 Z" fill="url(#glassGrad)" stroke="#11161A" stroke-width="1.4" stroke-linejoin="round" />
    <!-- 擋風玻璃外框冰藍金屬飾條 -->
    <path d="M 38 69 C 52 62, 68 62, 82 69" fill="none" stroke="#C2DCFF" stroke-width="1.2" stroke-opacity="0.85" />

    <!-- 前擋風玻璃斜向反光條 -->
    <g clip-path="url(#windshieldClip)">
      <polygon points="44,60 55,60 40,85 29,85" fill="#FFFFFF" fill-opacity="0.18" />
      <polygon points="59,60 64,60 49,85 44,85" fill="#FFFFFF" fill-opacity="0.12" />
    </g>

    <!-- 4. 左右兩側流線型側窗 -->
    <path d="M 37 73 L 42 84 L 42 126 L 37 132 C 35 112, 35 92, 37 73 Z" fill="url(#glassGrad)" stroke="#11161A" stroke-width="1.2" stroke-linejoin="round" />
    <path d="M 83 73 L 78 84 L 78 126 L 83 132 C 85 112, 85 92, 83 73 Z" fill="url(#glassGrad)" stroke="#11161A" stroke-width="1.2" stroke-linejoin="round" />
    <!-- 側窗細微反光 -->
    <line x1="37" y1="88" x2="41" y2="94" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="1.5" />
    <line x1="37" y1="98" x2="41" y2="104" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="1" />
    <line x1="79" y1="88" x2="83" y2="94" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="1.5" />

    <!-- 5. 船艙頂蓋 (車頂區域 - metallicBlueRoof) -->
    <path d="M 44 84 C 54 80, 66 80, 76 84 L 74 128 C 66 132, 54 132, 46 128 Z" fill="url(#metallicBlueRoof)" stroke="#142D5E" stroke-width="1.4" stroke-linejoin="round" />
    <!-- 頂蓋左側冰藍色邊緣高光 -->
    <path d="M 44 84 C 54 80, 66 80, 76 84" fill="none" stroke="#D1E5FF" stroke-width="1.2" stroke-opacity="0.88" />
    <line x1="44.5" y1="85" x2="46.2" y2="127" stroke="#B8D6FF" stroke-width="1" stroke-opacity="0.65" />

    <!-- 船艙頂蓋左側兩道冰藍色斜向高光反光帶 -->
    <g clip-path="url(#roofClip)">
      <polygon points="42,96 63,79 69,79 42,104" fill="#E6F2FF" fill-opacity="0.4" />
      <polygon points="42,110 74,82 78,85 42,117" fill="#D1E5FF" fill-opacity="0.3" />
    </g>

    <!-- 6. 後甲板與船尾結構線條 -->
    <path d="M 42 134 L 78 134 L 76 147 L 44 147 Z" fill="#2D5FBD" stroke="#142D5E" stroke-width="1.2" stroke-linejoin="round" />
    <line x1="43" y1="135.5" x2="77" y2="135.5" stroke="#87B8FF" stroke-opacity="0.5" stroke-width="0.9" />

    <!-- 7. 船頭與船側 LED 航行燈 (晶鑽冰藍白微光 + 光暈) -->
    <g filter="url(#ledGlow)">
      <!-- 船尖主探照燈 -->
      <path d="M 56.5 14 Q 60 10.5 63.5 14 L 62.5 17.5 Q 60 16 57.5 17.5 Z" fill="#FFFFFF" stroke="#B8D6FF" stroke-width="0.8" />
      <!-- 前舷兩側航行燈 -->
      <rect x="40" y="34" width="2.5" height="6" rx="1.2" transform="rotate(28 41.2 37)" fill="#FFFFFF" stroke="#87B8FF" stroke-width="0.7" />
      <rect x="77.5" y="34" width="2.5" height="6" rx="1.2" transform="rotate(-28 78.7 37)" fill="#FFFFFF" stroke="#87B8FF" stroke-width="0.7" />
      <!-- 船身中段兩側航行燈 -->
      <rect x="29.5" y="74" width="2.2" height="6.5" rx="1.1" fill="#FFFFFF" stroke="#87B8FF" stroke-width="0.7" />
      <rect x="88.3" y="74" width="2.2" height="6.5" rx="1.1" fill="#FFFFFF" stroke="#87B8FF" stroke-width="0.7" />
    </g>

    <!-- 8. 船尾紅色警示燈 -->
    <rect x="37.5" y="151.5" width="7" height="3" rx="1.3" fill="#FF3333" stroke="#FF9999" stroke-width="0.5" />
    <rect x="75.5" y="151.5" width="7" height="3" rx="1.3" fill="#FF3333" stroke="#FF9999" stroke-width="0.5" />

  </g>
</svg>