<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 180" width="120" height="180">
  <defs>
    <!-- 1. 車身主體午夜金屬黑烤漆漸層 (深黑曜石色 #1A1E24 到高光鈦灰 #6E7988 橫向漸層) -->
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1A1E24" />
      <stop offset="22%" stop-color="#2D343E" />
      <stop offset="48%" stop-color="#6E7988" />
      <stop offset="76%" stop-color="#282F3A" />
      <stop offset="100%" stop-color="#111418" />
    </linearGradient>

    <!-- 2. 油箱頂蓋高光漸層 (鏡面金屬漆面光澤) -->
    <linearGradient id="roofGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A2ADB8" stop-opacity="0.92" />
      <stop offset="45%" stop-color="#4F5965" stop-opacity="0.82" />
      <stop offset="100%" stop-color="#1A1E24" stop-opacity="0.88" />
    </linearGradient>

    <!-- 3. 擋風鏡/儀表板深色反光玻璃漸層 -->
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E262C" />
      <stop offset="40%" stop-color="#37434D" />
      <stop offset="70%" stop-color="#222B32" />
      <stop offset="100%" stop-color="#11161A" />
    </linearGradient>

    <!-- 4. 坐墊深色皮革質感漸層 -->
    <linearGradient id="seatGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#182026" />
      <stop offset="50%" stop-color="#2B3640" />
      <stop offset="100%" stop-color="#141A1F" />
    </linearGradient>

    <!-- 5. 輪胎橡膠漸層 -->
    <linearGradient id="tireGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#11161A" />
      <stop offset="50%" stop-color="#2C353D" />
      <stop offset="100%" stop-color="#11161A" />
    </linearGradient>

    <!-- 6. 柔和深碳灰底部懸浮立體陰影 (背景 100% 透明) -->
    <filter id="blackDropShadow" x="-30%" y="-20%" width="160%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#0A0C0E" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- 整體車輛群組 (套用深碳灰懸浮陰影，座標與前六款完全一致) -->
  <g filter="url(#blackDropShadow)">
    
    <!-- 前輪與後輪 -->
    <rect x="52" y="16" width="16" height="32" rx="7" fill="url(#tireGrad)" />
    <rect x="50" y="130" width="20" height="34" rx="8" fill="url(#tireGrad)" />

    <!-- 左右把手與握把 -->
    <path d="M 24 55 Q 40 50 60 52 Q 80 50 96 55" fill="none" stroke="#222B32" stroke-width="5" stroke-linecap="round" />
    <!-- 左握把與煞車拉桿 -->
    <rect x="20" y="52" width="14" height="6" rx="3" fill="#182026" transform="rotate(-12 27 55)" />
    <path d="M 22 49 L 33 47" stroke="#A2ADB8" stroke-width="1.5" stroke-linecap="round" />
    <!-- 右握把與煞車拉桿 -->
    <rect x="86" y="52" width="14" height="6" rx="3" fill="#182026" transform="rotate(12 93 55)" />
    <path d="M 98 49 L 87 47" stroke="#A2ADB8" stroke-width="1.5" stroke-linecap="round" />

    <!-- 左右後視鏡 -->
    <g>
      <!-- 左後視鏡支架與鏡殼 -->
      <path d="M 38 51 L 31 44" stroke="#1E262C" stroke-width="2.5" stroke-linecap="round" />
      <ellipse cx="29" cy="43" rx="6" ry="3.2" transform="rotate(-25 29 43)" fill="url(#bodyGrad)" stroke="#2C353D" stroke-width="1.15" />
      <!-- 右後視鏡支架與鏡殼 -->
      <path d="M 82 51 L 89 44" stroke="#1E262C" stroke-width="2.5" stroke-linecap="round" />
      <ellipse cx="91" cy="43" rx="6" ry="3.2" transform="rotate(25 91 43)" fill="url(#bodyGrad)" stroke="#2C353D" stroke-width="1.15" />
    </g>

    <!-- 排氣管 (右側深金屬質感點綴) -->
    <path d="M 72 115 L 77 148 C 77 151 73 152 71 149 L 68 118 Z" fill="#2C353D" stroke="#182026" stroke-width="1" />

    <!-- 車身主體外殼 (前整流罩 + 油箱 + 兩側流線車殼 + 尾翼) -->
    <path d="
      M 60 24
      C 70 24, 77 35, 78 48
      C 79 58, 76 66, 75 74
      C 75 84, 74 96, 73 108
      L 71 144
      C 71 149, 65 152, 60 152
      C 55 152, 49 149, 49 144
      L 47 108
      C 46 96, 45 84, 45 74
      C 44 66, 41 58, 42 48
      C 43 35, 50 24, 60 24 Z" fill="url(#bodyGrad)" stroke="#2C353D" stroke-width="1.65" stroke-linejoin="round" />

    <!-- 車頭整流罩兩側細微壓線 -->
    <path d="M 48 36 C 46 45, 47 54, 50 60" fill="none" stroke="#3C4652" stroke-width="1.2" stroke-opacity="0.7" stroke-linecap="round" />
    <path d="M 72 36 C 74 45, 73 54, 70 60" fill="none" stroke="#3C4652" stroke-width="1.2" stroke-opacity="0.7" stroke-linecap="round" />

    <!-- 車頭整流罩左側鏡面銀白高光反光 -->
    <path d="M 52 28 C 48 33, 46 41, 46 48" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.75" stroke-linecap="round" />

    <!-- 車頭 LED 晶鑽大燈 -->
    <path d="M 52 26 Q 60 22 68 26 Q 60 28 52 26 Z" fill="#F4F7FA" />
    <ellipse cx="60" cy="25.5" rx="6" ry="1.8" fill="#FFFFFF" opacity="0.95" />

    <!-- 前擋風鏡 (深色反光玻璃質感 + 斜向白色高光條) -->
    <g>
      <path d="M 50 37 C 50 31, 70 31, 70 37 L 68 51 C 63 53, 57 53, 52 51 Z" fill="url(#glassGrad)" stroke="#11161A" stroke-width="0.9" />
      <!-- 玻璃斜向反光條 -->
      <polygon points="53,34 57,34 53,50 51,49" fill="#FFFFFF" fill-opacity="0.18" />
      <polygon points="59,33 61,33 56,51 54,51" fill="#FFFFFF" fill-opacity="0.18" />
    </g>

    <!-- 油箱立體頂蓋高光區 -->
    <path d="M 51 62 C 51 56, 69 56, 69 62 L 67 84 C 63 87, 57 87, 53 84 Z" fill="url(#roofGrad)" />
    
    <!-- 油箱左側鏡面銀白高光反光帶 -->
    <path d="M 54 59 L 52 79 L 55 81 L 58 58 Z" fill="#FFFFFF" fill-opacity="0.6" />
    <!-- 油箱中央折線高光 -->
    <path d="M 60 58 L 60 83" stroke="#D8E2EC" stroke-width="1.8" stroke-opacity="0.85" stroke-linecap="round" />
    <!-- 油箱蓋深金屬圓環細節 -->
    <circle cx="60" cy="68" r="3" fill="#3C4652" fill-opacity="0.65" stroke="#FFFFFF" stroke-width="0.8" />

    <!-- 騎士雙人座墊 (前座 + 階梯式後座) -->
    <path d="
      M 52 86
      C 56 84, 64 84, 68 86
      L 69 112
      C 69 115, 67 117, 66 119
      L 65 138
      C 65 141, 55 141, 55 138
      L 54 119
      C 53 117, 51 115, 51 112 Z" fill="url(#seatGrad)" stroke="#11161A" stroke-width="1" />
    
    <!-- 座墊高低段差縫線反光 -->
    <path d="M 52 114 Q 60 116 68 114" fill="none" stroke="#37434D" stroke-width="1.2" stroke-linecap="round" />

    <!-- 車尾銀白高光與鮮紅警示尾燈 -->
    <path d="M 54 143 Q 60 145 66 143" fill="none" stroke="#D8E2EC" stroke-width="1.5" stroke-opacity="0.8" stroke-linecap="round" />
    <path d="M 53 148 Q 60 152 67 148 L 65 151 Q 60 154 55 151 Z" fill="#FF3333" />
    
  </g>
</svg>