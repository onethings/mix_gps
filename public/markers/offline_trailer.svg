<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 180" width="120" height="180">
  <defs>
    <!-- 柔和深灰底部懸浮陰影濾鏡（在淺灰或白色地圖上突顯立體輪廓） -->
    <filter id="silverDropShadow" x="-35%" y="-25%" width="170%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="4.5" flood-color="#1A1D21" flood-opacity="0.42" />
    </filter>

    <!-- 金屬銀烤漆車身主體橫向漸層 (冷鐵灰 #7D838B 到 亮銀白 #E4E8ED) -->
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7D838B" />
      <stop offset="20%" stop-color="#B0B7C0" />
      <stop offset="48%" stop-color="#E4E8ED" />
      <stop offset="76%" stop-color="#A6ADB6" />
      <stop offset="100%" stop-color="#6E747C" />
    </linearGradient>

    <!-- 車頂與貨櫃頂蓋垂直金屬銀漸層 -->
    <linearGradient id="roofGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F5F7FA" stop-opacity="0.95" />
      <stop offset="55%" stop-color="#BDC3CC" stop-opacity="0.88" />
      <stop offset="100%" stop-color="#868C94" stop-opacity="0.85" />
    </linearGradient>

    <!-- 金屬銀斜向高光反光漸層 -->
    <linearGradient id="silverSheen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.7" />
      <stop offset="50%" stop-color="#E8ECF2" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <!-- 車窗玻璃深色反光漸層 -->
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E262C" />
      <stop offset="35%" stop-color="#37434D" />
      <stop offset="70%" stop-color="#222B32" />
      <stop offset="100%" stop-color="#11161A" />
    </linearGradient>

    <!-- 拖車連接盤金屬深色漸層 -->
    <linearGradient id="hitchGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E262C" />
      <stop offset="50%" stop-color="#3E4A54" />
      <stop offset="100%" stop-color="#182026" />
    </linearGradient>

    <!-- 擋風玻璃裁切遮罩 -->
    <clipPath id="windshieldClip">
      <path d="M 38 35 Q 60 31 82 35 L 85 48 Q 60 45 35 48 Z" />
    </clipPath>

    <!-- 引擎蓋裁切遮罩 -->
    <clipPath id="hoodClip">
      <rect x="33" y="12" width="54" height="26" rx="11" />
    </clipPath>

    <!-- 駕駛室車頂裁切遮罩 -->
    <clipPath id="cabRoofClip">
      <rect x="40" y="49" width="40" height="17" rx="4" />
    </clipPath>

    <!-- 貨櫃頂蓋裁切遮罩 -->
    <clipPath id="trailerRoofClip">
      <rect x="36" y="78" width="48" height="84" rx="3" />
    </clipPath>
  </defs>

  <!-- 整體套用柔和深灰底部懸浮陰影 -->
  <g filter="url(#silverDropShadow)">
    <!-- ==================== 1. 拖車車頭 (Tractor Cab) ==================== -->
    <g id="tractor-cab">
      <!-- 左右後視鏡（深灰色外框 #444A52） -->
      <path d="M 33 35 L 25 33 C 23.5 32.8 23 34 23 35.5 L 23 39 C 23 40.5 24 41 25.5 40.8 L 33 39 Z" fill="#9AA1AB" stroke="#444A52" stroke-width="1.3" />
      <path d="M 87 35 L 95 33 C 96.5 32.8 97 34 97 35.5 L 97 39 C 97 40.5 96 41 94.5 40.8 L 87 39 Z" fill="#7D838B" stroke="#444A52" stroke-width="1.3" />

      <!-- 車頭主體外殼（深灰色外框線 #444A52 確保白底清晰度） -->
      <rect x="33" y="12" width="54" height="58" rx="11" fill="url(#bodyGrad)" stroke="#444A52" stroke-width="1.6" />

      <!-- 引擎蓋左側斜向金屬銀高光反光 -->
      <g clip-path="url(#hoodClip)">
        <polygon points="34,11 49,11 39,37 30,37" fill="url(#silverSheen)" />
        <polygon points="52,11 56,11 46,37 42,37" fill="#FFFFFF" fill-opacity="0.32" />
      </g>

      <!-- 車頭 LED 晶鑽白光大燈（微冷光藍白以區隔銀色車身） -->
      <path d="M 36 17 Q 42 13.5 48 14.5 L 46 18.5 Q 41 18 36 20 Z" fill="#F2F8FF" stroke="#6E747C" stroke-width="0.4" />
      <path d="M 84 17 Q 78 13.5 72 14.5 L 74 18.5 Q 79 18 84 20 Z" fill="#F2F8FF" stroke="#6E747C" stroke-width="0.4" />

      <!-- 引擎蓋兩側細微壓線 -->
      <path d="M 43 18 L 41 33" stroke="#5A6068" stroke-opacity="0.6" stroke-width="1.3" stroke-linecap="round" />
      <path d="M 77 18 L 79 33" stroke="#5A6068" stroke-opacity="0.6" stroke-width="1.3" stroke-linecap="round" />

      <!-- 引擎蓋折線銀白反光高光條 -->
      <path d="M 46 18 L 45 32" stroke="#FFFFFF" stroke-opacity="0.85" stroke-width="1.8" stroke-linecap="round" />
      <path d="M 74 18 L 75 32" stroke="#F0F3F7" stroke-opacity="0.7" stroke-width="1.8" stroke-linecap="round" />
      <!-- 引擎蓋中央微光 -->
      <ellipse cx="59" cy="24" rx="9" ry="5" fill="#FFFFFF" opacity="0.45" />

      <!-- 前擋風玻璃 (#glassGrad) -->
      <path d="M 38 35 Q 60 31 82 35 L 85 48 Q 60 45 35 48 Z" fill="url(#glassGrad)" stroke="#11161A" stroke-width="0.8" />

      <!-- 擋風玻璃斜向白色反光條 -->
      <g clip-path="url(#windshieldClip)">
        <polygon points="41,30 49,30 39,52 31,52" fill="#FFFFFF" fill-opacity="0.16" />
        <polygon points="53,30 57,30 47,52 43,52" fill="#FFFFFF" fill-opacity="0.16" />
      </g>

      <!-- 駕駛室側窗細節 -->
      <path d="M 35 50 L 38 51 L 38 62 L 35 63 Z" fill="url(#glassGrad)" />
      <path d="M 85 50 L 82 51 L 82 62 L 85 63 Z" fill="url(#glassGrad)" />

      <!-- 駕駛室車頂高光蓋 (#roofGrad) -->
      <rect x="40" y="49" width="40" height="17" rx="4" fill="url(#roofGrad)" stroke="#444A52" stroke-width="0.9" stroke-opacity="0.75" />
      
      <!-- 駕駛室車頂左側斜向金屬銀高光反光 -->
      <g clip-path="url(#cabRoofClip)">
        <polygon points="40,48 54,48 45,67 36,67" fill="url(#silverSheen)" />
        <polygon points="57,48 61,48 52,67 48,67" fill="#FFFFFF" fill-opacity="0.28" />
      </g>

      <!-- 車頂擾流板高光條 -->
      <line x1="44" y1="52" x2="76" y2="52" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="1.5" stroke-linecap="round" />
    </g>

    <!-- ==================== 2. 拖車連接機構 (Fifth-Wheel / Hitch) ==================== -->
    <g id="trailer-hitch">
      <rect x="45" y="68" width="30" height="9" rx="2" fill="url(#hitchGrad)" stroke="#11161A" stroke-width="1" />
      <!-- 連接管線細節 -->
      <line x1="54" y1="68" x2="54" y2="75" stroke="#B0B7C0" stroke-width="1.2" />
      <line x1="66" y1="68" x2="66" y2="75" stroke="#4D5A66" stroke-width="1.2" />
    </g>

    <!-- ==================== 3. 拖車貨櫃車斗 (Trailer Box) ==================== -->
    <g id="trailer-cargo">
      <!-- 貨櫃主體外殼（深灰色外框線 #444A52） -->
      <rect x="31" y="73" width="58" height="95" rx="6" fill="url(#bodyGrad)" stroke="#444A52" stroke-width="1.6" />

      <!-- 貨櫃頂蓋立體高光面 (#roofGrad) -->
      <rect x="36" y="78" width="48" height="84" rx="3" fill="url(#roofGrad)" stroke="#444A52" stroke-width="0.9" stroke-opacity="0.7" />

      <!-- 貨櫃頂蓋左側斜向金屬銀高光反光 -->
      <g clip-path="url(#trailerRoofClip)">
        <polygon points="34,76 55,76 41,164 28,164" fill="url(#silverSheen)" />
        <polygon points="59,76 64,76 50,164 45,164" fill="#FFFFFF" fill-opacity="0.25" />
      </g>

      <!-- 貨櫃頂部結構加強筋（冷灰暗線搭配亮銀高光線） -->
      <line x1="38" y1="94" x2="82" y2="94" stroke="#5A6068" stroke-opacity="0.45" stroke-width="1.2" />
      <line x1="38" y1="95.2" x2="82" y2="95.2" stroke="#FFFFFF" stroke-opacity="0.65" stroke-width="1" />

      <line x1="38" y1="112" x2="82" y2="112" stroke="#5A6068" stroke-opacity="0.45" stroke-width="1.2" />
      <line x1="38" y1="113.2" x2="82" y2="113.2" stroke="#FFFFFF" stroke-opacity="0.6" stroke-width="1" />

      <line x1="38" y1="130" x2="82" y2="130" stroke="#5A6068" stroke-opacity="0.45" stroke-width="1.2" />
      <line x1="38" y1="131.2" x2="82" y2="131.2" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="1" />

      <line x1="38" y1="148" x2="82" y2="148" stroke="#5A6068" stroke-opacity="0.45" stroke-width="1.2" />
      <line x1="38" y1="149.2" x2="82" y2="149.2" stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="1" />

      <!-- 貨櫃頂部中央縱向金屬銀光澤帶 -->
      <rect x="54" y="80" width="10" height="80" rx="4" fill="#FFFFFF" opacity="0.26" />

      <!-- 車尾燈（警示紅光 #FF4D4D） -->
      <rect x="34" y="165.5" width="11" height="2.8" rx="1.2" fill="#FF4D4D" />
      <rect x="75" y="165.5" width="11" height="2.8" rx="1.2" fill="#FF4D4D" />
      <!-- 尾燈微光反光點 -->
      <rect x="36" y="166" width="4" height="1" rx="0.5" fill="#FFFFFF" opacity="0.65" />
      <rect x="80" y="166" width="4" height="1" rx="0.5" fill="#FFFFFF" opacity="0.65" />
    </g>
  </g>
</svg>