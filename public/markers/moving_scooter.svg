<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 180" width="120" height="180">
  <defs>
    <!-- 1. 車身主體橫向漸層 (bodyGrad) -->
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58B838" />
      <stop offset="22%" stop-color="#7EE05A" />
      <stop offset="50%" stop-color="#96F272" />
      <stop offset="78%" stop-color="#7EE05A" />
      <stop offset="100%" stop-color="#4FA832" />
    </linearGradient>

    <!-- 2. 車頂/座墊及龍頭上方垂直光影漸層 (roofGrad) -->
    <linearGradient id="roofGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#B8FF9E" stop-opacity="0.90" />
      <stop offset="100%" stop-color="#68CC47" stop-opacity="0.80" />
    </linearGradient>

    <!-- 3. 擋風鏡/儀表與深色部件玻璃漸層 (glassGrad) -->
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E262C" />
      <stop offset="38%" stop-color="#37434D" />
      <stop offset="68%" stop-color="#222B32" />
      <stop offset="100%" stop-color="#11161A" />
    </linearGradient>

    <!-- 4. 底部立體懸浮陰影濾鏡 -->
    <filter id="dropShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#1A3312" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- 中心對齊群組 (中心點 x=60, y=90) -->
  <g id="scooter-topview" filter="url(#dropShadow)">
    
    <!-- 前輪與後輪外露輪胎 -->
    <rect x="53" y="13" width="14" height="24" rx="7" fill="#181F24" stroke="#11161A" stroke-width="1" />
    <rect x="52" y="143" width="16" height="24" rx="7" fill="#181F24" stroke="#11161A" stroke-width="1" />
    
    <!-- 後土除與牌照架 -->
    <path d="M 50 156 L 70 156 L 67 166 L 53 166 Z" fill="#1E262C" stroke="#11161A" stroke-width="1" />

    <!-- 排氣管（右側下方細節） -->
    <path d="M 76 115 L 82 118 L 83 146 L 75 148 Z" fill="#222B32" stroke="#11161A" stroke-width="1.2" />
    <line x1="79" y1="121" x2="79" y2="143" stroke="#37434D" stroke-width="1.5" stroke-linecap="round" />

    <!-- 車身主體外殼（前斜板、腳踏外緣、後側殼一體成型） -->
    <path d="M 60 19
             C 71 19, 80 28, 81 44
             L 81 62
             L 78 68
             L 78 96
             C 82 104, 83 122, 79 142
             C 76 153, 69 160, 60 160
             C 51 160, 44 153, 41 142
             C 37 122, 38 104, 42 96
             L 42 68
             L 39 62
             L 39 44
             C 40 28, 49 19, 60 19 Z" fill="url(#bodyGrad)" stroke="#3D8A24" stroke-width="1.8" stroke-linejoin="round" />

    <!-- 前盾牌/引擎蓋兩側細微壓線 -->
    <path d="M 46 29 C 44 38, 44 48, 46 56" fill="none" stroke="#47992C" stroke-width="1.3" stroke-opacity="0.5" stroke-linecap="round" />
    <path d="M 74 29 C 76 38, 76 48, 74 56" fill="none" stroke="#47992C" stroke-width="1.3" stroke-opacity="0.5" stroke-linecap="round" />

    <!-- 後側殼兩側細微壓線 -->
    <path d="M 43 106 C 41 120, 43 135, 47 148" fill="none" stroke="#47992C" stroke-width="1.3" stroke-opacity="0.5" stroke-linecap="round" />
    <path d="M 77 106 C 79 120, 77 135, 73 148" fill="none" stroke="#47992C" stroke-width="1.3" stroke-opacity="0.5" stroke-linecap="round" />

    <!-- 引擎蓋/前斜板中央折線高光 -->
    <path d="M 60 23 L 64 46 L 60 50 L 56 46 Z" fill="#B6FF9C" fill-opacity="0.7" />
    <line x1="60" y1="22" x2="60" y2="49" stroke="#E8FFDE" stroke-width="1" stroke-opacity="0.8" />

    <!-- 中央腳踏板區域（深色防滑地台與中央龍骨） -->
    <rect x="43" y="65" width="34" height="33" rx="6" fill="url(#glassGrad)" stroke="#3D8A24" stroke-width="1.2" />
    <!-- 腳踏板防滑紋路 -->
    <line x1="47" y1="72" x2="53" y2="72" stroke="#11161A" stroke-width="1.5" stroke-linecap="round" />
    <line x1="47" y1="78" x2="53" y2="78" stroke="#11161A" stroke-width="1.5" stroke-linecap="round" />
    <line x1="47" y1="84" x2="53" y2="84" stroke="#11161A" stroke-width="1.5" stroke-linecap="round" />
    <line x1="47" y1="90" x2="53" y2="90" stroke="#11161A" stroke-width="1.5" stroke-linecap="round" />
    <line x1="67" y1="72" x2="73" y2="72" stroke="#11161A" stroke-width="1.5" stroke-linecap="round" />
    <line x1="67" y1="78" x2="73" y2="78" stroke="#11161A" stroke-width="1.5" stroke-linecap="round" />
    <line x1="67" y1="84" x2="73" y2="84" stroke="#11161A" stroke-width="1.5" stroke-linecap="round" />
    <line x1="67" y1="90" x2="73" y2="90" stroke="#11161A" stroke-width="1.5" stroke-linecap="round" />
    <!-- 腳踏中央車漆龍骨護蓋 -->
    <rect x="56" y="64" width="8" height="35" rx="3" fill="url(#bodyGrad)" stroke="#3D8A24" stroke-width="1" />

    <!-- 前風鏡 / 儀表護罩（glassGrad + 斜向玻璃反光條） -->
    <path d="M 48 49
             C 48 42, 72 42, 72 49
             L 70 57
             C 64 59, 56 59, 50 57 Z" fill="url(#glassGrad)" stroke="#11161A" stroke-width="1.2" />
    <!-- 風鏡玻璃斜向白色高光條 (15% 透明度) -->
    <polygon points="52,45 57,45 53,57 49,56" fill="#FFFFFF" fill-opacity="0.15" />
    <polygon points="59,45 62,45 58,57 55,57" fill="#FFFFFF" fill-opacity="0.15" />

    <!-- 龍頭把手總成與左右握把 -->
    <!-- 左握把 -->
    <rect x="26" y="54" width="14" height="6" rx="3" fill="#1E262C" stroke="#11161A" stroke-width="1.2" />
    <rect x="24" y="54.5" width="3" height="5" rx="1" fill="#37434D" />
    <!-- 右握把 -->
    <rect x="80" y="54" width="14" height="6" rx="3" fill="#1E262C" stroke="#11161A" stroke-width="1.2" />
    <rect x="93" y="54.5" width="3" height="5" rx="1" fill="#37434D" />
    <!-- 龍頭車殼蓋（採用 roofGrad 受光高光漸層） -->
    <path d="M 39 53
             C 46 50, 74 50, 81 53
             L 79 62
             C 70 64, 50 64, 41 62 Z" fill="url(#roofGrad)" stroke="#3D8A24" stroke-width="1.5" />

    <!-- 左右後照鏡（鏡桿與帶反光玻璃的鏡殼） -->
    <!-- 左照後鏡 -->
    <path d="M 38 54 L 31 47" stroke="#1E262C" stroke-width="2" stroke-linecap="round" />
    <ellipse cx="27" cy="45" rx="6" ry="3.5" transform="rotate(-22 27 45)" fill="url(#glassGrad)" stroke="#11161A" stroke-width="1.2" />
    <line x1="24" y1="44" x2="29" y2="46" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="1.5" stroke-linecap="round" />
    <!-- 右照後鏡 -->
    <path d="M 82 54 L 89 47" stroke="#1E262C" stroke-width="2" stroke-linecap="round" />
    <ellipse cx="93" cy="45" rx="6" ry="3.5" transform="rotate(22 93 45)" fill="url(#glassGrad)" stroke="#11161A" stroke-width="1.2" />
    <line x1="91" y1="46" x2="96" y2="44" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="1.5" stroke-linecap="round" />

    <!-- 座墊主體（採用深色反光皮革漸層 glassGrad） -->
    <path d="M 47 97
             C 47 92, 73 92, 73 97
             L 75 136
             C 75 144, 68 148, 60 148
             C 52 148, 45 144, 45 136 Z" fill="url(#glassGrad)" stroke="#11161A" stroke-width="1.5" />
    <!-- 座墊高低段差縫線與斜向反光條 -->
    <path d="M 46 116 Q 60 119 74 116" fill="none" stroke="#11161A" stroke-width="1.5" />
    <polygon points="51,96 57,96 52,143 47,140" fill="#FFFFFF" fill-opacity="0.15" />

    <!-- 車頂/座墊中央受光區域高光片 (roofGrad) -->
    <path d="M 52 99
             C 52 96, 68 96, 68 99
             L 69 134
             C 69 139, 65 142, 60 142
             C 55 142, 51 139, 51 134 Z" fill="url(#roofGrad)" fill-opacity="0.32" />

    <!-- 後扶手 / 尾翼（採用 roofGrad 受光高光漸層） -->
    <path d="M 45 144
             C 44 152, 51 157, 60 157
             C 69 157, 76 152, 75 144
             L 71 143
             C 71 149, 66 152, 60 152
             C 54 152, 49 149, 49 143 Z" fill="url(#roofGrad)" stroke="#3D8A24" stroke-width="1.3" />

    <!-- 5. 車頭燈（LED 晶鑽白光 #E8FFDE） -->
    <!-- 中央大燈 -->
    <path d="M 53 19.5 Q 60 18 67 19.5 L 65 23.5 Q 60 22.5 55 23.5 Z" fill="#E8FFDE" stroke="#3D8A24" stroke-width="0.8" />
    <!-- 左右前方向燈/日行燈條 -->
    <path d="M 43 28 L 47 24 L 48 27 L 44 32 Z" fill="#E8FFDE" />
    <path d="M 77 28 L 73 24 L 72 27 L 76 32 Z" fill="#E8FFDE" />

    <!-- 5. 車尾燈（警示紅光 #FF4D4D） -->
    <path d="M 51 157.5 Q 60 160.5 69 157.5 L 67 154.5 Q 60 156.5 53 154.5 Z" fill="#FF4D4D" stroke="#3D8A24" stroke-width="0.6" />
  </g>
</svg>