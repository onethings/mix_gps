<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 180" width="120" height="180">
  <defs>
    <!-- 1. 機身主體橫向曜岩黑至亮石墨灰金屬漸層 (bodyGrad) -->
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#111317" />
      <stop offset="22%" stop-color="#2E3542" />
      <stop offset="50%" stop-color="#6B7588" />
      <stop offset="78%" stop-color="#2E3542" />
      <stop offset="100%" stop-color="#0A0B0E" />
    </linearGradient>

    <!-- 2. 機頂整流罩垂直金屬黑漆面漸層 (roofGrad) -->
    <linearGradient id="roofGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8B95A6" stop-opacity="0.94" />
      <stop offset="45%" stop-color="#414A5A" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#111317" stop-opacity="0.88" />
    </linearGradient>

    <!-- 3. 駕駛艙玻璃擬真漸層 (glassGrad) -->
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E262C" />
      <stop offset="35%" stop-color="#37434D" />
      <stop offset="70%" stop-color="#222B32" />
      <stop offset="100%" stop-color="#11161A" />
    </linearGradient>

    <!-- 4. 主旋翼槳葉金屬與反光漸層 -->
    <linearGradient id="rotorBladeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E262C" />
      <stop offset="50%" stop-color="#37434D" />
      <stop offset="100%" stop-color="#11161A" />
    </linearGradient>

    <!-- 5. 柔和深碳黑底部懸浮陰影 (dropShadow) -->
    <filter id="dropShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5" />
      <feOffset dx="0" dy="6" result="offsetblur" />
      <feFlood flood-color="#05070A" flood-opacity="0.45" />
      <feComposite in2="offsetblur" operator="in" />
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- 座艙玻璃裁切路徑 -->
    <clipPath id="cockpitClip">
      <path d="M 60,26 C 72,26 78,36 77,50 C 70,47 50,47 43,50 C 42,36 48,26 60,26 Z" />
    </clipPath>

    <!-- 機身與機頂裁切路徑，用於左側鉑銀高光反光 -->
    <clipPath id="fuselageClip">
      <path d="M 60,24 
               C 74,24 81,38 80,62 
               C 79,82 72,96 65,108 
               L 63,156 
               L 66,162 
               L 54,162 
               L 57,156 
               L 55,108 
               C 48,96 41,82 40,62 
               C 39,38 46,24 60,24 Z" />
    </clipPath>
    <clipPath id="roofClip">
      <rect x="51" y="52" width="18" height="36" rx="8" />
    </clipPath>
  </defs>

  <!-- 整機群組套用底部立體懸浮陰影 -->
  <g filter="url(#dropShadow)">
    
    <!-- 起落架滑橇 (Landing Skids) -->
    <g stroke="#2B353D" stroke-width="2.5" stroke-linecap="round" fill="none">
      <!-- 左側滑橇與支撐桿 -->
      <line x1="38" y1="42" x2="38" y2="96" />
      <path d="M 38,42 Q 38,37 41,35" />
      <line x1="38" y1="54" x2="46" y2="54" stroke-width="2" />
      <line x1="38" y1="82" x2="46" y2="82" stroke-width="2" />

      <!-- 右側滑橇與支撐桿 -->
      <line x1="82" y1="42" x2="82" y2="96" />
      <path d="M 82,42 Q 82,37 79,35" />
      <line x1="82" y1="54" x2="74" y2="54" stroke-width="2" />
      <line x1="82" y1="82" x2="74" y2="82" stroke-width="2" />
    </g>

    <!-- 水平尾翼 (Horizontal Stabilizers - 極深碳黑外框線) -->
    <path d="M 42,132 L 78,132 L 75,138 L 45,138 Z" fill="url(#bodyGrad)" stroke="#0D1117" stroke-width="1.3" stroke-linejoin="round" />

    <!-- 尾梁與機身主體外輪廓 (Fuselage & Tail Boom - 極深碳黑外框線) -->
    <path d="M 60,24 
             C 74,24 81,38 80,62 
             C 79,82 72,96 65,108 
             L 63,156 
             L 66,162 
             L 54,162 
             L 57,156 
             L 55,108 
             C 48,96 41,82 40,62 
             C 39,38 46,24 60,24 Z" fill="url(#bodyGrad)" stroke="#0D1117" stroke-width="1.6" stroke-linejoin="round" />

    <!-- 機頭引擎蓋左側鉑銀金屬烤漆斜向高光反光 -->
    <g clip-path="url(#fuselageClip)">
      <polygon points="40,22 53,22 44,44 37,44" fill="#FFFFFF" fill-opacity="0.48" />
      <polygon points="55,22 59,22 50,44 46,44" fill="#FFFFFF" fill-opacity="0.32" />
    </g>

    <!-- 機頭前緣鼻錐高光與細節 -->
    <path d="M 52,26 Q 60,23 68,26" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.85" stroke-linecap="round" />
    <!-- 機身兩側細微壓線 -->
    <path d="M 46,56 C 45,70 48,84 53,95" fill="none" stroke="#0D1117" stroke-width="1" stroke-opacity="0.55" stroke-linecap="round" />
    <path d="M 74,56 C 75,70 72,84 67,95" fill="none" stroke="#0D1117" stroke-width="1" stroke-opacity="0.55" stroke-linecap="round" />

    <!-- 機頭探照燈 / 航行前燈 (LED 晶鑽白光) -->
    <ellipse cx="60" cy="25.5" rx="3.5" ry="1.5" fill="#F0F4F8" />

    <!-- 前擋風玻璃與駕駛艙罩 (glassGrad) -->
    <path d="M 60,26 C 72,26 78,36 77,50 C 70,47 50,47 43,50 C 42,36 48,26 60,26 Z" fill="url(#glassGrad)" stroke="#11161A" stroke-width="1" />
    
    <!-- 駕駛艙中柱框線 -->
    <line x1="60" y1="26" x2="60" y2="47.5" stroke="#1E262C" stroke-width="1.2" />

    <!-- 玻璃斜向白色高光條 (#FFFFFF, 15% 透明度) -->
    <g clip-path="url(#cockpitClip)">
      <polygon points="44,24 52,24 41,52 33,52" fill="#FFFFFF" fill-opacity="0.15" />
      <polygon points="56,24 61,24 50,52 45,52" fill="#FFFFFF" fill-opacity="0.15" />
    </g>

    <!-- 兩側觀察窗 (Side Windows) -->
    <path d="M 43,54 L 47,53 L 48,68 L 43,66 Z" fill="url(#glassGrad)" stroke="#11161A" stroke-width="0.8" />
    <path d="M 77,54 L 73,53 L 72,68 L 77,66 Z" fill="url(#glassGrad)" stroke="#11161A" stroke-width="0.8" />

    <!-- 機頂引擎整流罩 (roofGrad) -->
    <rect x="51" y="52" width="18" height="36" rx="8" fill="url(#roofGrad)" stroke="#0D1117" stroke-width="1.1" />
    
    <!-- 機頂左側斜向鉑銀高光反光條 -->
    <g clip-path="url(#roofClip)">
      <polygon points="50,50 58,50 51,88 46,88" fill="#FFFFFF" fill-opacity="0.52" />
      <polygon points="60,50 63,50 56,88 53,88" fill="#FFFFFF" fill-opacity="0.35" />
    </g>

    <!-- 機頂中央高光反光線 -->
    <line x1="60" y1="55" x2="60" y2="85" stroke="#FFFFFF" stroke-width="1.6" stroke-opacity="0.8" stroke-linecap="round" />

    <!-- 尾翼警示尾燈 (鮮紅色 #FF4D4D) -->
    <circle cx="60" cy="161" r="2" fill="#FF4D4D" />
    <!-- 兩側翼尖航行燈 -->
    <circle cx="42.5" cy="135" r="1.2" fill="#FF4D4D" />
    <circle cx="77.5" cy="135" r="1.2" fill="#F0F4F8" />

    <!-- 尾旋翼 (Tail Rotor) -->
    <rect x="64" y="148" width="2.5" height="14" rx="1" fill="#222B32" stroke="#11161A" stroke-width="0.6" />
    <line x1="63" y1="155" x2="65" y2="155" stroke="#0D1117" stroke-width="1.5" />

    <!-- 主旋翼系統 (Main Rotor Blades - X型配置與中心軸) -->
    <g transform="translate(60, 68)">
      <!-- 旋轉氣流微光圈 -->
      <circle cx="0" cy="0" r="48" fill="none" stroke="#6B7588" stroke-width="0.8" stroke-opacity="0.45" stroke-dasharray="18 10 6 10" />
      
      <!-- 主旋翼葉片 1 (左上 - 右下) -->
      <g transform="rotate(42)">
        <rect x="-52" y="-2.2" width="104" height="4.4" rx="1.5" fill="url(#rotorBladeGrad)" stroke="#11161A" stroke-width="0.7" />
        <line x1="-50" y1="-1" x2="50" y2="-1" stroke="#FFFFFF" stroke-width="0.7" stroke-opacity="0.25" />
        <!-- 葉片尖端亮石墨灰警示條 -->
        <rect x="-51" y="-1.8" width="4" height="3.6" fill="#8B95A6" />
        <rect x="47" y="-1.8" width="4" height="3.6" fill="#8B95A6" />
      </g>

      <!-- 主旋翼葉片 2 (右上 - 左下) -->
      <g transform="rotate(-42)">
        <rect x="-52" y="-2.2" width="104" height="4.4" rx="1.5" fill="url(#rotorBladeGrad)" stroke="#11161A" stroke-width="0.7" />
        <line x1="-50" y1="-1" x2="50" y2="-1" stroke="#FFFFFF" stroke-width="0.7" stroke-opacity="0.25" />
        <!-- 葉片尖端亮石墨灰警示條 -->
        <rect x="-51" y="-1.8" width="4" height="3.6" fill="#8B95A6" />
        <rect x="47" y="-1.8" width="4" height="3.6" fill="#8B95A6" />
      </g>

      <!-- 旋翼中心軸蓋 (Rotor Hub) -->
      <circle cx="0" cy="0" r="5" fill="#222B32" stroke="#11161A" stroke-width="1" />
      <circle cx="0" cy="0" r="2.2" fill="#8B95A6" />
    </g>

  </g>
</svg>