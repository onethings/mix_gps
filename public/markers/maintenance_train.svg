<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 180" width="120" height="180">
  <defs>
    <!-- 1. 車身主體多段金屬黑烤漆橫向漸層 (鐵灰色陰影 #2C3036 至亮銀白灰高光 #8A939E) -->
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1A1D22" />
      <stop offset="22%" stop-color="#353A42" />
      <stop offset="48%" stop-color="#6E7783" />
      <stop offset="55%" stop-color="#8A939E" />
      <stop offset="78%" stop-color="#454D58" />
      <stop offset="100%" stop-color="#1F2329" />
    </linearGradient>

    <!-- 2. 車頂頂蓋金屬黑光影漸層 -->
    <linearGradient id="roofGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8A939E" stop-opacity="0.92" />
      <stop offset="45%" stop-color="#4F5864" stop-opacity="0.88" />
      <stop offset="100%" stop-color="#1A1D22" stop-opacity="0.95" />
    </linearGradient>

    <!-- 3. 車窗玻璃反光漸層 -->
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E262C" />
      <stop offset="35%" stop-color="#37434D" />
      <stop offset="70%" stop-color="#222B32" />
      <stop offset="100%" stop-color="#11161A" />
    </linearGradient>

    <!-- 復古機械散熱風扇與金屬飾條漸層 -->
    <radialGradient id="fanGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#11161A" />
      <stop offset="65%" stop-color="#222B32" />
      <stop offset="100%" stop-color="#37434D" />
    </radialGradient>

    <!-- 4. 深炭黑底部懸浮立體陰影濾鏡 (確保在淺色與深色地圖背景上皆具有極佳的輪廓浮雕感，100% 透明背景) -->
    <filter id="blackDropShadow" x="-25%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#0A0C0E" flood-opacity="0.55" />
    </filter>

    <!-- 裁切路徑：雙片式駕駛窗斜向反光 -->
    <clipPath id="vintageGlassClip">
      <path d="M 38 49 Q 48 43 58 46 L 58 57 Q 48 55 37 59 Z" />
      <path d="M 82 49 Q 72 43 62 46 L 62 57 Q 72 55 83 59 Z" />
    </clipPath>

    <!-- 裁切路徑：車身與車頂左側斜向金屬白銀高光 -->
    <clipPath id="bodySpecularClip">
      <path d="M 34 48 C 34 28, 43 17, 60 17 C 77 17, 86 28, 86 48 L 86 156 C 86 160, 83 162, 79 162 L 41 162 C 37 162, 34 160, 34 156 Z" />
    </clipPath>
    <clipPath id="roofSpecularClip">
      <rect x="41" y="62" width="38" height="94" rx="5" />
    </clipPath>
  </defs>

  <!-- 車輛主群組 (套用深炭黑底部懸浮陰影，幾何中心精準對齊 60, 90) -->
  <g filter="url(#blackDropShadow)">

    <!-- 50年代經典結構：前後外露式防撞排障器 / 緩衝器與車鉤 -->
    <path d="M 41 18 Q 60 11 79 18 L 76 24 L 44 24 Z" fill="#242930" stroke="#11151A" stroke-width="1" />
    <rect x="57" y="10" width="6" height="6" rx="1.5" fill="#222B32" stroke="#11161A" stroke-width="1" />
    
    <!-- 車尾連接廊道與緩衝器 -->
    <rect x="46" y="160" width="28" height="6" rx="1" fill="#222B32" stroke="#11161A" stroke-width="1" />
    <rect x="57" y="165" width="6" height="5" rx="1.5" fill="#222B32" stroke="#11161A" stroke-width="1" />

    <!-- 車身外殼主體 (深鐵灰至亮銀灰金屬烤漆 + 沉穩純黑外框 #0D0F12) -->
    <path d="M 34 48 
             C 34 28, 43 17, 60 17 
             C 77 17, 86 28, 86 48 
             L 86 156 
             C 86 160, 83 162, 79 162 
             L 41 162 
             C 37 162, 34 160, 34 156 Z" fill="url(#bodyGrad)" stroke="#0D0F12" stroke-width="2" />

    <!-- 金屬烤漆質感：引擎蓋左側明亮白銀斜向高光反光帶 -->
    <g clip-path="url(#bodySpecularClip)">
      <polygon points="32,48 48,16 57,16 39,51" fill="#FFFFFF" fill-opacity="0.38" />
      <polygon points="41,49 59,16 62,16 44,50" fill="#FFFFFF" fill-opacity="0.25" />
    </g>

    <!-- 50年代短鼻引擎蓋 (Bulldog Nose) 凸起輪廓與壓線 -->
    <path d="M 40 44 C 42 29, 50 22, 60 22 C 70 22, 78 29, 80 44" fill="none" stroke="#2C323C" stroke-width="1.3" stroke-opacity="0.7" />
    
    <!-- 短鼻引擎蓋中央白銀高光反光線 -->
    <path d="M 46 39 C 49 29, 54 25, 60 25 C 66 25, 71 29, 74 39" fill="none" stroke="#E2E8F0" stroke-width="2.2" stroke-linecap="round" stroke-opacity="0.8" />
    <ellipse cx="58" cy="33" rx="4.5" ry="6" fill="#FFFFFF" fill-opacity="0.35" />

    <!-- 50年代經典特徵：車鼻正中央單顆大型圓形探照頭燈 -->
    <rect x="55" y="16" width="10" height="6" rx="3" fill="#0D0F12" />
    <ellipse cx="60" cy="18.5" rx="3.5" ry="2.2" fill="#FFFFFF" />

    <!-- 50年代經典特徵：高挑雙片式駕駛艙擋風玻璃 -->
    <path d="M 38 49 Q 48 43 58 46 L 58 57 Q 48 55 37 59 Z" fill="url(#glassGrad)" stroke="#11161A" stroke-width="1.2" />
    <path d="M 82 49 Q 72 43 62 46 L 62 57 Q 72 55 83 59 Z" fill="url(#glassGrad)" stroke="#11161A" stroke-width="1.2" />

    <!-- 擋風玻璃斜向白色反光條 -->
    <g clip-path="url(#vintageGlassClip)">
      <polygon points="35,61 46,41 51,41 40,61" fill="#FFFFFF" fill-opacity="0.22" />
      <polygon points="62,61 73,41 78,41 67,61" fill="#FFFFFF" fill-opacity="0.22" />
    </g>

    <!-- 駕駛室側邊三角窗與機械室圓形舷窗 -->
    <rect x="34.5" y="64" width="2.2" height="14" rx="1" fill="url(#glassGrad)" />
    <rect x="83.3" y="64" width="2.2" height="14" rx="1" fill="url(#glassGrad)" />
    <circle cx="35.5" cy="96" r="1.5" fill="#1E262C" />
    <circle cx="35.5" cy="122" r="1.5" fill="#1E262C" />
    <circle cx="84.5" cy="96" r="1.5" fill="#1E262C" />
    <circle cx="84.5" cy="122" r="1.5" fill="#1E262C" />

    <!-- 車頂主體高光區域 (套用 roofGrad) -->
    <rect x="41" y="62" width="38" height="94" rx="5" fill="url(#roofGrad)" />

    <!-- 金屬烤漆質感：車頂左側白銀斜向漆面高光反光帶 -->
    <g clip-path="url(#roofSpecularClip)">
      <polygon points="38,96 54,60 63,60 44,104" fill="#FFFFFF" fill-opacity="0.32" />
      <polygon points="45,106 65,60 68,60 48,110" fill="#FFFFFF" fill-opacity="0.22" />
      <polygon points="38,142 56,102 62,102 42,148" fill="#FFFFFF" fill-opacity="0.22" />
    </g>

    <!-- 車頂兩側走道防滑扶手與壓線 -->
    <line x1="39.5" y1="62" x2="39.5" y2="156" stroke="#2C323C" stroke-width="1.2" stroke-opacity="0.7" />
    <line x1="80.5" y1="62" x2="80.5" y2="156" stroke="#2C323C" stroke-width="1.2" stroke-opacity="0.7" />

    <!-- 車頂三組大型圓形散熱風扇鼓包 -->
    <!-- 第一組散熱風扇 -->
    <g transform="translate(60, 78)">
      <circle r="10.5" fill="url(#fanGrad)" stroke="#0D0F12" stroke-width="1.5" />
      <circle r="8.5" fill="none" stroke="#8A939E" stroke-width="0.7" stroke-opacity="0.6" />
      <path d="M -6 -2 L 6 2 M -2 6 L 2 -6 M -5 4 L 5 -4 M -4 -5 L 4 5" stroke="#4F5864" stroke-width="1.2" stroke-opacity="0.8" />
      <circle r="2.5" fill="#6E7783" stroke="#1E262C" stroke-width="0.8" />
    </g>

    <!-- 引擎室排氣煙囪 -->
    <rect x="53" y="94" width="5" height="9" rx="2" fill="#1E262C" stroke="#0D0F12" stroke-width="1" />
    <rect x="62" y="94" width="5" height="9" rx="2" fill="#1E262C" stroke="#0D0F12" stroke-width="1" />

    <!-- 第二組散熱風扇 -->
    <g transform="translate(60, 118)">
      <circle r="10.5" fill="url(#fanGrad)" stroke="#0D0F12" stroke-width="1.5" />
      <circle r="8.5" fill="none" stroke="#8A939E" stroke-width="0.7" stroke-opacity="0.6" />
      <path d="M -6 -2 L 6 2 M -2 6 L 2 -6 M -5 4 L 5 -4 M -4 -5 L 4 5" stroke="#4F5864" stroke-width="1.2" stroke-opacity="0.8" />
      <circle r="2.5" fill="#6E7783" stroke="#1E262C" stroke-width="0.8" />
    </g>

    <!-- 第三組散熱風扇 -->
    <g transform="translate(60, 143)">
      <circle r="9.5" fill="url(#fanGrad)" stroke="#0D0F12" stroke-width="1.5" />
      <circle r="7.5" fill="none" stroke="#8A939E" stroke-width="0.7" stroke-opacity="0.6" />
      <path d="M -5 -2 L 5 2 M -2 5 L 2 -5 M -4 4 L 4 -4" stroke="#4F5864" stroke-width="1.2" stroke-opacity="0.8" />
      <circle r="2.2" fill="#6E7783" stroke="#1E262C" stroke-width="0.8" />
    </g>

    <!-- 車頭輔助標誌燈與車尾警示紅燈 -->
    <circle cx="43" cy="23" r="1.8" fill="#FFFFFF" />
    <circle cx="77" cy="23" r="1.8" fill="#FFFFFF" />

    <!-- 車尾雙側警示紅燈 -->
    <rect x="38" y="159" width="5" height="2.5" rx="1" fill="#FF3B3B" />
    <rect x="77" y="159" width="5" height="2.5" rx="1" fill="#FF3B3B" />

  </g>
</svg>