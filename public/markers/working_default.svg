<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- 懸浮狀態：柔和的深藍色底部懸浮陰影濾鏡（背景 100% 透明） -->
    <filter id="skyBlueDropShadow" x="-30%" y="-25%" width="160%" height="165%">
      <!-- 底部較遠且柔和的深藍懸浮擴散影 -->
      <feGaussianBlur in="SourceAlpha" stdDeviation="4.5" result="blurShadow" />
      <feOffset in="blurShadow" dx="0" dy="5" result="offsetShadow" />
      <feFlood flood-color="#132B5E" flood-opacity="0.48" result="colorShadow" />
      <feComposite in="colorShadow" in2="offsetShadow" operator="in" result="dropShadowMain" />

      <!-- 緊貼本體下緣的深藍環境遮蔽影（增強懸浮立體感） -->
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.6" result="blurTight" />
      <feOffset in="blurTight" dx="0" dy="2" result="offsetTight" />
      <feFlood flood-color="#0E2047" flood-opacity="0.45" result="colorTight" />
      <feComposite in="colorTight" in2="offsetTight" operator="in" result="dropShadowTight" />

      <feMerge>
        <feMergeNode in="dropShadowMain" />
        <feMergeNode in="dropShadowTight" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- 橫向金屬烤漆主漸層：亮天藍 (#87B8FF) 至 鈷藍 (#2D5FBD) -->
    <linearGradient id="metallicSkyBlueBase" x1="0%" y1="45%" x2="100%" y2="55%">
      <stop offset="0%" stop-color="#87B8FF" />
      <stop offset="28%" stop-color="#5B95ED" />
      <stop offset="62%" stop-color="#3B72D4" />
      <stop offset="100%" stop-color="#2D5FBD" />
    </linearGradient>

    <!-- 中心箭頭專用橫向金屬漸層（確保箭頭寬度內完整呈現亮天藍至鈷藍過渡） -->
    <linearGradient id="arrowSkyBlueBase" x1="0%" y1="45%" x2="100%" y2="55%">
      <stop offset="0%" stop-color="#87B8FF" />
      <stop offset="32%" stop-color="#5B95ED" />
      <stop offset="68%" stop-color="#3B72D4" />
      <stop offset="100%" stop-color="#2D5FBD" />
    </linearGradient>

    <!-- 金屬邊緣倒角漸層（強化外環與箭頭厚度） -->
    <linearGradient id="skyBlueMetallicRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#CBE3FF" stop-opacity="0.9" />
      <stop offset="48%" stop-color="#386FD1" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#1B3E85" stop-opacity="0.95" />
    </linearGradient>

    <!-- 左側冰藍色高光反光漸層 -->
    <linearGradient id="iceBlueLeftGloss" x1="0%" y1="20%" x2="72%" y2="80%">
      <stop offset="0%" stop-color="#E8F5FF" stop-opacity="0.72" />
      <stop offset="32%" stop-color="#A8D4FF" stop-opacity="0.3" />
      <stop offset="62%" stop-color="#87B8FF" stop-opacity="0" />
    </linearGradient>

    <!-- 裁切路徑：確保冰藍色高光只作用在圓環與箭頭本體上 -->
    <clipPath id="skyBlueIconClip">
      <path fill-rule="evenodd" d="M64,14 A50,50 0 1,0 64,114 A50,50 0 1,0 64,14 Z M64,22 A42,42 0 1,1 64,106 A42,42 0 1,1 64,22 Z" />
      <path d="M64,37 C65.8,37 67.3,38.1 68.2,39.8 L86.5,75.8 C87.8,78.4 85.4,81.2 82.6,80.2 L65.5,74.1 C64.5,73.7 63.5,73.7 62.5,74.1 L45.4,80.2 C42.6,81.2 40.2,78.4 41.5,75.8 L59.8,39.8 C60.7,38.1 62.2,37 64,37 Z" />
    </clipPath>
  </defs>

  <!-- 主圖層（套用深藍色底部懸浮陰影，背景 100% 透明） -->
  <g filter="url(#skyBlueDropShadow)">
    <!-- 1. 外圓環底層金屬烤漆 -->
    <path fill-rule="evenodd" d="M64,14 A50,50 0 1,0 64,114 A50,50 0 1,0 64,14 Z M64,22 A42,42 0 1,1 64,106 A42,42 0 1,1 64,22 Z" fill="url(#metallicSkyBlueBase)" />

    <!-- 外圓環金屬倒角細邊 -->
    <circle cx="64" cy="64" r="49.5" fill="none" stroke="url(#skyBlueMetallicRim)" stroke-width="1.2" />
    <circle cx="64" cy="64" r="42.5" fill="none" stroke="url(#skyBlueMetallicRim)" stroke-width="1" />

    <!-- 2. 中心導航箭頭主體 -->
    <path d="M64,37 C65.8,37 67.3,38.1 68.2,39.8 L86.5,75.8 C87.8,78.4 85.4,81.2 82.6,80.2 L65.5,74.1 C64.5,73.7 63.5,73.7 62.5,74.1 L45.4,80.2 C42.6,81.2 40.2,78.4 41.5,75.8 L59.8,39.8 C60.7,38.1 62.2,37 64,37 Z" fill="url(#arrowSkyBlueBase)" stroke="url(#skyBlueMetallicRim)" stroke-width="1.2" stroke-linejoin="round" />

    <!-- 3. 左側冰藍色高光反光層 -->
    <g clip-path="url(#skyBlueIconClip)">
      <!-- 大面積斜向清漆反光帶 -->
      <polygon points="8,10 66,10 36,118 -12,118" fill="url(#iceBlueLeftGloss)" />
      <!-- 外環左側冰藍弧形高光線 -->
      <path d="M20,46 A46,46 0 0,1 54,18" fill="none" stroke="#E8F5FF" stroke-width="1.8" stroke-linecap="round" opacity="0.78" />
      <!-- 箭頭左側斜邊冰藍高光 -->
      <line x1="62.5" y1="40.5" x2="44.5" y2="75.5" stroke="#D6EEFF" stroke-width="1.6" stroke-linecap="round" opacity="0.82" />
    </g>
  </g>
</svg>