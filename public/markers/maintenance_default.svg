<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- 黑色立體狀態光暈與底部懸浮陰影（背景 100% 透明） -->
    <filter id="metallicBlackShadow" x="-30%" y="-25%" width="160%" height="165%">
      <!-- 底部深邃黑浮雕懸浮影 -->
      <feGaussianBlur in="SourceAlpha" stdDeviation="4.5" result="blurShadow" />
      <feOffset in="blurShadow" dx="0" dy="5" result="offsetShadow" />
      <feFlood flood-color="#000000" flood-opacity="0.55" result="colorShadow" />
      <feComposite in="colorShadow" in2="offsetShadow" operator="in" result="dropShadowMain" />

      <!-- 內層微光陰影（增強邊緣輪廓） -->
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.6" result="blurTight" />
      <feOffset in="blurTight" dx="0" dy="2" result="offsetTight" />
      <feFlood flood-color="#000000" flood-opacity="0.45" result="colorTight" />
      <feComposite in="colorTight" in2="offsetTight" operator="in" result="dropShadowTight" />

      <feMerge>
        <feMergeNode in="dropShadowMain" />
        <feMergeNode in="dropShadowTight" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- 橫向金屬黑烤漆主漸層：亮槍灰色 (#555C6B) 至 漆黑深淵 (#0A0C10) -->
    <linearGradient id="metallicBlackBase" x1="0%" y1="45%" x2="100%" y2="55%">
      <stop offset="0%" stop-color="#555C6B" />
      <stop offset="28%" stop-color="#323842" />
      <stop offset="65%" stop-color="#16191E" />
      <stop offset="100%" stop-color="#0A0C10" />
    </linearGradient>

    <!-- 中心箭頭專用橫向金屬黑漸層（確保箭頭寬度內完整呈現亮槍灰至深黑過渡） -->
    <linearGradient id="arrowBlackBase" x1="0%" y1="45%" x2="100%" y2="55%">
      <stop offset="0%" stop-color="#555C6B" />
      <stop offset="32%" stop-color="#323842" />
      <stop offset="68%" stop-color="#16191E" />
      <stop offset="100%" stop-color="#0A0C10" />
    </linearGradient>

    <!-- 鉑銀邊框金屬倒角漸層（防吃邊處理，讓黑圖標在深/淺地圖都清晰） -->
    <linearGradient id="blackMetallicRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A6AFBE" stop-opacity="0.85" />
      <stop offset="50%" stop-color="#4F5665" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#16191E" stop-opacity="0.95" />
    </linearGradient>

    <!-- 左側純白鏡面高光反光漸層 -->
    <linearGradient id="blackLeftGloss" x1="0%" y1="20%" x2="72%" y2="80%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.85" />
      <stop offset="35%" stop-color="#D4DCED" stop-opacity="0.38" />
      <stop offset="65%" stop-color="#555C6B" stop-opacity="0" />
    </linearGradient>

    <!-- 裁切路徑：確保金屬高光只作用在圓環與箭頭本體上 -->
    <clipPath id="blackIconClip">
      <path fill-rule="evenodd" d="M64,14 A50,50 0 1,0 64,114 A50,50 0 1,0 64,14 Z M64,22 A42,42 0 1,1 64,106 A42,42 0 1,1 64,22 Z" />
      <path d="M64,37 C65.8,37 67.3,38.1 68.2,39.8 L86.5,75.8 C87.8,78.4 85.4,81.2 82.6,80.2 L65.5,74.1 C64.5,73.7 63.5,73.7 62.5,74.1 L45.4,80.2 C42.6,81.2 40.2,78.4 41.5,75.8 L59.8,39.8 C60.7,38.1 62.2,37 64,37 Z" />
    </clipPath>
  </defs>

  <!-- 主圖層（套用深邃黑色底部懸浮陰影，背景 100% 透明） -->
  <g filter="url(#metallicBlackShadow)">
    <!-- 1. 外圓環金屬黑主體 + 鉑銀金屬描邊 -->
    <path fill-rule="evenodd" d="M64,14 A50,50 0 1,0 64,114 A50,50 0 1,0 64,14 Z M64,22 A42,42 0 1,1 64,106 A42,42 0 1,1 64,22 Z" fill="url(#metallicBlackBase)" stroke="url(#blackMetallicRim)" stroke-width="1.2" stroke-linejoin="round" />

    <!-- 2. 中心導航箭頭金屬黑主體 + 鉑銀金屬描邊 -->
    <path d="M64,37 C65.8,37 67.3,38.1 68.2,39.8 L86.5,75.8 C87.8,78.4 85.4,81.2 82.6,80.2 L65.5,74.1 C64.5,73.7 63.5,73.7 62.5,74.1 L45.4,80.2 C42.6,81.2 40.2,78.4 41.5,75.8 L59.8,39.8 C60.7,38.1 62.2,37 64,37 Z" fill="url(#arrowBlackBase)" stroke="url(#blackMetallicRim)" stroke-width="1.2" stroke-linejoin="round" />

    <!-- 3. 左側純白鋼琴烤漆高光反光層 -->
    <g clip-path="url(#blackIconClip)">
      <!-- 斜向鏡面反光帶 -->
      <polygon points="8,10 66,10 36,118 -12,118" fill="url(#blackLeftGloss)" />
      <!-- 外環左側亮白鏡面弧形高光線 -->
      <path d="M20,46 A46,46 0 0,1 54,18" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" opacity="0.88" />
      <!-- 箭頭左側斜邊亮白鏡面高光 -->
      <line x1="62.5" y1="40.5" x2="44.5" y2="75.5" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round" opacity="0.9" />
    </g>
  </g>
</svg>