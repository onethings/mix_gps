<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- 停車狀態：柔和暗紅色擴散光暈濾鏡 -->
    <filter id="parkedRedGlow" x="-30%" y="-30%" width="160%" height="160%">
      <!-- 外層大範圍柔和擴散 -->
      <feGaussianBlur in="SourceAlpha" stdDeviation="5.5" result="blurOuter" />
      <feFlood flood-color="#6E0B0B" flood-opacity="0.55" result="colorOuter" />
      <feComposite in="colorOuter" in2="blurOuter" operator="in" result="glowOuter" />
      
      <!-- 內層緊緻暗紅邊緣光暈 -->
      <feGaussianBlur in="SourceAlpha" stdDeviation="2.2" result="blurInner" />
      <feFlood flood-color="#9E1414" flood-opacity="0.7" result="colorInner" />
      <feComposite in="colorInner" in2="blurInner" operator="in" result="glowInner" />
      
      <feMerge>
        <feMergeNode in="glowOuter" />
        <feMergeNode in="glowInner" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- 金屬烤漆主漸層：深酒紅 (#7D1111) 到 亮寶石紅 (#E33939) 多段漸層 -->
    <linearGradient id="metallicRubyBase" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#E33939" />
      <stop offset="28%" stop-color="#B81D1D" />
      <stop offset="55%" stop-color="#7D1111" />
      <stop offset="82%" stop-color="#C92828" />
      <stop offset="100%" stop-color="#690B0B" />
    </linearGradient>

    <!-- 金屬邊緣倒角漸層（增加厚度與立體感） -->
    <linearGradient id="metallicRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7A7A" stop-opacity="0.85" />
      <stop offset="45%" stop-color="#B01919" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#4A0606" stop-opacity="0.9" />
    </linearGradient>

    <!-- 左側斜向高光反光漸層 -->
    <linearGradient id="leftDiagonalGloss" x1="0%" y1="15%" x2="75%" y2="85%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.65" />
      <stop offset="35%" stop-color="#FF9E9E" stop-opacity="0.25" />
      <stop offset="65%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <!-- 裁切路徑：確保斜向高光只作用在圓環與箭頭本體上 -->
    <clipPath id="iconShapeClip">
      <!-- 外圓環 (外半徑 50, 內半徑 42) -->
      <path fill-rule="evenodd" d="M64,14 A50,50 0 1,0 64,114 A50,50 0 1,0 64,14 Z M64,22 A42,42 0 1,1 64,106 A42,42 0 1,1 64,22 Z" />
      <!-- 中心導航箭頭 -->
      <path d="M64,37 C65.8,37 67.3,38.1 68.2,39.8 L86.5,75.8 C87.8,78.4 85.4,81.2 82.6,80.2 L65.5,74.1 C64.5,73.7 63.5,73.7 62.5,74.1 L45.4,80.2 C42.6,81.2 40.2,78.4 41.5,75.8 L59.8,39.8 C60.7,38.1 62.2,37 64,37 Z" />
    </clipPath>
  </defs>

  <!-- 主圖層（套用停車暗紅光暈） -->
  <g filter="url(#parkedRedGlow)">
    <!-- 1. 外圓環底層金屬烤漆 -->
    <path fill-rule="evenodd" d="M64,14 A50,50 0 1,0 64,114 A50,50 0 1,0 64,14 Z M64,22 A42,42 0 1,1 64,106 A42,42 0 1,1 64,22 Z" fill="url(#metallicRubyBase)" />

    <!-- 外圓環金屬倒角細邊 -->
    <circle cx="64" cy="64" r="49.5" fill="none" stroke="url(#metallicRim)" stroke-width="1" />
    <circle cx="64" cy="64" r="42.5" fill="none" stroke="url(#metallicRim)" stroke-width="0.8" />

    <!-- 2. 中心導航箭頭主體 -->
    <path d="M64,37 C65.8,37 67.3,38.1 68.2,39.8 L86.5,75.8 C87.8,78.4 85.4,81.2 82.6,80.2 L65.5,74.1 C64.5,73.7 63.5,73.7 62.5,74.1 L45.4,80.2 C42.6,81.2 40.2,78.4 41.5,75.8 L59.8,39.8 C60.7,38.1 62.2,37 64,37 Z" fill="url(#metallicRubyBase)" stroke="url(#metallicRim)" stroke-width="1.1" stroke-linejoin="round" />

    <!-- 3. 左側斜向高光反光層（模擬曲面烤漆鏡面反射） -->
    <g clip-path="url(#iconShapeClip)">
      <!-- 大面積斜向清漆反光帶 -->
      <polygon points="8,10 68,10 38,118 -12,118" fill="url(#leftDiagonalGloss)" />
      <!-- 左側銳利高光切線（強化金屬漆面銳度） -->
      <path d="M22,38 A46,46 0 0,1 56,18" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" opacity="0.65" />
      <!-- 箭頭左側斜邊高光 -->
      <line x1="62.5" y1="40.5" x2="44.5" y2="75.5" stroke="#FFCECE" stroke-width="1.6" stroke-linecap="round" opacity="0.75" />
    </g>
  </g>
</svg>