<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 180" width="120" height="180">
  <defs>
    <!-- 柔和深藍色底部懸浮陰影（完全去背透明） -->
    <filter id="blueDropShadow" x="-30%" y="-20%" width="160%" height="150%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5" />
      <feOffset dx="0" dy="6" result="offsetblur" />
      <feFlood flood-color="#0C224A" flood-opacity="0.38" />
      <feComposite in2="offsetblur" operator="in" />
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- 亮天藍（#87B8FF）至鈷藍（#2D5FBD）多段橫向金屬漸層 -->
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2D5FBD" />
      <stop offset="20%" stop-color="#538CEB" />
      <stop offset="48%" stop-color="#87B8FF" />
      <stop offset="56%" stop-color="#6EA3F7" />
      <stop offset="82%" stop-color="#4279DB" />
      <stop offset="100%" stop-color="#2653A8" />
    </linearGradient>

    <!-- 車頂頂蓋金屬烤漆漸層 -->
    <linearGradient id="roofGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9EC7FF" stop-opacity="0.95" />
      <stop offset="50%" stop-color="#5A92F0" stop-opacity="0.90" />
      <stop offset="100%" stop-color="#2D5FBD" stop-opacity="0.88" />
    </linearGradient>

    <!-- 車窗與前後擋風玻璃深色反光漸層 -->
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E262C" />
      <stop offset="35%" stop-color="#37434D" />
      <stop offset="70%" stop-color="#222B32" />
      <stop offset="100%" stop-color="#11161A" />
    </linearGradient>

    <!-- 計程車頂燈漸層 -->
    <linearGradient id="taxiSignGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF275" />
      <stop offset="100%" stop-color="#F5B800" />
    </linearGradient>

    <!-- 玻璃斜向反光遮罩路徑 -->
    <clipPath id="windshieldClip">
      <path d="M 32 56 Q 60 47 88 56 L 82 77 Q 60 72 38 77 Z" />
    </clipPath>
    <clipPath id="rearWindowClip">
      <path d="M 38 128 Q 60 132 82 128 L 86 146 Q 60 153 34 146 Z" />
    </clipPath>
    <!-- 引擎蓋左側斜向高光遮罩 -->
    <clipPath id="hoodClip">
      <path d="M 60 16 C 78 16, 91 22, 93 36 L 88 56 Q 60 47 32 56 L 27 36 C 29 22, 42 16, 60 16 Z" />
    </clipPath>
    <!-- 車頂左側斜向高光遮罩 -->
    <clipPath id="roofClip">
      <rect x="38" y="77" width="44" height="50" rx="6" ry="6" />
    </clipPath>
  </defs>

  <!-- 車輛主群組（含深藍色懸浮陰影，畫布中心點 60, 90） -->
  <g filter="url(#blueDropShadow)">
    <!-- 左右後視鏡 -->
    <path d="M 27 64 L 16 68 Q 14 69 15 72 L 17 75 Q 18 76 21 75 L 27 72 Z" fill="#3B72D4" stroke="#1E448C" stroke-width="1.5" stroke-linejoin="round" />
    <path d="M 93 64 L 104 68 Q 106 69 105 72 L 103 75 Q 102 76 99 75 L 93 72 Z" fill="#2D5FBD" stroke="#1E448C" stroke-width="1.5" stroke-linejoin="round" />

    <!-- 車身外殼輪廓 -->
    <path d="M 60 16
             C 78 16, 91 22, 93 36
             L 94 142
             C 94 156, 82 164, 60 164
             C 38 164, 26 156, 26 142
             L 27 36
             C 29 22, 42 16, 60 16 Z" fill="url(#bodyGrad)" stroke="#1E448C" stroke-width="2" />

    <!-- 引擎蓋細微壓線（兩側） -->
    <path d="M 38 24 Q 40 38 36 53" fill="none" stroke="#244E9E" stroke-width="1.4" stroke-opacity="0.55" stroke-linecap="round" />
    <path d="M 82 24 Q 80 38 84 53" fill="none" stroke="#244E9E" stroke-width="1.4" stroke-opacity="0.55" stroke-linecap="round" />

    <!-- 引擎蓋折線反光與左側冰藍色金屬高光 -->
    <g clip-path="url(#hoodClip)">
      <polygon points="28,16 44,16 33,56 22,56" fill="#D9ECFF" fill-opacity="0.45" />
      <polygon points="47,16 53,16 42,56 37,56" fill="#F0F8FF" fill-opacity="0.34" />
    </g>
    <path d="M 43 22 Q 46 36 42 50 Q 47 36 45 22 Z" fill="#C7E2FF" fill-opacity="0.72" />
    <path d="M 77 22 Q 74 36 78 50 Q 73 36 75 22 Z" fill="#B3D6FF" fill-opacity="0.50" />

    <!-- 車頭水箱護罩飾條 -->
    <path d="M 47 17.5 Q 60 15.5 73 17.5" fill="none" stroke="#1E262C" stroke-width="2" stroke-linecap="round" />

    <!-- 車頭燈（LED 晶鑽白光） -->
    <path d="M 30 27 Q 34 21 43 20 Q 39 26 31 31 Z" fill="#F2F8FF" stroke="#B3D6FF" stroke-width="0.6" />
    <path d="M 90 27 Q 86 21 77 20 Q 81 26 89 31 Z" fill="#F2F8FF" stroke="#B3D6FF" stroke-width="0.6" />

    <!-- 車尾燈（警示紅光） -->
    <path d="M 29 152 Q 33 159 44 161 Q 40 155 30 149 Z" fill="#FF3B3B" stroke="#7A0C0C" stroke-width="0.7" />
    <path d="M 91 152 Q 87 159 76 161 Q 80 155 90 149 Z" fill="#FF3B3B" stroke="#7A0C0C" stroke-width="0.7" />

    <!-- 前擋風玻璃 -->
    <path d="M 32 56 Q 60 47 88 56 L 82 77 Q 60 72 38 77 Z" fill="url(#glassGrad)" stroke="#11161A" stroke-width="1.2" stroke-linejoin="round" />
    <!-- 前擋風玻璃斜向白色反光條 -->
    <g clip-path="url(#windshieldClip)">
      <polygon points="36,46 48,46 34,82 22,82" fill="#FFFFFF" fill-opacity="0.16" />
      <polygon points="53,46 58,46 44,82 39,82" fill="#FFFFFF" fill-opacity="0.16" />
    </g>

    <!-- 左側車窗（前後兩片） -->
    <path d="M 30 62 L 35 79 L 35 101 L 30 101 Z" fill="url(#glassGrad)" stroke="#11161A" stroke-width="1" stroke-linejoin="round" />
    <path d="M 30 104 L 35 104 L 35 124 L 30 139 Z" fill="url(#glassGrad)" stroke="#11161A" stroke-width="1" stroke-linejoin="round" />
    <!-- 左側窗斜向反光 -->
    <polygon points="29,72 36,68 36,73 29,77" fill="#FFFFFF" fill-opacity="0.16" />
    <polygon points="29,114 36,110 36,115 29,119" fill="#FFFFFF" fill-opacity="0.16" />

    <!-- 右側車窗（前後兩片） -->
    <path d="M 90 62 L 85 79 L 85 101 L 90 101 Z" fill="url(#glassGrad)" stroke="#11161A" stroke-width="1" stroke-linejoin="round" />
    <path d="M 90 104 L 85 104 L 85 124 L 90 139 Z" fill="url(#glassGrad)" stroke="#11161A" stroke-width="1" stroke-linejoin="round" />
    <!-- 右側窗斜向反光 -->
    <polygon points="84,74 91,70 91,75 84,79" fill="#FFFFFF" fill-opacity="0.16" />
    <polygon points="84,116 91,112 91,117 84,121" fill="#FFFFFF" fill-opacity="0.16" />

    <!-- 後擋風玻璃 -->
    <path d="M 38 128 Q 60 132 82 128 L 86 146 Q 60 153 34 146 Z" fill="url(#glassGrad)" stroke="#11161A" stroke-width="1.2" stroke-linejoin="round" />
    <!-- 後擋風玻璃斜向白色反光條 -->
    <g clip-path="url(#rearWindowClip)">
      <polygon points="56,124 67,124 53,156 42,156" fill="#FFFFFF" fill-opacity="0.16" />
      <polygon points="71,124 75,124 61,156 57,156" fill="#FFFFFF" fill-opacity="0.16" />
    </g>

    <!-- 車頂頂蓋結構 -->
    <rect x="38" y="77" width="44" height="50" rx="6" ry="6" fill="url(#roofGrad)" stroke="#1E448C" stroke-width="1.2" />

    <!-- 車頂左側斜向冰藍色金屬高光反光 -->
    <g clip-path="url(#roofClip)">
      <polygon points="38,77 54,77 43,127 36,127" fill="#D9ECFF" fill-opacity="0.42" />
      <polygon points="57,77 62,77 51,127 47,127" fill="#F0F8FF" fill-opacity="0.30" />
    </g>

    <!-- 計程車頂燈（Taxi Sign，位於車頂正中央 x=60, y=91） -->
    <g transform="translate(60, 91)">
      <!-- 頂燈底座陰影 -->
      <rect x="-15" y="-5" width="30" height="12" rx="3" fill="#14326B" fill-opacity="0.42" />
      <!-- 頂燈主體 -->
      <rect x="-14" y="-6" width="28" height="11" rx="2.5" fill="url(#taxiSignGrad)" stroke="#8A6200" stroke-width="1.2" />
      <!-- 頂燈高光條 -->
      <rect x="-12" y="-4.5" width="24" height="3" rx="1" fill="#FFFFFF" fill-opacity="0.65" />
      <!-- TAXI 識別刻紋 -->
      <text x="0" y="2.2" font-family="Arial, Helvetica, sans-serif" font-size="6.5" font-weight="900" fill="#1E262C" text-anchor="middle" letter-spacing="0.6">TAXI</text>
    </g>

    <!-- 車尾行李箱折線高光 -->
    <path d="M 41 156 Q 60 160 79 156" fill="none" stroke="#C7E2FF" stroke-width="1.5" stroke-opacity="0.6" stroke-linecap="round" />
  </g>
</svg>