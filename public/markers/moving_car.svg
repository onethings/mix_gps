<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 180" width="120" height="180">
  <defs>
    <!-- 車身漸層 -->
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58B838" />
      <stop offset="30%" stop-color="#7EE05A" />
      <stop offset="50%" stop-color="#96F272" />
      <stop offset="70%" stop-color="#7EE05A" />
      <stop offset="100%" stop-color="#4FA832" />
    </linearGradient>

    <!-- 車頂高光漸層 -->
    <linearGradient id="roofGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#B8FF9E" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#68CC47" stop-opacity="0.8" />
    </linearGradient>

    <!-- 車窗玻璃漸層 -->
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E262C" />
      <stop offset="45%" stop-color="#37434D" />
      <stop offset="55%" stop-color="#222B32" />
      <stop offset="100%" stop-color="#11161A" />
    </linearGradient>

    <!-- 柔和底部陰影 -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#1A3312" flood-opacity="0.35" />
    </filter>
  </defs>

  <g filter="url(#dropShadow)">
    <!-- 左右後視鏡 -->
    <path d="M26 62 L16 66 C14 67 14 71 17 72 L26 71 Z" fill="#52AD34" />
    <path d="M94 62 L104 66 C106 67 106 71 103 72 L94 71 Z" fill="#52AD34" />

    <!-- 車身主體輪廓 -->
    <path d="M60 14 
             C42 14, 28 24, 27 42 
             L26 138 
             C26 154, 38 164, 60 164 
             C82 164, 94 154, 94 138 
             L93 42 
             C92 24, 78 14, 60 14 Z" fill="url(#bodyGrad)" stroke="#3D8A24" stroke-width="1.5" />

    <!-- 引擎蓋折線細節 -->
    <path d="M40 24 Q60 19 80 24" fill="none" stroke="#B6FF9C" stroke-width="1.5" stroke-linecap="round" opacity="0.7" />
    <path d="M38 30 L42 52 M82 30 L78 52" fill="none" stroke="#47992C" stroke-width="1.2" opacity="0.5" />

    <!-- 前擋風玻璃 -->
    <path d="M35 55 C45 48, 75 48, 85 55 L80 74 C67 70, 53 70, 40 74 Z" fill="url(#glassGrad)" />
    <!-- 前擋風玻璃反光條 -->
    <path d="M42 54 L54 52 L48 70 L39 69 Z" fill="#FFFFFF" opacity="0.15" />

    <!-- 側邊車窗 -->
    <path d="M31 62 L36 77 L36 116 L31 126 Z" fill="#1E262C" />
    <path d="M89 62 L84 77 L84 116 L89 126 Z" fill="#1E262C" />

    <!-- 後擋風玻璃 -->
    <path d="M39 122 C53 125, 67 125, 81 122 L84 139 C72 145, 48 145, 36 139 Z" fill="url(#glassGrad)" />

    <!-- 車頂蓋 -->
    <rect x="39" y="75" width="42" height="45" rx="8" fill="url(#roofGrad)" stroke="#55B336" stroke-width="1" />

    <!-- 車頭燈 (LED 造型) -->
    <path d="M31 27 Q37 21 45 22 Q39 27 32 32 Z" fill="#E8FFDE" />
    <path d="M89 27 Q83 21 75 22 Q81 27 88 32 Z" fill="#E8FFDE" />

    <!-- 車尾燈 -->
    <path d="M32 152 Q40 158 48 157 L46 153 Q39 154 33 149 Z" fill="#FF4D4D" />
    <path d="M88 152 Q80 158 72 157 L74 153 Q81 154 87 149 Z" fill="#FF4D4D" />
  </g>
</svg>