<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 180" width="120" height="180">
  <defs>
    <!-- 柔和深灰底部懸浮陰影濾鏡（背景 100% 透明，確保在淺灰或白色地圖背景上保持清晰輪廓辨識度） -->
    <filter id="metallicSilverShadow" x="-35%" y="-35%" width="170%" height="170%">
      <feDropShadow dx="0" dy="4" stdDeviation="5.5" flood-color="#1E2228" flood-opacity="0.45" />
      <feDropShadow dx="0" dy="0" stdDeviation="2.5" flood-color="#3A4048" flood-opacity="0.28" />
    </filter>

    <!-- 金屬銀主體橫向漸層：亮銀白 (#E4E8ED) 至 冷鐵灰 (#7D838B) -->
    <linearGradient id="metallicSilverBodyGrad" x1="0%" y1="15%" x2="100%" y2="85%">
      <stop offset="0%" stop-color="#9CA2AB" />
      <stop offset="22%" stop-color="#E4E8ED" />
      <stop offset="36%" stop-color="#FFFFFF" />
      <stop offset="55%" stop-color="#B8BFC8" />
      <stop offset="82%" stop-color="#7D838B" />
      <stop offset="100%" stop-color="#5B6168" />
    </linearGradient>

    <!-- 肉墊立體凸起金屬銀光澤漸層 -->
    <linearGradient id="padSilverGrad" x1="15%" y1="10%" x2="88%" y2="90%">
      <stop offset="0%" stop-color="#F2F5F8" />
      <stop offset="32%" stop-color="#E4E8ED" />
      <stop offset="75%" stop-color="#949BA4" />
      <stop offset="100%" stop-color="#7D838B" />
    </linearGradient>

    <!-- 肉墊內部立體明暗與下緣深灰倒影 -->
    <linearGradient id="padInnerDepth" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.55" />
      <stop offset="45%" stop-color="#E4E8ED" stop-opacity="0" />
      <stop offset="100%" stop-color="#2D3238" stop-opacity="0.45" />
    </linearGradient>

    <!-- 左側銀白高光反光漸層 -->
    <linearGradient id="leftSilverSheen" x1="0%" y1="0%" x2="100%" y2="30%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.88" />
      <stop offset="45%" stop-color="#E4E8ED" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#E4E8ED" stop-opacity="0" />
    </linearGradient>

    <!-- 頂部銀白高光光斑漸層 -->
    <radialGradient id="topSilverGlossSpot" cx="38%" cy="28%" r="55%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.92" />
      <stop offset="45%" stop-color="#E4E8ED" stop-opacity="0.38" />
      <stop offset="100%" stop-color="#E4E8ED" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- 整體腳印群組，套用深灰懸浮陰影，120x180 畫布中心對齊，背景 100% 透明 -->
  <g filter="url(#metallicSilverShadow)">
    <!-- 腳印外輪廓底層（深灰色外框線 #383D44 + 金屬銀主體） -->
    <path d="M 60 36
             C 55 24, 34 24, 32 45
             C 16 44, 12 65, 16 88
             C 20 112, 23 132, 34 146
             C 44 157, 76 157, 86 146
             C 97 132, 100 112, 104 88
             C 108 65, 104 44, 88 45
             C 86 24, 65 24, 60 36 Z" fill="url(#metallicSilverBodyGrad)" stroke="#383D44" stroke-width="3.2" stroke-linejoin="round" />

    <!-- 外輪廓內側亮銀邊緣高光線（模擬金屬切角反光） -->
    <path d="M 60 39.5
             C 55 28.5, 36.5 28.5, 34.5 48
             C 20 47.5, 16.5 66, 20 87.5
             C 24 110.5, 26.5 130, 36.5 143
             C 45.5 153, 74.5 153, 83.5 143
             C 93.5 130, 96 110.5, 100 87.5
             C 103.5 66, 100 47.5, 85.5 48
             C 83.5 28.5, 65 28.5, 60 39.5 Z" fill="none" stroke="#FFFFFF" stroke-width="1.3" stroke-opacity="0.6" />

    <!-- 左側銀白斜向高光反光帶（呈現立體金屬質感） -->
    <path d="M 33 49
             C 21 51, 18 68, 22 88
             C 25 107, 28 124, 36 136
             C 32 121, 30 103, 28 85
             C 26 68, 29 56, 37 49 Z" fill="url(#leftSilverSheen)" />

    <!-- ========== 四顆腳趾肉墊（方向朝上，與原圖完全一致） ========== -->

    <!-- 1. 最左側小趾墊 -->
    <g>
      <ellipse cx="27.5" cy="67.5" rx="9.2" ry="11.8" transform="rotate(-10 27.5 67.5)" fill="url(#padSilverGrad)" stroke="#383D44" stroke-width="2.4" />
      <ellipse cx="27.5" cy="67.5" rx="8.0" ry="10.5" transform="rotate(-10 27.5 67.5)" fill="url(#padInnerDepth)" />
      <!-- 左上銀白高光 -->
      <ellipse cx="25.2" cy="61.8" rx="4.2" ry="2.4" transform="rotate(-25 25.2 61.8)" fill="url(#topSilverGlossSpot)" />
    </g>

    <!-- 2. 左中主趾墊 -->
    <g>
      <ellipse cx="46.2" cy="48.5" rx="10.2" ry="13.2" transform="rotate(-5 46.2 48.5)" fill="url(#padSilverGrad)" stroke="#383D44" stroke-width="2.5" />
      <ellipse cx="46.2" cy="48.5" rx="9.0" ry="11.8" transform="rotate(-5 46.2 48.5)" fill="url(#padInnerDepth)" />
      <!-- 左上銀白高光 -->
      <ellipse cx="43.5" cy="41.8" rx="4.8" ry="2.7" transform="rotate(-22 43.5 41.8)" fill="url(#topSilverGlossSpot)" />
    </g>

    <!-- 3. 右中主趾墊 -->
    <g>
      <ellipse cx="73.8" cy="48.5" rx="10.2" ry="13.2" transform="rotate(5 73.8 48.5)" fill="url(#padSilverGrad)" stroke="#383D44" stroke-width="2.5" />
      <ellipse cx="73.8" cy="48.5" rx="9.0" ry="11.8" transform="rotate(5 73.8 48.5)" fill="url(#padInnerDepth)" />
      <!-- 左上銀白高光 -->
      <ellipse cx="70.8" cy="41.8" rx="4.8" ry="2.7" transform="rotate(-18 70.8 41.8)" fill="url(#topSilverGlossSpot)" />
    </g>

    <!-- 4. 最右側小趾墊 -->
    <g>
      <ellipse cx="92.5" cy="67.5" rx="9.2" ry="11.8" transform="rotate(10 92.5 67.5)" fill="url(#padSilverGrad)" stroke="#383D44" stroke-width="2.4" />
      <ellipse cx="92.5" cy="67.5" rx="8.0" ry="10.5" transform="rotate(10 92.5 67.5)" fill="url(#padInnerDepth)" />
      <!-- 左上銀白高光 -->
      <ellipse cx="89.8" cy="61.8" rx="4.2" ry="2.4" transform="rotate(-20 89.8 61.8)" fill="url(#topSilverGlossSpot)" />
    </g>

    <!-- ========== 中央大掌墊 ========== -->
    <g>
      <path d="M 60 72
               C 47 72, 41 85, 34 98
               C 28 109, 31 124, 43 127
               C 51 129, 55 123, 60 123
               C 65 123, 69 129, 77 127
               C 89 124, 92 109, 86 98
               C 79 85, 73 72, 60 72 Z" fill="url(#padSilverGrad)" stroke="#383D44" stroke-width="2.6" stroke-linejoin="round" />

      <!-- 掌墊立體明暗疊加 -->
      <path d="M 60 73.5
               C 48 73.5, 42.2 86, 35.5 98.5
               C 30 108.5, 32.8 122.2, 43.8 125
               C 51.2 126.8, 55.2 121.2, 60 121.2
               C 64.8 121.2, 68.8 126.8, 76.2 125
               C 87.2 122.2, 90 108.5, 84.5 98.5
               C 77.8 86, 72 73.5, 60 73.5 Z" fill="url(#padInnerDepth)" />

      <!-- 掌墊頂部亮銀高光光斑 -->
      <path d="M 60 76.5
               C 51.5 76.5, 47 84.5, 43.5 91.5
               C 48.5 88.5, 54 87, 60 87
               C 64 87, 67.5 87.6, 70.5 88.6
               C 68 82, 65 76.5, 60 76.5 Z" fill="url(#topSilverGlossSpot)" />

      <!-- 掌墊左側亮銀光澤反光帶 -->
      <path d="M 43 89
               C 38.5 96, 35 104, 36.5 113
               C 38 119, 41 122, 44.5 123
               C 41 118, 40 111, 41.5 103
               C 42.5 97, 45 92, 47.5 88 Z" fill="url(#leftSilverSheen)" />
    </g>
  </g>
</svg>