<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 180" width="120" height="180">
  <defs>
    <!-- 車身主體橫向漸層 -->
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58B838" />
      <stop offset="25%" stop-color="#7EE05A" />
      <stop offset="50%" stop-color="#96F272" />
      <stop offset="75%" stop-color="#7EE05A" />
      <stop offset="100%" stop-color="#4FA832" />
    </linearGradient>

    <!-- 車頂頂蓋垂直漸層 -->
    <linearGradient id="roofGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#B8FF9E" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#68CC47" stop-opacity="0.8" />
    </linearGradient>

    <!-- 車窗玻璃漸層 -->
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E262C" />
      <stop offset="30%" stop-color="#222B32" />
      <stop offset="50%" stop-color="#37434D" />
      <stop offset="80%" stop-color="#222B32" />
      <stop offset="100%" stop-color="#11161A" />
    </linearGradient>

    <!-- 吊臂金屬漸層 -->
    <linearGradient id="boomGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3D4D5C" />
      <stop offset="50%" stop-color="#6E859E" />
      <stop offset="100%" stop-color="#2C3742" />
    </linearGradient>

    <!-- 底部高斯模糊陰影 -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" />
    </filter>
  </defs>

  <!-- 底部立體陰影 -->
  <g opacity="0.35" filter="url(#shadow)">
    <rect x="30" y="20" width="60" height="140" rx="15" fill="#1A3312" />
    <polygon points="45,15 75,15 80,25 40,25" fill="#1A3312" />
  </g>

  <!-- 車輪 -->
  <g fill="#1A1E24" stroke="#0D1013" stroke-width="1">
    <!-- 前左輪 -->
    <rect x="22" y="35" width="8" height="25" rx="3" />
    <!-- 前右輪 -->
    <rect x="90" y="35" width="8" height="25" rx="3" />
    <!-- 後左輪 1 -->
    <rect x="21" y="115" width="9" height="22" rx="3" />
    <!-- 後右輪 1 -->
    <rect x="90" y="115" width="9" height="22" rx="3" />
    <!-- 後左輪 2 -->
    <rect x="21" y="142" width="9" height="22" rx="3" />
    <!-- 後右輪 2 -->
    <rect x="90" y="142" width="9" height="22" rx="3" />
  </g>

  <!-- 車身主體 -->
  <path d="M 32,30 
           C 32,22 45,18 60,18 
           C 75,18 88,22 88,30 
           L 91,165 
           C 91,172 82,175 60,175 
           C 38,175 29,172 29,165 Z" fill="url(#bodyGrad)" stroke="#3D8A24" stroke-width="1.5" />

  <!-- 引擎蓋折線與高光細節 -->
  <path d="M 38,32 Q 60,28 82,32" fill="none" stroke="#B6FF9C" stroke-width="1.5" stroke-opacity="0.7" />
  <line x1="42" y1="35" x2="42" y2="55" stroke="#47992C" stroke-width="1" stroke-opacity="0.5" />
  <line x1="78" y1="35" x2="78" y2="55" stroke="#47992C" stroke-width="1" stroke-opacity="0.5" />

  <!-- 車頭擋風玻璃 -->
  <g>
    <path d="M 34,58 L 86,58 L 84,78 L 36,78 Z" fill="url(#glassGrad)" stroke="#11161A" stroke-width="0.8" />
    <!-- 玻璃斜向反光條 -->
    <line x1="42" y1="60" x2="52" y2="76" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.15" stroke-linecap="round" />
    <line x1="47" y1="60" x2="55" y2="74" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.15" stroke-linecap="round" />
  </g>

  <!-- 駕駛艙車頂 -->
  <path d="M 36,82 L 84,82 L 83,112 L 37,112 Z" fill="url(#roofGrad)" stroke="#3D8A24" stroke-width="1" />
  <!-- 車頂高光條 -->
  <line x1="60" y1="85" x2="60" y2="108" stroke="#B8FF9E" stroke-width="2" stroke-opacity="0.8" stroke-linecap="round" />

  <!-- 側車窗 -->
  <g>
    <!-- 左側車窗 -->
    <path d="M 33,83 L 36,83 L 36,110 L 33,107 Z" fill="url(#glassGrad)" stroke="#11161A" stroke-width="0.5" />
    <!-- 右側車窗 -->
    <path d="M 87,83 L 84,83 L 84,110 L 87,107 Z" fill="url(#glassGrad)" stroke="#11161A" stroke-width="0.5" />
  </g>

  <!-- 車身中段與起重機工作平台/設備區 -->
  <rect x="33" y="115" width="54" height="55" rx="4" fill="url(#bodyGrad)" stroke="#3D8A24" stroke-width="1" />
  
  <!-- 起重機旋轉底座 (Turntable) -->
  <circle cx="60" cy="135" r="16" fill="#2C3742" stroke="#1A2229" stroke-width="2" />
  <circle cx="60" cy="135" r="10" fill="url(#boomGrad)" stroke="#4A5C6E" stroke-width="1" />

  <!-- 頂視圖吊臂 (向上延伸至車頭方向) -->
  <g>
    <!-- 吊臂主體 -->
    <rect x="56" y="25" width="8" height="115" rx="2" fill="url(#boomGrad)" stroke="#1A2229" stroke-width="1" />
    <!-- 吊臂結構線條與節點 -->
    <line x1="56" y1="40" x2="64" y2="40" stroke="#1A2229" stroke-width="1" />
    <line x1="56" y1="60" x2="64" y2="60" stroke="#1A2229" stroke-width="1" />
    <line x1="56" y1="80" x2="64" y2="80" stroke="#1A2229" stroke-width="1" />
    <line x1="56" y1="100" x2="64" y2="100" stroke="#1A2229" stroke-width="1" />
    <line x1="56" y1="120" x2="64" y2="120" stroke="#1A2229" stroke-width="1" />
    <!-- 吊臂高光反光 -->
    <line x1="58" y1="30" x2="58" y2="135" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.3" stroke-linecap="round" />
  </g>

  <!-- 車頭燈 (LED 晶鑽白光) -->
  <rect x="35" y="21" width="10" height="3" rx="1.5" fill="#E8FFDE" stroke="#3D8A24" stroke-width="0.5" />
  <rect x="75" y="21" width="10" height="3" rx="1.5" fill="#E8FFDE" stroke="#3D8A24" stroke-width="0.5" />

  <!-- 車尾燈 (警示紅光) -->
  <rect x="34" y="171" width="8" height="3" rx="1" fill="#FF4D4D" />
  <rect x="78" y="171" width="8" height="3" rx="1" fill="#FF4D4D" />
</svg>