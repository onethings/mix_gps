<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <!-- 主體多段金屬黑烤漆漸層：亮銀灰曜石光 (#5C636D) -> 深碳灰 (#2D323A) -> 極夜黑 (#15181D) -> 近乎全黑暗部 (#080A0D) -->
    <linearGradient id="metallicBlack" x1="0%" y1="15%" x2="100%" y2="85%">
      <stop offset="0%" stop-color="#5C636D" />
      <stop offset="30%" stop-color="#2D323A" />
      <stop offset="70%" stop-color="#15181D" />
      <stop offset="100%" stop-color="#080A0D" />
    </linearGradient>

    <!-- 左側斜向白金銀高光反光漸層（模擬鋼琴烤漆與玻璃鏡面光澤） -->
    <linearGradient id="blackHighlight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95" />
      <stop offset="40%" stop-color="#B0B8C4" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#080A0D" stop-opacity="0" />
    </linearGradient>

    <!-- 柔和深黑炭底部懸浮陰影與立體光暈濾鏡 -->
    <filter id="floatingShadowBlack" x="-25%" y="-25%" width="150%" height="150%">
      <!-- 柔和的外圍暗影擴散，確保在各種地圖底圖上有足夠的立體區隔 -->
      <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#000000" flood-opacity="0.35" />
      <!-- 底部主懸浮陰影 -->
      <feDropShadow dx="0" dy="9" stdDeviation="6.5" flood-color="#05070A" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- 整體套用懸浮陰影，背景 100% 透明 -->
  <g filter="url(#floatingShadowBlack)">
    
    <!-- 1. 外圓環主體 -->
    <circle cx="128" cy="124" r="96" fill="none" stroke="url(#metallicBlack)" stroke-width="11" />
    <!-- 外圓環左側鋼琴烤漆高光反光 -->
    <path d="M 60 192 A 96 96 0 0 1 196 56" fill="none" stroke="url(#blackHighlight)" stroke-width="3.5" stroke-linecap="round" />
    <!-- 外圓環右側極夜黑暗部邊緣 -->
    <path d="M 196 56 A 96 96 0 0 1 60 192" fill="none" stroke="#000000" stroke-width="1.5" stroke-opacity="0.55" />

    <!-- 2. 旗幟主體（採用 evenodd 挖空白色方格，確保背景完全透明穿透） -->
    <g transform="translate(2, -2)">
      <path fill="url(#metallicBlack)" fill-rule="evenodd" d="
        M 72 80
        C 68.5 81, 66.5 84.5, 67.5 88
        L 94 188
        C 95 191.5, 98.5 193.5, 102 192.5
        C 105.5 191.5, 107.5 188, 106.5 184.5
        L 98.5 154
        C 113 145, 128 147, 143 151
        C 158 155, 173 156, 188 147
        C 190.5 145.5, 191.8 142.5, 191 139.5
        L 175 79
        C 174 75.5, 170 74, 167 76
        C 154 84, 140 83, 126 79
        C 111 75, 95 73, 78 80
        Z

        /* 挖空方格：第1列第1格 (左上白格) */
        M 82 88
        C 91 84.5, 99 84.5, 107 86
        L 111 101
        C 103 99.5, 95 99.5, 86 103
        Z

        /* 挖空方格：第1列第3格 (中上白格) */
        M 129 90.5
        C 137 92.5, 145 93, 152 91.5
        L 156 106.5
        C 149 108, 141 107.5, 133 105.5
        Z

        /* 挖空方格：第2列第2格 (中左白格) */
        M 111 101
        C 118 102.5, 125 104, 133 105.5
        L 137 121
        C 129 119.5, 122 118, 115 116.5
        Z

        /* 挖空方格：第2列第4格 (右中白格) */
        M 156 106.5
        C 162 105, 167 102.5, 172 99
        L 176 114.5
        C 171 118, 166 120.5, 160 122
        Z

        /* 挖空方格：第3列第1格 (左下白格) */
        M 90 118.5
        C 99 115, 107 115, 115 116.5
        L 119 132
        C 111 130.5, 103 130.5, 94 134
        Z

        /* 挖空方格：第3列第3格 (中下白格) */
        M 137 121
        C 145 123, 153 123.5, 160 122
        L 164 137.5
        C 157 139, 149 138.5, 141 136.5
        Z
      " />

      <!-- 旗桿左側斜向純白金屬高光線 -->
      <path d="M 71 85 L 97.5 186" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-opacity="0.9" />
      
      <!-- 旗面上緣斜向銀白高光反光 -->
      <path d="M 78 82 C 95 75.5, 111 77.5, 126 81.5 C 140 85.5, 154 86.5, 167 78.5" fill="none" stroke="#F0F4F8" stroke-width="2.2" stroke-linecap="round" stroke-opacity="0.85" />
    </g>
  </g>
</svg>