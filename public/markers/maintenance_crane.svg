<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 180" width="120" height="180">
  <defs>
    <!-- 底部立體懸浮陰影濾鏡 -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" />
    </filter>

    <!-- 車身主體曜石黑金屬橫向漸層：深曜黑 (#121519) -> 石墨銀灰 (#525B66) -> 深曜黑 (#0D0F12) -->
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#121519" />
      <stop offset="25%" stop-color="#2E343B" />
      <stop offset="50%" stop-color="#525B66" />
      <stop offset="75%" stop-color="#2E343B" />
      <stop offset="100%" stop-color="#0D0F12" />
    </linearGradient>

    <!-- 引擎蓋與車頂左側冷銀白高光反光漸層 -->
    <linearGradient id="paintSheenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.05" />
      <stop offset="35%" stop-color="#A8B5C4" stop-opacity="0.25" />
      <stop offset="50%" stop-color="#E2EBF5" stop-opacity="0.72" />
      <stop offset="65%" stop-color="#8A96A3" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#121519" stop-opacity="0" />
    </linearGradient>

    <!-- 車頂頂蓋垂直漸層 -->
    <linearGradient id="roofGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6B7682" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#1C2026" stop-opacity="0.85" />
    </linearGradient>

    <!-- 車窗玻璃漸層 (深邃藍黑反光玻璃，與黑色車漆區隔) -->
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#090C0F" />
      <stop offset="30%" stop-color="#121921" />
      <stop offset="50%" stop-color="#24313D" />
      <stop offset="80%" stop-color="#121921" />
      <stop offset="100%" stop-color="#050708" />
    </linearGradient>

    <!-- 吊臂槍灰色金屬漸層 -->
    <linearGradient id="boomGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1A1E24" />
      <stop offset="50%" stop-color="#5E6873" />
      <stop offset="100%" stop-color="#121519" />
    </linearGradient>
  </defs>

  <!-- 底部柔和懸浮陰影 -->
  <g opacity="0.4" filter="url(#shadow)">
    <rect x="30" y="20" width="60" height="140" rx="15" fill="#050608" />
    <polygon points="45,15 75,15 80,25 40,25" fill="#050608" />
  </g>

  <!-- 車輪 -->
  <g fill="#0F1114" stroke="#38404A" stroke-width="0.8">
    <!-- 前左輪 -->
    <rect x="22" y="35" width="8" height="25" rx="3" />
    <!-- 前右輪 -->
    <rect x="90" y="35" width="8" height="25" rx="3" />
    <!-- 後左輪 1 -->
    <rect x="21" y="115" width="9" height="22" rx="3" />
    <!-- 後右輪 1 -->
    <rect x="90" y="115" width="9" height="22" rx="3" />
    <!-- 後左輪 2 -->
    <rect x="21" y="142" width="9" height="22" rx="3" />
    <!-- 後右輪 2 -->
    <rect x="90" y="142" width="9" height="22" rx="3" />
  </g>

  <!-- 車身主體 (搭配微銀灰外框線，確保深色背景下的輪廓清晰度) -->
  <path d="M 32,30 
           C 32,22 45,18 60,18 
           C 75,18 88,22 88,30 
           L 91,165 
           C 91,172 82,175 60,175 
           C 38,175 29,172 29,165 Z" fill="url(#bodyGrad)" stroke="#49525C" stroke-width="1.3" />

  <!-- 引擎蓋冷銀白高光與細節 -->
  <path d="M 32,30 C 45,18 60,18 88,30 L 91,78 L 29,78 Z" fill="url(#paintSheenGrad)" />
  <path d="M 38,32 Q 60,28 82,32" fill="none" stroke="#D8E2ED" stroke-width="1.5" stroke-opacity="0.75" />
  <line x1="42" y1="35" x2="42" y2="55" stroke="#0A0C0E" stroke-width="1.2" stroke-opacity="0.8" />
  <line x1="78" y1="35" x2="78" y2="55" stroke="#0A0C0E" stroke-width="1.2" stroke-opacity="0.8" />

  <!-- 車頭擋風玻璃 -->
  <g>
    <path d="M 34,58 L 86,58 L 84,78 L 36,78 Z" fill="url(#glassGrad)" stroke="#49525C" stroke-width="0.7" />
    <!-- 玻璃斜向反光條 -->
    <line x1="42" y1="60" x2="52" y2="76" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.22" stroke-linecap="round" />
    <line x1="47" y1="60" x2="55" y2="74" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.22" stroke-linecap="round" />
  </g>

  <!-- 駕駛艙車頂 -->
  <path d="M 36,82 L 84,82 L 83,112 L 37,112 Z" fill="url(#roofGrad)" stroke="#49525C" stroke-width="0.9" />
  <!-- 車頂左側冷銀白高光 -->
  <path d="M 36,82 L 84,82 L 83,112 L 37,112 Z" fill="url(#paintSheenGrad)" />
  <!-- 車頂高光條 -->
  <line x1="60" y1="85" x2="60" y2="108" stroke="#D8E2ED" stroke-width="2" stroke-opacity="0.75" stroke-linecap="round" />

  <!-- 側車窗 -->
  <g>
    <!-- 左側車窗 -->
    <path d="M 33,83 L 36,83 L 36,110 L 33,107 Z" fill="url(#glassGrad)" stroke="#49525C" stroke-width="0.5" />
    <!-- 右側車窗 -->
    <path d="M 87,83 L 84,83 L 84,110 L 87,107 Z" fill="url(#glassGrad)" stroke="#49525C" stroke-width="0.5" />
  </g>

  <!-- 車身中段與起重機工作平台/設備區 -->
  <rect x="33" y="115" width="54" height="55" rx="4" fill="url(#bodyGrad)" stroke="#49525C" stroke-width="1" />
  
  <!-- 起重機旋轉底座 (Turntable) -->
  <circle cx="60" cy="135" r="16" fill="#14181D" stroke="#49525C" stroke-width="1.5" />
  <circle cx="60" cy="135" r="10" fill="url(#boomGrad)" stroke="#6B7682" stroke-width="1" />

  <!-- 頂視圖吊臂 -->
  <g>
    <!-- 吊臂主體 -->
    <rect x="56" y="25" width="8" height="115" rx="2" fill="url(#boomGrad)" stroke="#49525C" stroke-width="0.9" />
    <!-- 吊臂結構線條與節點 -->
    <line x1="56" y1="40" x2="64" y2="40" stroke="#0D0F12" stroke-width="1.2" />
    <line x1="56" y1="60" x2="64" y2="60" stroke="#0D0F12" stroke-width="1.2" />
    <line x1="56" y1="80" x2="64" y2="80" stroke="#0D0F12" stroke-width="1.2" />
    <line x1="56" y1="100" x2="64" y2="100" stroke="#0D0F12" stroke-width="1.2" />
    <line x1="56" y1="120" x2="64" y2="120" stroke="#0D0F12" stroke-width="1.2" />
    <!-- 吊臂高光反光 -->
    <line x1="58" y1="30" x2="58" y2="135" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.45" stroke-linecap="round" />
  </g>

  <!-- 車頭燈 (LED 冰晶白光) -->
  <rect x="35" y="21" width="10" height="3" rx="1.5" fill="#F0F7FF" stroke="#49525C" stroke-width="0.5" />
  <rect x="75" y="21" width="10" height="3" rx="1.5" fill="#F0F7FF" stroke="#49525C" stroke-width="0.5" />

  <!-- 車尾燈 (警示紅光) -->
  <rect x="34" y="171" width="8" height="3" rx="1" fill="#FF3B3B" />
  <rect x="78" y="171" width="8" height="3" rx="1" fill="#FF3B3B" />
</svg>