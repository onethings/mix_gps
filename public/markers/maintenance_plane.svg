<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <!-- 柔和的深黑立體懸浮陰影 (背景 100% 透明) -->
    <filter id="blackHoverShadow" x="-35%" y="-35%" width="170%" height="170%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#000000" flood-opacity="0.65" />
      <feDropShadow dx="0" dy="1.5" stdDeviation="10" flood-color="#111317" flood-opacity="0.4" />
    </filter>

    <!-- 車身(機身)主體橫向漸層 (bodyGrad)：曜石黑金屬立體漸層 -->
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1F242D" />
      <stop offset="25%" stop-color="#3A4250" />
      <stop offset="50%" stop-color="#6B7280" />
      <stop offset="75%" stop-color="#3A4250" />
      <stop offset="100%" stop-color="#111317" />
    </linearGradient>

    <!-- 機身中央亮面金屬銀白烤漆脊線 -->
    <linearGradient id="fuselageCenterHighlight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1F242D" stop-opacity="0.5" />
      <stop offset="30%" stop-color="#6B7280" stop-opacity="0.85" />
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.95" />
      <stop offset="70%" stop-color="#6B7280" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#111317" stop-opacity="0.6" />
    </linearGradient>

    <!-- 左主翼金屬黑灰色漸層 -->
    <linearGradient id="leftWingBlackGrad" x1="0%" y1="0%" x2="100%" y2="60%">
      <stop offset="0%" stop-color="#555E6D" />
      <stop offset="48%" stop-color="#2D333D" />
      <stop offset="100%" stop-color="#15181F" />
    </linearGradient>

    <!-- 右主翼金屬黑灰色漸層 -->
    <linearGradient id="rightWingBlackGrad" x1="0%" y1="20%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#4A525F" />
      <stop offset="55%" stop-color="#262B33" />
      <stop offset="100%" stop-color="#111317" />
    </linearGradient>

    <!-- 引擎橫向金屬漸層 -->
    <linearGradient id="engineBlackGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1A1E26" />
      <stop offset="45%" stop-color="#555E6D" />
      <stop offset="75%" stop-color="#323842" />
      <stop offset="100%" stop-color="#0D0F12" />
    </linearGradient>

    <!-- 駕駛艙與側窗深色玻璃漸層 -->
    <linearGradient id="cockpitGlass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3A424E" />
      <stop offset="45%" stop-color="#181C23" />
      <stop offset="100%" stop-color="#0A0B0E" />
    </linearGradient>

    <!-- 左側斜向白銀高光反光漸層 -->
    <linearGradient id="blackDiagonalSheen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9" />
      <stop offset="45%" stop-color="#D1D5DB" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#6B7280" stop-opacity="0" />
    </linearGradient>

    <!-- 垂直尾翼尾燈發光漸層 -->
    <linearGradient id="tailBeacon" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1C212A" />
      <stop offset="55%" stop-color="#C92A2A" />
      <stop offset="85%" stop-color="#FF3B1F" />
      <stop offset="100%" stop-color="#FFAA70" />
    </linearGradient>
  </defs>

  <!-- 整機群組套用柔和深黑立體懸浮陰影 -->
  <g filter="url(#blackHoverShadow)">

    <!-- 1. 左右引擎 (位於主翼前緣下方) -->
    <!-- 左引擎 -->
    <g>
      <rect x="74" y="84" width="14" height="22" rx="4.5" fill="url(#engineBlackGrad)" stroke="#07090D" stroke-width="2" />
      <path d="M 76 87 Q 81 85 86 87" fill="none" stroke="#FFFFFF" stroke-width="1.3" stroke-linecap="round" opacity="0.9" />
    </g>
    <!-- 右引擎 -->
    <g>
      <rect x="152" y="84" width="14" height="22" rx="4.5" fill="url(#engineBlackGrad)" stroke="#07090D" stroke-width="2" />
      <path d="M 154 87 Q 159 85 164 87" fill="none" stroke="#FFFFFF" stroke-width="1.3" stroke-linecap="round" opacity="0.9" />
    </g>

    <!-- 2. 左右主翼 -->
    <!-- 左主翼 -->
    <path d="M 105 90 L 42 127 C 37 130 35 134 35 140 L 35 147 C 35 149 37 150 39 149 L 92 132 L 105 132 Z" fill="url(#leftWingBlackGrad)" stroke="#07090D" stroke-width="2.2" stroke-linejoin="round" />
    <!-- 左翼前緣高光與翼面折線 -->
    <path d="M 103 93 L 44 128 C 40 131 38 134 38 139" fill="none" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round" opacity="0.88" />
    <path d="M 103 124 L 84 124 L 40 142" fill="none" stroke="#0D0F13" stroke-width="1.2" opacity="0.75" />

    <!-- 右主翼 -->
    <path d="M 135 90 L 198 127 C 203 130 205 134 205 140 L 205 147 C 205 149 203 150 201 149 L 148 132 L 135 132 Z" fill="url(#rightWingBlackGrad)" stroke="#07090D" stroke-width="2.2" stroke-linejoin="round" />
    <!-- 右翼前緣高光與翼面折線 -->
    <path d="M 137 93 L 196 128 C 200 131 202 134 202 139" fill="none" stroke="#E5E7EB" stroke-width="1.4" stroke-linecap="round" opacity="0.78" />
    <path d="M 137 124 L 156 124 L 200 142" fill="none" stroke="#0D0F13" stroke-width="1.2" opacity="0.75" />

    <!-- 3. 左右水平尾翼 -->
    <!-- 左水平尾翼 -->
    <path d="M 109 175 L 78 193 C 75 195 74 197 74 200 L 74 205 C 74 207 76 208 78 207 L 111 196 Z" fill="url(#leftWingBlackGrad)" stroke="#07090D" stroke-width="2.2" stroke-linejoin="round" />
    <path d="M 108 178 L 80 194" fill="none" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" opacity="0.85" />

    <!-- 右水平尾翼 -->
    <path d="M 131 175 L 162 193 C 165 195 166 197 166 200 L 166 205 C 166 207 164 208 162 207 L 129 196 Z" fill="url(#rightWingBlackGrad)" stroke="#07090D" stroke-width="2.2" stroke-linejoin="round" />
    <path d="M 132 178 L 160 194" fill="none" stroke="#E5E7EB" stroke-width="1.1" stroke-linecap="round" opacity="0.72" />

    <!-- 4. 機身主體 (套用 bodyGrad 與 #07090D 深黑金屬外框) -->
    <path d="M 120 20
             C 132 20 137 42 137 64
             L 137 156
             C 137 182 127 206 120 206
             C 113 206 103 182 103 156
             L 103 64
             C 103 42 108 20 120 20 Z" fill="url(#bodyGrad)" stroke="#07090D" stroke-width="2.4" />

    <!-- 機身中央亮面金屬烤漆脊線 -->
    <path d="M 120 24
             C 129 24 133 44 133 65
             L 133 155
             C 133 178 125 201 120 201
             C 115 201 107 178 107 155
             L 107 65
             C 107 44 111 24 120 24 Z" fill="url(#fuselageCenterHighlight)" />

    <!-- 機頭(引擎蓋區)與機頂中央/左側高光反光條 -->
    <!-- 機鼻高光 -->
    <path d="M 111 35 C 113 26 117 23 120 23 C 123 23 126 26 128 33 C 123 30 116 31 111 35 Z" fill="#FFFFFF" opacity="0.85" />
    <!-- 機頂中央與左側斜向高光反光帶 -->
    <path d="M 110 62 L 122 52 L 122 142 L 110 154 Z" fill="url(#blackDiagonalSheen)" />
    <path d="M 106 58 C 106 43 110 29 116 25" fill="none" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round" opacity="0.9" />

    <!-- 5. 駕駛艙擋風玻璃與斜向白色高光條 -->
    <path d="M 107 57
             C 107 46 113 40 120 40
             C 127 40 133 46 133 57
             C 133 60 130 61 128 59
             C 125 56 122 55 120 55
             C 118 55 115 56 112 59
             C 110 61 107 60 107 57 Z" fill="url(#cockpitGlass)" stroke="#07090D" stroke-width="1.2" />
    <!-- 玻璃窗框分割線與斜向白色反光 -->
    <path d="M 120 40 L 120 55 M 113 43 L 115 56 M 127 43 L 125 56" stroke="#1F242D" stroke-width="1.1" opacity="0.85" />
    <polygon points="113,44 116,42 114,54 111,55" fill="#FFFFFF" opacity="0.5" />
    <polygon points="117,42 119,41 117,54 115,54" fill="#FFFFFF" opacity="0.3" />

    <!-- 6. 機身兩側長條客艙側窗 (深色玻璃與反光條) -->
    <!-- 左側舷窗條 -->
    <rect x="106.5" y="70" width="2.8" height="68" rx="1.4" fill="url(#cockpitGlass)" />
    <line x1="107.9" y1="88" x2="107.9" y2="95" stroke="#9CA3AF" stroke-width="1.2" stroke-linecap="round" />
    <line x1="107.9" y1="101" x2="107.9" y2="108" stroke="#9CA3AF" stroke-width="1.2" stroke-linecap="round" />

    <!-- 右側舷窗條 -->
    <rect x="130.7" y="70" width="2.8" height="68" rx="1.4" fill="url(#cockpitGlass)" />
    <line x1="132.1" y1="88" x2="132.1" y2="95" stroke="#9CA3AF" stroke-width="1.2" stroke-linecap="round" />
    <line x1="132.1" y1="101" x2="132.1" y2="108" stroke="#9CA3AF" stroke-width="1.2" stroke-linecap="round" />

    <!-- 7. 垂直尾翼與尾部航行燈 -->
    <path d="M 120 158
             C 122 158 123 176 122.2 198
             C 121.8 202 120.8 204 120 204
             C 119.2 204 118.2 202 117.8 198
             C 117 176 118 158 120 158 Z" fill="url(#tailBeacon)" stroke="#07090D" stroke-width="1.3" />
    <!-- 尾端亮紅光點 -->
    <ellipse cx="120" cy="197" rx="1.3" ry="4.5" fill="#FF6B4A" opacity="0.95" />

  </g>
</svg>