<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 180" width="120" height="180">
  <defs>
    <!-- 1. 停車狀態暗紅色擴散光暈 + 底部懸浮陰影 (背景 100% 透明) -->
    <filter id="parkedRedGlow" x="-40%" y="-40%" width="180%" height="180%">
      <!-- 柔和暗紅色停車狀態外光暈 -->
      <feDropShadow dx="0" dy="0" stdDeviation="6.5" flood-color="#9E1414" flood-opacity="0.58" />
      <feDropShadow dx="0" dy="0" stdDeviation="2.5" flood-color="#C92222" flood-opacity="0.38" />
      <!-- 底部貼地立體陰影 -->
      <feDropShadow dx="0" dy="4" stdDeviation="3.5" flood-color="#2B0505" flood-opacity="0.45" />
    </filter>

    <!-- 2. 車身主體金屬烤漆漸層 (深酒紅 #7D1111 到亮寶石紅 #E33939) -->
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7D1111" />
      <stop offset="22%" stop-color="#B82323" />
      <stop offset="48%" stop-color="#E33939" />
      <stop offset="56%" stop-color="#F25252" />
      <stop offset="78%" stop-color="#B52020" />
      <stop offset="100%" stop-color="#6E0D0D" />
    </linearGradient>

    <!-- 3. 車頂頂蓋金屬烤漆漸層 (上下垂直立體明暗) -->
    <linearGradient id="roofGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#EB4646" stop-opacity="0.96" />
      <stop offset="45%" stop-color="#CC2929" stop-opacity="0.94" />
      <stop offset="100%" stop-color="#851313" stop-opacity="0.92" />
    </linearGradient>

    <!-- 4. 左側金屬漆面斜向高光反光漸層 -->
    <linearGradient id="leftPaintSheen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.42" />
      <stop offset="45%" stop-color="#FF9E9E" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.0" />
    </linearGradient>

    <!-- 5. 車窗玻璃漸層 -->
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E262C" />
      <stop offset="35%" stop-color="#37434D" />
      <stop offset="70%" stop-color="#222B32" />
      <stop offset="100%" stop-color="#11161A" />
    </linearGradient>

    <!-- 6. 引擎蓋與車頂裁剪路徑 (確保高光精準貼合曲面) -->
    <clipPath id="hoodClip">
      <path d="M 38 18 Q 60 12 82 18 L 87 44 Q 60 40 33 44 Z" />
    </clipPath>
    <clipPath id="roofClip">
      <rect x="36" y="65" width="48" height="90" rx="10" />
    </clipPath>
  </defs>

  <!-- 整體車輛群組 (中心對齊 60, 90) -->
  <g filter="url(#parkedRedGlow)">
    <!-- 左右後視鏡 -->
    <path d="M 31 50 L 21 53 C 19.5 53.5 19.5 57.5 21.5 58 L 31 57 Z" fill="#9E1818" stroke="#520909" stroke-width="1.2" />
    <path d="M 89 50 L 99 53 C 100.5 53.5 100.5 57.5 98.5 58 L 89 57 Z" fill="#851313" stroke="#520909" stroke-width="1.2" />

    <!-- 車身主體外殼 (露營車流線輪廓) -->
    <path d="M 41 14
             Q 60 10 79 14
             C 86 15.5 89 22 90 34
             L 91 150
             C 91 159 86 164 78 165
             Q 60 167 42 165
             C 34 164 29 159 29 150
             L 30 34
             C 31 22 34 15.5 41 14 Z" fill="url(#bodyGrad)" stroke="#520909" stroke-width="1.6" />

    <!-- 車身側邊微幅輪拱線條與側滑門接縫 -->
    <path d="M 32 45 L 32 148" stroke="#520909" stroke-width="0.8" stroke-opacity="0.45" fill="none" />
    <path d="M 88 45 L 88 148" stroke="#520909" stroke-width="0.8" stroke-opacity="0.45" fill="none" />
    <line x1="87.5" y1="68" x2="90.5" y2="68" stroke="#520909" stroke-width="0.9" stroke-opacity="0.6" />
    <line x1="87.5" y1="115" x2="90.5" y2="115" stroke="#520909" stroke-width="0.9" stroke-opacity="0.6" />

    <!-- 引擎蓋左側斜向金屬烤漆高光反光帶 -->
    <g clip-path="url(#hoodClip)">
      <polygon points="28,14 55,14 43,46 24,46" fill="url(#leftPaintSheen)" />
      <polygon points="48,14 54,14 44,46 39,46" fill="#FFFFFF" fill-opacity="0.22" />
    </g>

    <!-- 引擎蓋立體折線與兩側壓線 -->
    <path d="M 42 20 L 45 41" stroke="#FF9E9E" stroke-width="1.2" stroke-opacity="0.65" stroke-linecap="round" />
    <path d="M 78 20 L 75 41" stroke="#5C0B0B" stroke-width="1.2" stroke-opacity="0.55" stroke-linecap="round" />
    <path d="M 37 23 L 39 40" stroke="#5C0B0B" stroke-width="0.9" stroke-opacity="0.45" stroke-linecap="round" />
    <path d="M 83 23 L 81 40" stroke="#5C0B0B" stroke-width="0.9" stroke-opacity="0.45" stroke-linecap="round" />

    <!-- 前擋風玻璃 (大面積弧形全景玻璃) -->
    <path d="M 35 44
             Q 60 39 85 44
             L 83 61
             Q 60 57 37 61 Z" fill="url(#glassGrad)" stroke="#161C20" stroke-width="1.1" />
    <!-- 前擋風玻璃斜向反光條 -->
    <polygon points="40,44 51,43 44,59 37,60" fill="#FFFFFF" fill-opacity="0.16" />
    <polygon points="55,42.5 59,42.2 52,58.5 49,58.8" fill="#FFFFFF" fill-opacity="0.10" />
    <!-- 雨刷細節 -->
    <path d="M 41 59.5 L 56 57.5" stroke="#0D1114" stroke-width="1.2" stroke-linecap="round" />
    <path d="M 62 58.5 L 77 57.2" stroke="#0D1114" stroke-width="1.2" stroke-linecap="round" />

    <!-- 左右前側三角窗 -->
    <path d="M 32 48 L 35 62 L 32 72 Z" fill="url(#glassGrad)" />
    <path d="M 88 48 L 85 62 L 88 72 Z" fill="url(#glassGrad)" />

    <!-- 露營車加高掀頂車頂殼體 (Pop-Top Roof) -->
    <rect x="36" y="65" width="48" height="90" rx="10" fill="url(#roofGrad)" stroke="#5E0B0B" stroke-width="1.2" />

    <!-- 車頂左側斜向金屬漆面高光條 (重現金屬烤漆光澤) -->
    <g clip-path="url(#roofClip)">
      <polygon points="34,63 56,63 44,157 32,157" fill="url(#leftPaintSheen)" />
      <polygon points="43,63 48,63 39,157 35,157" fill="#FFFFFF" fill-opacity="0.20" />
    </g>

    <!-- 車頂導流強化肋條 -->
    <line x1="46" y1="69" x2="46" y2="151" stroke="#FF8A8A" stroke-width="1" stroke-opacity="0.45" stroke-linecap="round" />
    <line x1="74" y1="69" x2="74" y2="151" stroke="#520909" stroke-width="1" stroke-opacity="0.45" stroke-linecap="round" />

    <!-- 車頂前段全景天窗 (Skylight Hatch) -->
    <rect x="47" y="74" width="26" height="18" rx="4" fill="url(#glassGrad)" stroke="#3D0707" stroke-width="1" />
    <polygon points="49,75 58,75 52,91 48,91" fill="#FFFFFF" fill-opacity="0.16" />

    <!-- 車頂中段駐冷空調外機 (Roof AC Unit) -->
    <rect x="48" y="99" width="24" height="20" rx="4" fill="#9C1919" stroke="#4F0808" stroke-width="1" />
    <rect x="51" y="102" width="18" height="14" rx="2" fill="#B82525" />
    <line x1="53" y1="106" x2="67" y2="106" stroke="#4F0808" stroke-width="1" />
    <line x1="53" y1="109" x2="67" y2="109" stroke="#4F0808" stroke-width="1" />
    <line x1="53" y1="112" x2="67" y2="112" stroke="#4F0808" stroke-width="1" />

    <!-- 車頂後段太陽能板模組 -->
    <rect x="46" y="125" width="28" height="22" rx="2.5" fill="#1B2228" stroke="#4A0808" stroke-width="1" />
    <line x1="55.3" y1="125" x2="55.3" y2="147" stroke="#364450" stroke-width="0.7" />
    <line x1="64.6" y1="125" x2="64.6" y2="147" stroke="#364450" stroke-width="0.7" />
    <line x1="46" y1="132.3" x2="74" y2="132.3" stroke="#364450" stroke-width="0.7" />
    <line x1="46" y1="139.6" x2="74" y2="139.6" stroke="#364450" stroke-width="0.7" />
    <polygon points="47,126 57,126 50,146 47,146" fill="#FFFFFF" fill-opacity="0.12" />

    <!-- 右側車邊帳收納盒 (Side Awning Cassette) -->
    <rect x="85.5" y="64" width="3.5" height="88" rx="1.5" fill="#4A0909" stroke="#2E0404" stroke-width="0.7" />
    <line x1="86.7" y1="66" x2="86.7" y2="150" stroke="#C93232" stroke-width="0.6" stroke-opacity="0.6" />

    <!-- 後擋風玻璃 -->
    <path d="M 38 157 Q 60 159 82 157 L 80 162 Q 60 164 40 162 Z" fill="url(#glassGrad)" stroke="#161C20" stroke-width="0.9" />
    <polygon points="43,157.5 51,158 48,162.5 41,162" fill="#FFFFFF" fill-opacity="0.16" />

    <!-- 車頭 LED 晶鑽大燈 -->
    <path d="M 34 19 C 36 16.5 41 15.5 44 16.5 L 41 21 C 38 21 35 20.5 34 19 Z" fill="#FFF4E8" stroke="#FFFFFF" stroke-width="0.5" />
    <path d="M 86 19 C 84 16.5 79 15.5 76 16.5 L 79 21 C 82 21 85 20.5 86 19 Z" fill="#FFF4E8" stroke="#FFFFFF" stroke-width="0.5" />

    <!-- 車尾燈與第三煞車燈 -->
    <path d="M 33 161.5 C 35 163.5 39 164.5 43 164.5 L 42 162 C 38 162 35 161.5 33 161.5 Z" fill="#FF4D4D" />
    <path d="M 87 161.5 C 85 163.5 81 164.5 77 164.5 L 78 162 C 82 162 85 161.5 87 161.5 Z" fill="#FF4D4D" />
    <rect x="54" y="155.2" width="12" height="1.6" rx="0.8" fill="#FF4D4D" />
  </g>
</svg>