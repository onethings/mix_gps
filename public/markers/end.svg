<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="pinGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2493D" />
      <stop offset="100%" stop-color="#C41E16" />
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#8A110B" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- 地面擴散雙環 -->
  <circle cx="60" cy="60" r="50" fill="none" stroke="#E83A30" stroke-width="1.5" stroke-opacity="0.25" />
  <circle cx="60" cy="60" r="39" fill="#E83A30" fill-opacity="0.1" />

  <!-- 主體：旋轉45度的圓角方盾（俯視塔頂意象） -->
  <rect x="36" y="36" width="48" height="48" rx="14" transform="rotate(45 60 60)" fill="url(#pinGrad2)" filter="url(#softShadow)" />

  <!-- 內部同心鏤空環（呼應原圖白洞） -->
  <circle cx="60" cy="60" r="14" fill="none" stroke="#FFFFFF" stroke-width="4.5" />
  
  <!-- 中心實心紅點 -->
  <circle cx="60" cy="60" r="5" fill="#FFFFFF" />
</svg>