<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <defs>
    <!-- 柔和深曜石黑與冷金屬光暈懸浮陰影濾鏡（確保淺色/白色地圖高辨識度，背景 100% 透明） -->
    <filter id="metallicBlackGlowShadow" x="-30%" y="-30%" width="160%" height="165%">
      <!-- 底部柔和深曜石黑懸浮陰影 -->
      <feGaussianBlur in="SourceAlpha" stdDeviation="7.5" result="blurShadow" />
      <feOffset in="blurShadow" dx="0" dy="6.5" result="offsetShadow" />
      <feFlood flood-color="#050608" flood-opacity="0.6" result="colorShadow" />
      <feComposite in="colorShadow" in2="offsetShadow" operator="in" result="deepObsidianShadow" />

      <!-- 周圍微凝聚槍灰色 (#687282) 邊緣暈光（防止在白色地圖上邊緣融化） -->
      <feGaussianBlur in="SourceAlpha" stdDeviation="2.5" result="blurRim" />
      <feFlood flood-color="#687282" flood-opacity="0.45" result="colorRim" />
      <feComposite in="colorRim" in2="blurRim" operator="in" result="softGunmetalRim" />

      <feMerge>
        <feMergeNode in="deepObsidianShadow" />
        <feMergeNode in="softGunmetalRim" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- 橫向金屬烤漆黑／槍灰主漸層（亮鉑金灰 #E8ECEF -> 槍金屬灰 #8A93A0 -> 深碳黑 #363D47 -> 曜石黑 #12151B -> 極黑 #05070A） -->
    <linearGradient id="metallicBlackMainGrad" x1="0%" y1="30%" x2="100%" y2="70%">
      <stop offset="0%" stop-color="#E8ECEF" />
      <stop offset="22%" stop-color="#A2ABBA" />
      <stop offset="50%" stop-color="#5B6370" />
      <stop offset="78%" stop-color="#1E232B" />
      <stop offset="100%" stop-color="#07090D" />
    </linearGradient>

    <!-- 外環立體陽極氧化槍灰色金屬漸層 -->
    <linearGradient id="ringMetallicBlackGrad" x1="0%" y1="15%" x2="100%" y2="85%">
      <stop offset="0%" stop-color="#D5DCF0" />
      <stop offset="26%" stop-color="#8A93A0" />
      <stop offset="58%" stop-color="#2E3440" />
      <stop offset="82%" stop-color="#11141A" />
      <stop offset="100%" stop-color="#4C566A" />
    </linearGradient>

    <!-- 深碳黑與純黑高對比外框線（確保純白與淺灰地圖清晰辨識） -->
    <linearGradient id="darkObsidianOutlineGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B4252" />
      <stop offset="50%" stop-color="#1E222B" />
      <stop offset="100%" stop-color="#05070A" />
    </linearGradient>

    <!-- 內側鉑金銀灰金屬倒角高光線 -->
    <linearGradient id="blackInnerBevelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.98" />
      <stop offset="35%" stop-color="#D8DEE9" stop-opacity="0.9" />
      <stop offset="72%" stop-color="#4C566A" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#E5E9F0" stop-opacity="0.9" />
    </linearGradient>

    <!-- 左側斜向鉑金白鏡面高光反光漸層 -->
    <linearGradient id="blackSpecularGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.8" />
      <stop offset="38%" stop-color="#D8DEE9" stop-opacity="0.4" />
      <stop offset="75%" stop-color="#8A93A0" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#07090D" stop-opacity="0" />
    </linearGradient>

    <!-- 旗面（含中空五角星）的複合路徑與裁切 -->
    <mask id="flagStarMask">
      <rect x="0" y="0" width="300" height="300" fill="white" />
      <!-- 中央鏤空五角星（保持地圖底圖 100% 透明穿透） -->
      <polygon points="154,107 162.5,124.2 181.5,127 167.8,140.4 171,159.3 154,150.4 137,159.3 140.2,140.4 126.5,127 145.5,124.2" fill="black" />
    </mask>

    <clipPath id="flagBodyClip">
      <path d="M 85 95 C 115 74, 152 80, 178 86 C 194 89, 205 83, 212 76 L 226 164 C 216 173, 202 178, 185 174 C 158 168, 125 166, 102 184 L 85 95 Z" />
    </clipPath>

    <clipPath id="ringClip">
      <path fill-rule="evenodd" d="M 150 28 A 122 122 0 1 0 150 272 A 122 122 0 1 0 150 28 Z M 150 40 A 110 110 0 1 1 150 260 A 110 110 0 1 1 150 40 Z" />
    </clipPath>
  </defs>

  <!-- 整體套用柔和深曜石黑懸浮陰影與槍灰微暈 -->
  <g filter="url(#metallicBlackGlowShadow)">

    <!-- 1. 外圍精密幾何曜石黑金屬圓環 -->
    <g>
      <!-- 圓環立體極黑陰影底座 -->
      <circle cx="151" cy="152.5" r="116" fill="none" stroke="#030406" stroke-width="12.5" opacity="0.85" />
      <!-- 圓環主體陽極氧化槍灰色漸層 -->
      <circle cx="150" cy="150" r="116" fill="none" stroke="url(#ringMetallicBlackGrad)" stroke-width="11" />
      <!-- 圓環左側及上半部鉑金白斜向鏡面高光 -->
      <g clip-path="url(#ringClip)">
        <path d="M 20 155 Q 135 100 265 65 L 265 15 L 20 15 Z" fill="url(#blackSpecularGrad)" />
      </g>
      <!-- 圓環內側鉑金銀倒角高光線 -->
      <circle cx="150" cy="150" r="120.2" fill="none" stroke="url(#blackInnerBevelGrad)" stroke-width="1.2" />
      <circle cx="150" cy="150" r="111.5" fill="none" stroke="url(#blackInnerBevelGrad)" stroke-width="1.1" />
      <!-- 圓環最外緣與最內緣深碳黑外框線（確保淺色/白色地圖清晰辨識） -->
      <circle cx="150" cy="150" r="121.6" fill="none" stroke="url(#darkObsidianOutlineGrad)" stroke-width="1.5" />
      <circle cx="150" cy="150" r="110.4" fill="none" stroke="url(#darkObsidianOutlineGrad)" stroke-width="1.4" />
    </g>

    <!-- 2. 精密幾何曜石黑星形旗幟與旗桿 -->
    <g>
      <!-- 旗幟與旗桿立體厚度暗碳黑陰影層 -->
      <g transform="translate(2, 2.8)" mask="url(#flagStarMask)">
        <path d="M 79 94 C 78.2 89, 85.8 87.8, 86.8 92.8 L 87.2 94.5 C 116 74, 152 80, 178 86 C 194 89, 205 83, 212 76 L 226 164 C 216 173, 202 178, 185 174 C 158 168, 125 166, 102 184 L 109.5 227 C 110.3 232, 102.7 233.3, 101.8 228.3 L 79 94 Z" fill="#0E1116" />
      </g>

      <!-- 旗幟與旗桿主體（套用五角星透明遮罩） -->
      <g mask="url(#flagStarMask)">
        <!-- 旗桿 + 旗面主金屬黑／槍灰橫向漸層 -->
        <path d="M 79 94 C 78.2 89, 85.8 87.8, 86.8 92.8 L 87.2 94.5 C 116 74, 152 80, 178 86 C 194 89, 205 83, 212 76 L 226 164 C 216 173, 202 178, 185 174 C 158 168, 125 166, 102 184 L 109.5 227 C 110.3 232, 102.7 233.3, 101.8 228.3 L 79 94 Z" fill="url(#metallicBlackMainGrad)" />

        <!-- 旗面左側斜向鉑金白烤漆高光反光帶 -->
        <g clip-path="url(#flagBodyClip)">
          <polygon points="72,68 158,68 118,195 65,195" fill="url(#blackSpecularGrad)" />
          <path d="M 75 70 L 225 65 L 228 106 Q 145 118 88 142 Z" fill="url(#blackSpecularGrad)" opacity="0.75" />
        </g>

        <!-- 旗桿左側純白圓柱高光反光線 -->
        <line x1="82.5" y1="93" x2="104.5" y2="226" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.9" />
      </g>

      <!-- 旗幟內層鉑金銀倒角高光描邊 -->
      <path d="M 79 94 C 78.2 89, 85.8 87.8, 86.8 92.8 L 87.2 94.5 C 116 74, 152 80, 178 86 C 194 89, 205 83, 212 76 L 226 164 C 216 173, 202 178, 185 174 C 158 168, 125 166, 102 184 L 109.5 227 C 110.3 232, 102.7 233.3, 101.8 228.3 L 79 94 Z" fill="none" stroke="url(#blackInnerBevelGrad)" stroke-width="2.1" stroke-linejoin="round" />

      <!-- 旗幟最外緣深碳黑外框線 -->
      <path d="M 79 94 C 78.2 89, 85.8 87.8, 86.8 92.8 L 87.2 94.5 C 116 74, 152 80, 178 86 C 194 89, 205 83, 212 76 L 226 164 C 216 173, 202 178, 185 174 C 158 168, 125 166, 102 184 L 109.5 227 C 110.3 232, 102.7 233.3, 101.8 228.3 L 79 94 Z" fill="none" stroke="url(#darkObsidianOutlineGrad)" stroke-width="1.3" stroke-linejoin="round" />

      <!-- 中央鏤空五角星鉑金銀倒角與深碳黑雙層描邊 -->
      <polygon points="154,107 162.5,124.2 181.5,127 167.8,140.4 171,159.3 154,150.4 137,159.3 140.2,140.4 126.5,127 145.5,124.2" fill="none" stroke="url(#blackInnerBevelGrad)" stroke-width="2.2" stroke-linejoin="round" />
      <polygon points="154,107 162.5,124.2 181.5,127 167.8,140.4 171,159.3 154,150.4 137,159.3 140.2,140.4 126.5,127 145.5,124.2" fill="none" stroke="url(#darkObsidianOutlineGrad)" stroke-width="1.2" stroke-linejoin="round" />
    </g>

  </g>
</svg>