<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <!-- 金屬烤漆光澤：深酒紅 (#7D1111) 到 亮寶石紅 (#E33939) 多段漸層 -->
    <linearGradient id="metallicRedBody" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#E33939" />
      <stop offset="28%" stop-color="#B81D1D" />
      <stop offset="55%" stop-color="#E33939" />
      <stop offset="82%" stop-color="#961414" />
      <stop offset="100%" stop-color="#7D1111" />
    </linearGradient>

    <!-- 外輪廓深色金屬陰影漸層 -->
    <linearGradient id="metallicRedRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C92828" />
      <stop offset="50%" stop-color="#8C1313" />
      <stop offset="100%" stop-color="#5E0B0B" />
    </linearGradient>

    <!-- 左側斜向高光反光漸層 -->
    <linearGradient id="leftDiagonalSheen" x1="0%" y1="10%" x2="85%" y2="80%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.68" />
      <stop offset="35%" stop-color="#FF9E9E" stop-opacity="0.30" />
      <stop offset="65%" stop-color="#FFFFFF" stop-opacity="0.0" />
    </linearGradient>

    <!-- 停車狀態光暈：暗紅色柔和擴散光暈 (背景 100% 透明) -->
    <filter id="parkedRedGlow" x="-45%" y="-45%" width="190%" height="190%">
      <feDropShadow dx="0" dy="0" stdDeviation="6.5" flood-color="#8F0E0E" flood-opacity="0.72" />
      <feDropShadow dx="0" dy="0" stdDeviation="2.5" flood-color="#B81414" flood-opacity="0.85" />
    </filter>

    <!-- 左鞋前掌與鞋跟裁切路徑 -->
    <clipPath id="leftSoleClip">
      <path d="M 38 30 C 47 30, 52 40, 50 53 C 49 60, 46 64, 46 68 L 31 68 C 31 64, 28 59, 27 51 C 25 39, 30 30, 38 30 Z" />
    </clipPath>
    <clipPath id="leftHeelClip">
      <path d="M 31 73 L 46 73 L 46 84 C 46 90, 43 94, 38.5 94 C 34 94, 31 90, 31 84 Z" />
    </clipPath>

    <!-- 右鞋前掌與鞋跟裁切路徑 -->
    <clipPath id="rightSoleClip">
      <path d="M 82 18 C 90 18, 95 27, 93 39 C 92 47, 89 52, 89 56 L 74 56 C 74 52, 71 48, 70 41 C 68 28, 73 18, 82 18 Z" />
    </clipPath>
    <clipPath id="rightHeelClip">
      <path d="M 74 61 L 89 61 L 89 72 C 89 78, 86 82, 81.5 82 C 77 82, 74 78, 74 72 Z" />
    </clipPath>
  </defs>

  <!-- 雙鞋印主體 -->
  <g filter="url(#parkedRedGlow)">
    <!-- 左鞋前掌 -->
    <path d="M 38 30 C 47 30, 52 40, 50 53 C 49 60, 46 64, 46 68 L 31 68 C 31 64, 28 59, 27 51 C 25 39, 30 30, 38 30 Z" fill="url(#metallicRedBody)" stroke="url(#metallicRedRim)" stroke-width="1.6" />
    <!-- 左鞋跟 -->
    <path d="M 31 73 L 46 73 L 46 84 C 46 90, 43 94, 38.5 94 C 34 94, 31 90, 31 84 Z" fill="url(#metallicRedBody)" stroke="url(#metallicRedRim)" stroke-width="1.6" />

    <!-- 左鞋左側斜向金屬高光 -->
    <g clip-path="url(#leftSoleClip)">
      <polygon points="22,28 43,28 32,70 18,70" fill="url(#leftDiagonalSheen)" />
      <path d="M 31 37 C 29 44, 29 51, 31 58" fill="none" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round" stroke-opacity="0.58" />
    </g>
    <g clip-path="url(#leftHeelClip)">
      <polygon points="26,72 40,72 34,96 24,96" fill="url(#leftDiagonalSheen)" />
    </g>

    <!-- 右鞋前掌 -->
    <path d="M 82 18 C 90 18, 95 27, 93 39 C 92 47, 89 52, 89 56 L 74 56 C 74 52, 71 48, 70 41 C 68 28, 73 18, 82 18 Z" fill="url(#metallicRedBody)" stroke="url(#metallicRedRim)" stroke-width="1.6" />
    <!-- 右鞋跟 -->
    <path d="M 74 61 L 89 61 L 89 72 C 89 78, 86 82, 81.5 82 C 77 82, 74 78, 74 72 Z" fill="url(#metallicRedBody)" stroke="url(#metallicRedRim)" stroke-width="1.6" />

    <!-- 右鞋左側斜向金屬高光 -->
    <g clip-path="url(#rightSoleClip)">
      <polygon points="65,16 86,16 75,58 61,58" fill="url(#leftDiagonalSheen)" />
      <path d="M 74 25 C 72 32, 72 39, 74 46" fill="none" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round" stroke-opacity="0.58" />
    </g>
    <g clip-path="url(#rightHeelClip)">
      <polygon points="69,60 83,60 77,84 67,84" fill="url(#leftDiagonalSheen)" />
    </g>
  </g>
</svg>