<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <defs>
    <!-- 柔和深灰色底部懸浮陰影與外輪廓強化濾鏡（確保淺色/白色地圖高辨識度） -->
    <filter id="metallicSilverShadow" x="-30%" y="-30%" width="160%" height="165%">
      <!-- 底部柔和懸浮大陰影 -->
      <feGaussianBlur in="SourceAlpha" stdDeviation="7.5" result="blurShadow" />
      <feOffset in="blurShadow" dx="0" dy="6.5" result="offsetShadow" />
      <feFlood flood-color="#22262B" flood-opacity="0.48" result="colorShadow" />
      <feComposite in="colorShadow" in2="offsetShadow" operator="in" result="deepGrayShadow" />

      <!-- 周圍微凝聚深鐵灰邊緣暈光（防止在白色地圖上邊緣融化） -->
      <feGaussianBlur in="SourceAlpha" stdDeviation="2.2" result="blurRim" />
      <feFlood flood-color="#363B42" flood-opacity="0.52" result="colorRim" />
      <feComposite in="colorRim" in2="blurRim" operator="in" result="softCharcoalRim" />

      <feMerge>
        <feMergeNode in="deepGrayShadow" />
        <feMergeNode in="softCharcoalRim" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- 橫向金屬銀主漸層（亮銀白 #E4E8ED 至 冷鐵灰 #7D838B） -->
    <linearGradient id="metallicSilverGrad" x1="0%" y1="35%" x2="100%" y2="65%">
      <stop offset="0%" stop-color="#F2F5F8" />
      <stop offset="22%" stop-color="#E4E8ED" />
      <stop offset="52%" stop-color="#B0B6BE" />
      <stop offset="80%" stop-color="#7D838B" />
      <stop offset="100%" stop-color="#5B6068" />
    </linearGradient>

    <!-- 外環立體橫向金屬銀漸層 -->
    <linearGradient id="ringSilverGrad" x1="0%" y1="20%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#EEF1F5" />
      <stop offset="28%" stop-color="#E4E8ED" />
      <stop offset="65%" stop-color="#7D838B" />
      <stop offset="100%" stop-color="#565B63" />
    </linearGradient>

    <!-- 深灰色外框線（確保白色與淺灰地圖背景下的高對比輪廓） -->
    <linearGradient id="darkGrayOutlineGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4A5058" />
      <stop offset="50%" stop-color="#383D44" />
      <stop offset="100%" stop-color="#262A30" />
    </linearGradient>

    <!-- 內側亮銀金屬倒角高光線 -->
    <linearGradient id="silverInnerBevelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95" />
      <stop offset="40%" stop-color="#E4E8ED" stop-opacity="0.7" />
      <stop offset="80%" stop-color="#686E76" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#CFD5DC" stop-opacity="0.8" />
    </linearGradient>

    <!-- 左側亮銀白斜向鏡面高光反光漸層 -->
    <linearGradient id="silverSpecularGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.72" />
      <stop offset="40%" stop-color="#F5F7FA" stop-opacity="0.38" />
      <stop offset="80%" stop-color="#E4E8ED" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#7D838B" stop-opacity="0" />
    </linearGradient>

    <!-- 旗面（含中空五角星）的複合路徑與裁切 -->
    <mask id="flagStarMask">
      <rect x="0" y="0" width="300" height="300" fill="white" />
      <!-- 中央鏤空五角星（保持地圖底圖 100% 透明穿透） -->
      <polygon points="154,107 162.5,124.2 181.5,127 167.8,140.4 171,159.3 154,150.4 137,159.3 140.2,140.4 126.5,127 145.5,124.2" fill="black" />
    </mask>

    <clipPath id="flagBodyClip">
      <path d="M 85 95 C 115 74, 152 80, 178 86 C 194 89, 205 83, 212 76 L 226 164 C 216 173, 202 178, 185 174 C 158 168, 125 166, 102 184 L 85 95 Z" />
    </clipPath>

    <clipPath id="ringClip">
      <path fill-rule="evenodd" d="M 150 28 A 122 122 0 1 0 150 272 A 122 122 0 1 0 150 28 Z M 150 40 A 110 110 0 1 1 150 260 A 110 110 0 1 1 150 40 Z" />
    </clipPath>
  </defs>

  <!-- 整體套用柔和深灰色底部懸浮陰影與輪廓強化 -->
  <g filter="url(#metallicSilverShadow)">

    <!-- 1. 外圍精密幾何金屬銀圓環 -->
    <g>
      <!-- 圓環立體深鐵灰陰影底座 -->
      <circle cx="151" cy="152.5" r="116" fill="none" stroke="#2D3138" stroke-width="12.5" opacity="0.8" />
      <!-- 圓環主體亮銀白至冷鐵灰橫向漸層 -->
      <circle cx="150" cy="150" r="116" fill="none" stroke="url(#ringSilverGrad)" stroke-width="11" />
      <!-- 圓環左側及上半部亮銀斜向鏡面高光 -->
      <g clip-path="url(#ringClip)">
        <path d="M 20 155 Q 135 100 265 65 L 265 15 L 20 15 Z" fill="url(#silverSpecularGrad)" />
      </g>
      <!-- 圓環內側亮銀倒角高光線 -->
      <circle cx="150" cy="150" r="120.2" fill="none" stroke="url(#silverInnerBevelGrad)" stroke-width="1.2" />
      <circle cx="150" cy="150" r="111.5" fill="none" stroke="url(#silverInnerBevelGrad)" stroke-width="1.1" />
      <!-- 圓環最外緣與最內緣深灰色外框線（確保白底清晰辨識） -->
      <circle cx="150" cy="150" r="121.6" fill="none" stroke="url(#darkGrayOutlineGrad)" stroke-width="1.5" />
      <circle cx="150" cy="150" r="110.4" fill="none" stroke="url(#darkGrayOutlineGrad)" stroke-width="1.4" />
    </g>

    <!-- 2. 精密幾何金屬銀星形旗幟與旗桿 -->
    <g>
      <!-- 旗幟與旗桿立體厚度深鐵灰陰影層 -->
      <g transform="translate(2, 2.8)" mask="url(#flagStarMask)">
        <path d="M 79 94 C 78.2 89, 85.8 87.8, 86.8 92.8 L 87.2 94.5 C 116 74, 152 80, 178 86 C 194 89, 205 83, 212 76 L 226 164 C 216 173, 202 178, 185 174 C 158 168, 125 166, 102 184 L 109.5 227 C 110.3 232, 102.7 233.3, 101.8 228.3 L 79 94 Z" fill="#2B2F36" />
      </g>

      <!-- 旗幟與旗桿主體（套用五角星透明遮罩） -->
      <g mask="url(#flagStarMask)">
        <!-- 旗桿 + 旗面亮銀白至冷鐵灰橫向金屬漸層 -->
        <path d="M 79 94 C 78.2 89, 85.8 87.8, 86.8 92.8 L 87.2 94.5 C 116 74, 152 80, 178 86 C 194 89, 205 83, 212 76 L 226 164 C 216 173, 202 178, 185 174 C 158 168, 125 166, 102 184 L 109.5 227 C 110.3 232, 102.7 233.3, 101.8 228.3 L 79 94 Z" fill="url(#metallicSilverGrad)" />

        <!-- 旗面左側斜向亮銀烤漆高光反光帶 -->
        <g clip-path="url(#flagBodyClip)">
          <polygon points="72,68 158,68 118,195 65,195" fill="url(#silverSpecularGrad)" />
          <path d="M 75 70 L 225 65 L 228 106 Q 145 118 88 142 Z" fill="url(#silverSpecularGrad)" opacity="0.75" />
        </g>

        <!-- 旗桿左側亮銀圓柱高光反光線 -->
        <line x1="82.5" y1="93" x2="104.5" y2="226" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.85" />
      </g>

      <!-- 旗幟外輪廓深灰色外框線（確保淺色地圖清晰辨識） -->
      <path d="M 79 94 C 78.2 89, 85.8 87.8, 86.8 92.8 L 87.2 94.5 C 116 74, 152 80, 178 86 C 194 89, 205 83, 212 76 L 226 164 C 216 173, 202 178, 185 174 C 158 168, 125 166, 102 184 L 109.5 227 C 110.3 232, 102.7 233.3, 101.8 228.3 L 79 94 Z" fill="none" stroke="url(#darkGrayOutlineGrad)" stroke-width="1.6" stroke-linejoin="round" />

      <!-- 中央鏤空五角星深灰色內框線 -->
      <polygon points="154,107 162.5,124.2 181.5,127 167.8,140.4 171,159.3 154,150.4 137,159.3 140.2,140.4 126.5,127 145.5,124.2" fill="none" stroke="url(#darkGrayOutlineGrad)" stroke-width="1.6" stroke-linejoin="round" />
    </g>

  </g>
</svg>