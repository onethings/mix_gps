<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 180" width="120" height="180">
  <defs>
    <!-- 1. 車身主體橫向圓弧金屬黑漸層 (bodyGrad) -->
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#111317" />
      <stop offset="20%" stop-color="#262E3B" />
      <stop offset="48%" stop-color="#4E5D73" />
      <stop offset="52%" stop-color="#596A82" />
      <stop offset="80%" stop-color="#262E3B" />
      <stop offset="100%" stop-color="#0A0C0F" />
    </linearGradient>

    <!-- 2. 車頂頂蓋垂直光影漸層 (roofGrad) -->
    <linearGradient id="roofGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8CA0BC" stop-opacity="0.88" />
      <stop offset="50%" stop-color="#3C4B61" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#151C24" stop-opacity="0.85" />
    </linearGradient>

    <!-- 3. 廂體頂部加強金屬銀黑反光漸層 -->
    <linearGradient id="boxTopHighlight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B8C5D9" stop-opacity="0.48" />
      <stop offset="45%" stop-color="#4E5D73" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#0F141A" stop-opacity="0.35" />
    </linearGradient>

    <!-- 4. 車窗玻璃漸層 (glassGrad) -->
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E262C" />
      <stop offset="35%" stop-color="#37434D" />
      <stop offset="70%" stop-color="#222B32" />
      <stop offset="100%" stop-color="#11161A" />
    </linearGradient>

    <!-- 5. 柔和深暗黑底部懸浮陰影濾鏡 -->
    <filter id="dropShadow" x="-25%" y="-15%" width="150%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5" />
      <feOffset dx="0" dy="4" result="offsetblur" />
      <feFlood flood-color="#05070A" flood-opacity="0.48" />
      <feComposite in2="offsetblur" operator="in" />
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- 擋風玻璃裁切區域 -->
    <clipPath id="windshieldClip">
      <path d="M 35,28 Q 60,23 85,28 L 89,45 Q 60,41 31,45 Z" />
    </clipPath>

    <!-- 引擎蓋/車頭前蓋斜向高光裁切區域 -->
    <clipPath id="hoodClip">
      <path d="M 33,14 Q 60,10 87,14 Q 91,16 91,23 L 91,28 L 29,28 L 29,23 Q 29,16 33,14 Z" />
    </clipPath>

    <!-- 貨廂頂蓋斜向高光裁切區域 -->
    <clipPath id="boxRoofClip">
      <rect x="30" y="64" width="60" height="96" rx="2.5" />
    </clipPath>
  </defs>

  <!-- 底部懸浮陰影層 -->
  <g filter="url(#dropShadow)">
    
    <!-- ==================== 1. 後視鏡 (Canter 標誌性外伸式後視鏡) ==================== -->
    <!-- 左後視鏡支架與鏡殼 -->
    <path d="M 31,32 L 21,29 L 21,34 L 31,35 Z" fill="#14181F" />
    <rect x="19" y="25" width="4.5" height="11" rx="2" fill="#384352" stroke="#384252" stroke-width="1" />
    <!-- 右後視鏡支架與鏡殼 -->
    <path d="M 89,32 L 99,29 L 99,34 L 89,35 Z" fill="#14181F" />
    <rect x="96.5" y="25" width="4.5" height="11" rx="2" fill="#262E3B" stroke="#384252" stroke-width="1" />

    <!-- ==================== 2. 車頭駕駛室 (Cab) ==================== -->
    <!-- 駕駛室主體輪廓 -->
    <path d="M 33,14 
             Q 60,10 87,14 
             Q 91,16 91,23 
             L 91,58 
             L 29,58 
             L 29,23 
             Q 29,16 33,14 Z" fill="url(#bodyGrad)" stroke="#384252" stroke-width="1.7" stroke-linejoin="round" />

    <!-- 引擎蓋上方斜向明亮銀白高光反光條 -->
    <g clip-path="url(#hoodClip)">
      <polygon points="32,12 52,12 41,29 26,29" fill="#E2E8F0" opacity="0.45" />
      <polygon points="55,12 60,12 49,29 44,29" fill="#FFFFFF" opacity="0.30" />
    </g>

    <!-- 引擎蓋上方高光折線 -->
    <path d="M 36,17 Q 60,13.5 84,17" fill="none" stroke="#D8E2F0" stroke-width="1.8" stroke-linecap="round" opacity="0.80" />
    
    <!-- 引擎蓋兩側細微壓線 -->
    <path d="M 38,16 L 36,26" stroke="#2B3542" stroke-width="1.2" stroke-linecap="round" opacity="0.60" />
    <path d="M 82,16 L 84,26" stroke="#2B3542" stroke-width="1.2" stroke-linecap="round" opacity="0.60" />

    <!-- LED 晶鑽白光車頭燈（高反差冷白光） -->
    <path d="M 31,17 Q 34,14.5 39,14.5 L 38,17.5 Q 33,18 30.5,20 Z" fill="#F0F6FF" stroke="#4E5D73" stroke-width="0.5" />
    <path d="M 89,17 Q 86,14.5 81,14.5 L 82,17.5 Q 87,18 89.5,20 Z" fill="#F0F6FF" stroke="#4E5D73" stroke-width="0.5" />

    <!-- 前擋風玻璃 -->
    <path d="M 35,28 Q 60,23 85,28 L 89,45 Q 60,41 31,45 Z" fill="url(#glassGrad)" stroke="#11161A" stroke-width="1" />

    <!-- 擋風玻璃斜向白色反光條 -->
    <g clip-path="url(#windshieldClip)">
      <polygon points="36,22 46,22 34,48 24,48" fill="#FFFFFF" opacity="0.16" />
      <polygon points="50,22 54,22 42,48 38,48" fill="#FFFFFF" opacity="0.14" />
    </g>

    <!-- 雨刷細節 -->
    <path d="M 38,26.5 L 55,25" stroke="#11161A" stroke-width="1.2" stroke-linecap="round" opacity="0.85" />
    <path d="M 62,25 L 80,26.5" stroke="#11161A" stroke-width="1.2" stroke-linecap="round" opacity="0.85" />

    <!-- 駕駛室側窗（深色反光玻璃搭配白色高光點綴） -->
    <path d="M 30.5,33 L 32.5,46 L 30.5,52 Z" fill="url(#glassGrad)" />
    <path d="M 89.5,33 L 87.5,46 L 89.5,52 Z" fill="url(#glassGrad)" />
    <line x1="30.8" y1="37" x2="32.2" y2="41" stroke="#FFFFFF" stroke-width="0.7" opacity="0.18" />
    <line x1="89.2" y1="37" x2="87.8" y2="41" stroke="#FFFFFF" stroke-width="0.7" opacity="0.18" />

    <!-- 駕駛室車頂高光區 (roofGrad) -->
    <rect x="34" y="45.5" width="52" height="10" rx="2.5" fill="url(#roofGrad)" />
    <!-- 駕駛室車頂左側斜向槍灰銀反光 -->
    <polygon points="37,46 53,46 47,55 34,55" fill="#C8D4E6" opacity="0.36" />
    <!-- 駕駛室車頂中央高光反光條 -->
    <line x1="42" y1="48" x2="78" y2="48" stroke="#D8E2F0" stroke-width="1.3" stroke-linecap="round" opacity="0.80" />

    <!-- ==================== 3. 駕駛室與貨廂銜接縫隙 ==================== -->
    <rect x="31" y="57.5" width="58" height="3" fill="#14181F" />

    <!-- ==================== 4. 貨車廂體 (Box Body) ==================== -->
    <!-- 廂體外框 -->
    <rect x="26" y="60" width="68" height="104" rx="4" fill="url(#bodyGrad)" stroke="#384252" stroke-width="1.8" />

    <!-- 廂體頂蓋高光層 (roofGrad) -->
    <rect x="30" y="64" width="60" height="96" rx="2.5" fill="url(#roofGrad)" />
    <rect x="30" y="64" width="60" height="96" rx="2.5" fill="url(#boxTopHighlight)" />

    <!-- 車頂左側斜向金屬漆面高光反光帶 -->
    <g clip-path="url(#boxRoofClip)">
      <polygon points="28,64 56,64 38,160 24,160" fill="#D8E2F0" opacity="0.32" />
      <polygon points="60,64 67,64 49,160 42,160" fill="#FFFFFF" opacity="0.20" />
    </g>

    <!-- 貨廂頂部結構壓筋（Reinforcement Ribs） -->
    <g stroke="#2B3542" stroke-width="1.2" opacity="0.50">
      <line x1="33" y1="78" x2="87" y2="78" />
      <line x1="33" y1="95" x2="87" y2="95" />
      <line x1="33" y1="112" x2="87" y2="112" />
      <line x1="33" y1="129" x2="87" y2="129" />
      <line x1="33" y1="146" x2="87" y2="146" />
    </g>

    <!-- 車頂中央區域明亮金屬槍灰高光反光條 -->
    <rect x="55" y="65" width="10" height="94" rx="2" fill="#8CA0BC" opacity="0.38" />
    <rect x="58.5" y="66" width="3" height="92" rx="1.5" fill="#E2E8F0" opacity="0.42" />

    <!-- 廂體兩側垂直結構壓線 -->
    <line x1="30" y1="64" x2="30" y2="160" stroke="#2B3542" stroke-width="1" opacity="0.55" />
    <line x1="90" y1="64" x2="90" y2="160" stroke="#2B3542" stroke-width="1" opacity="0.55" />

    <!-- ==================== 5. 車尾細節與尾燈 ==================== -->
    <!-- 後保險桿/防撞護欄 -->
    <rect x="28" y="164" width="64" height="3.5" rx="1.5" fill="#14181F" stroke="#384252" stroke-width="0.8" />

    <!-- 警示紅光車尾燈（搭配深框區分黑車體） -->
    <rect x="29" y="164.5" width="11" height="2.5" rx="1" fill="#FF3B3B" stroke="#4A0505" stroke-width="0.4" />
    <rect x="80" y="164.5" width="11" height="2.5" rx="1" fill="#FF3B3B" stroke="#4A0505" stroke-width="0.4" />

    <!-- 車尾門中線暗示 -->
    <line x1="60" y1="160" x2="60" y2="164" stroke="#384252" stroke-width="1.4" />
  </g>
</svg>