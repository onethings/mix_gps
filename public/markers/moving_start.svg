<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <defs>
    <!-- 柔和深墨綠與暗曜黑底部懸浮陰影與螢光綠邊緣光暈濾鏡 -->
    <filter id="metallicGreenGlowShadow" x="-30%" y="-30%" width="160%" height="165%">
      <!-- 底部柔和暗曜黑 (#11161A) 懸浮陰影 -->
      <feGaussianBlur in="SourceAlpha" stdDeviation="7.5" result="blurShadow" />
      <feOffset in="blurShadow" dx="0" dy="6.5" result="offsetShadow" />
      <feFlood flood-color="#11161A" flood-opacity="0.58" result="colorShadow" />
      <feComposite in="colorShadow" in2="offsetShadow" operator="in" result="deepObsidianShadow" />

      <!-- 周圍微凝聚深森林綠 (#1A3312) 與螢光綠 (#47992C) 外光暈 -->
      <feGaussianBlur in="SourceAlpha" stdDeviation="2.6" result="blurRim" />
      <feFlood flood-color="#47992C" flood-opacity="0.48" result="colorRim" />
      <feComposite in="colorRim" in2="blurRim" operator="in" result="softEmeraldRim" />

      <feMerge>
        <feMergeNode in="deepObsidianShadow" />
        <feMergeNode in="softEmeraldRim" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- 橫向金屬綠主漸層（#B8FF9E -> #68CC47 -> #47992C -> #1A3312 -> #1E262C） -->
    <linearGradient id="metallicGreenMainGrad" x1="0%" y1="30%" x2="100%" y2="70%">
      <stop offset="0%" stop-color="#B8FF9E" />
      <stop offset="22%" stop-color="#68CC47" />
      <stop offset="50%" stop-color="#47992C" />
      <stop offset="78%" stop-color="#1A3312" />
      <stop offset="100%" stop-color="#1E262C" />
    </linearGradient>

    <!-- 外環立體金屬綠烤漆漸層（融合暗金屬板岩色與螢光綠高光） -->
    <linearGradient id="ringMetallicGreenGrad" x1="0%" y1="15%" x2="100%" y2="85%">
      <stop offset="0%" stop-color="#B6FF9C" />
      <stop offset="25%" stop-color="#68CC47" />
      <stop offset="55%" stop-color="#37434D" />
      <stop offset="80%" stop-color="#222B32" />
      <stop offset="100%" stop-color="#47992C" />
    </linearGradient>

    <!-- 暗曜黑與深板岩灰高對比外框線（#37434D -> #1E262C -> #11161A） -->
    <linearGradient id="darkSlateOutlineGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#37434D" />
      <stop offset="50%" stop-color="#1E262C" />
      <stop offset="100%" stop-color="#11161A" />
    </linearGradient>

    <!-- 內側螢光薄荷綠金屬倒角高光線（#E8FFDE -> #B6FF9C -> #47992C -> #B8FF9E） -->
    <linearGradient id="greenInnerBevelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8FFDE" stop-opacity="0.98" />
      <stop offset="35%" stop-color="#B6FF9C" stop-opacity="0.9" />
      <stop offset="72%" stop-color="#47992C" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#B8FF9E" stop-opacity="0.9" />
    </linearGradient>

    <!-- 左側斜向薄荷冰綠鏡面高光反光漸層（#E8FFDE -> #B8FF9E -> #68CC47） -->
    <linearGradient id="greenSpecularGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8FFDE" stop-opacity="0.72" />
      <stop offset="38%" stop-color="#B8FF9E" stop-opacity="0.36" />
      <stop offset="75%" stop-color="#68CC47" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#1A3312" stop-opacity="0" />
    </linearGradient>

    <!-- 旗面（含中空五角星）的複合路徑與裁切 -->
    <mask id="flagStarMask">
      <rect x="0" y="0" width="300" height="300" fill="white" />
      <!-- 中央鏤空五角星（保持地圖底圖 100% 透明穿透） -->
      <polygon points="154,107 162.5,124.2 181.5,127 167.8,140.4 171,159.3 154,150.4 137,159.3 140.2,140.4 126.5,127 145.5,124.2" fill="black" />
    </mask>

    <clipPath id="flagBodyClip">
      <path d="M 85 95 C 115 74, 152 80, 178 86 C 194 89, 205 83, 212 76 L 226 164 C 216 173, 202 178, 185 174 C 158 168, 125 166, 102 184 L 85 95 Z" />
    </clipPath>

    <clipPath id="ringClip">
      <path fill-rule="evenodd" d="M 150 28 A 122 122 0 1 0 150 272 A 122 122 0 1 0 150 28 Z M 150 40 A 110 110 0 1 1 150 260 A 110 110 0 1 1 150 40 Z" />
    </clipPath>
  </defs>

  <!-- 整體套用柔和暗曜黑懸浮陰影與翡翠綠微暈 -->
  <g filter="url(#metallicGreenGlowShadow)">

    <!-- 1. 外圍精密幾何金屬綠圓環 -->
    <g>
      <!-- 圓環立體暗曜黑 (#11161A) 陰影底座 -->
      <circle cx="151" cy="152.5" r="116" fill="none" stroke="#11161A" stroke-width="12.5" opacity="0.85" />
      <!-- 圓環主體金屬綠與暗板岩漸層 -->
      <circle cx="150" cy="150" r="116" fill="none" stroke="url(#ringMetallicGreenGrad)" stroke-width="11" />
      <!-- 圓環左側及上半部薄荷綠 (#E8FFDE) 斜向鏡面高光 -->
      <g clip-path="url(#ringClip)">
        <path d="M 20 155 Q 135 100 265 65 L 265 15 L 20 15 Z" fill="url(#greenSpecularGrad)" />
      </g>
      <!-- 圓環內側螢光綠倒角高光線 -->
      <circle cx="150" cy="150" r="120.2" fill="none" stroke="url(#greenInnerBevelGrad)" stroke-width="1.2" />
      <circle cx="150" cy="150" r="111.5" fill="none" stroke="url(#greenInnerBevelGrad)" stroke-width="1.1" />
      <!-- 圓環最外緣與最內緣暗曜黑外框線（確保淺色地圖清晰辨識） -->
      <circle cx="150" cy="150" r="121.6" fill="none" stroke="url(#darkSlateOutlineGrad)" stroke-width="1.5" />
      <circle cx="150" cy="150" r="110.4" fill="none" stroke="url(#darkSlateOutlineGrad)" stroke-width="1.4" />
    </g>

    <!-- 2. 精密幾何金屬綠星形旗幟與旗桿 -->
    <g>
      <!-- 旗幟與旗桿立體厚度暗金屬陰影層 (#222B32) -->
      <g transform="translate(2, 2.8)" mask="url(#flagStarMask)">
        <path d="M 79 94 C 78.2 89, 85.8 87.8, 86.8 92.8 L 87.2 94.5 C 116 74, 152 80, 178 86 C 194 89, 205 83, 212 76 L 226 164 C 216 173, 202 178, 185 174 C 158 168, 125 166, 102 184 L 109.5 227 C 110.3 232, 102.7 233.3, 101.8 228.3 L 79 94 Z" fill="#222B32" />
      </g>

      <!-- 旗幟與旗桿主體（套用五角星透明遮罩） -->
      <g mask="url(#flagStarMask)">
        <!-- 旗桿 + 旗面主金屬綠橫向漸層 -->
        <path d="M 79 94 C 78.2 89, 85.8 87.8, 86.8 92.8 L 87.2 94.5 C 116 74, 152 80, 178 86 C 194 89, 205 83, 212 76 L 226 164 C 216 173, 202 178, 185 174 C 158 168, 125 166, 102 184 L 109.5 227 C 110.3 232, 102.7 233.3, 101.8 228.3 L 79 94 Z" fill="url(#metallicGreenMainGrad)" />

        <!-- 旗面左側斜向薄荷亮綠烤漆高光反光帶 -->
        <g clip-path="url(#flagBodyClip)">
          <polygon points="72,68 158,68 118,195 65,195" fill="url(#greenSpecularGrad)" />
          <path d="M 75 70 L 225 65 L 228 106 Q 145 118 88 142 Z" fill="url(#greenSpecularGrad)" opacity="0.72" />
        </g>

        <!-- 旗桿左側極亮薄荷白 (#E8FFDE) 圓柱高光反光線 -->
        <line x1="82.5" y1="93" x2="104.5" y2="226" stroke="#E8FFDE" stroke-width="2" stroke-linecap="round" opacity="0.88" />
      </g>

      <!-- 旗幟內層螢光綠倒角高光描邊 -->
      <path d="M 79 94 C 78.2 89, 85.8 87.8, 86.8 92.8 L 87.2 94.5 C 116 74, 152 80, 178 86 C 194 89, 205 83, 212 76 L 226 164 C 216 173, 202 178, 185 174 C 158 168, 125 166, 102 184 L 109.5 227 C 110.3 232, 102.7 233.3, 101.8 228.3 L 79 94 Z" fill="none" stroke="url(#greenInnerBevelGrad)" stroke-width="2.1" stroke-linejoin="round" />

      <!-- 旗幟最外緣暗曜黑外框線（#11161A） -->
      <path d="M 79 94 C 78.2 89, 85.8 87.8, 86.8 92.8 L 87.2 94.5 C 116 74, 152 80, 178 86 C 194 89, 205 83, 212 76 L 226 164 C 216 173, 202 178, 185 174 C 158 168, 125 166, 102 184 L 109.5 227 C 110.3 232, 102.7 233.3, 101.8 228.3 L 79 94 Z" fill="none" stroke="url(#darkSlateOutlineGrad)" stroke-width="1.3" stroke-linejoin="round" />

      <!-- 中央鏤空五角星螢光綠倒角與暗曜黑雙層描邊 -->
      <polygon points="154,107 162.5,124.2 181.5,127 167.8,140.4 171,159.3 154,150.4 137,159.3 140.2,140.4 126.5,127 145.5,124.2" fill="none" stroke="url(#greenInnerBevelGrad)" stroke-width="2.2" stroke-linejoin="round" />
      <polygon points="154,107 162.5,124.2 181.5,127 167.8,140.4 171,159.3 154,150.4 137,159.3 140.2,140.4 126.5,127 145.5,124.2" fill="none" stroke="url(#darkSlateOutlineGrad)" stroke-width="1.2" stroke-linejoin="round" />
    </g>

  </g>
</svg>