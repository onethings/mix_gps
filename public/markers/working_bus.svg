<svg xmlns="http://www.w3.org/2000/svg" width="120" height="180" viewBox="0 0 120 180">
  <defs>
    <!-- 柔和的深藍色底部懸浮陰影 -->
    <filter id="blueDropShadow" x="-25%" y="-20%" width="150%" height="145%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0D224D" flood-opacity="0.38" />
    </filter>

    <!-- 金屬烤漆主車身橫向漸層（鈷藍 #2D5FBD 至亮天藍 #87B8FF） -->
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#224994" />
      <stop offset="18%" stop-color="#2D5FBD" />
      <stop offset="38%" stop-color="#5B92EB" />
      <stop offset="50%" stop-color="#87B8FF" />
      <stop offset="65%" stop-color="#5288E0" />
      <stop offset="85%" stop-color="#2D5FBD" />
      <stop offset="100%" stop-color="#1E4185" />
    </linearGradient>

    <!-- 車頂金屬天藍垂直漸層 -->
    <linearGradient id="roofGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#9EC7FF" stop-opacity="0.92" />
      <stop offset="45%" stop-color="#5B92EB" stop-opacity="0.88" />
      <stop offset="100%" stop-color="#2D5FBD" stop-opacity="0.9" />
    </linearGradient>

    <!-- 冰藍色漆面斜向高光反光帶漸層 -->
    <linearGradient id="iceBlueSheen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DCEBFF" stop-opacity="0.62" />
      <stop offset="55%" stop-color="#B5D6FF" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <!-- 車窗玻璃漸層 -->
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E262C" />
      <stop offset="35%" stop-color="#37434D" />
      <stop offset="70%" stop-color="#222B32" />
      <stop offset="100%" stop-color="#11161A" />
    </linearGradient>

    <!-- 引擎蓋高光漸層 -->
    <linearGradient id="hoodHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#CBE2FF" stop-opacity="0.72" />
      <stop offset="100%" stop-color="#87B8FF" stop-opacity="0.06" />
    </linearGradient>

    <!-- 前擋風玻璃裁切遮罩 -->
    <clipPath id="frontGlassClip">
      <path d="M 32 45 Q 60 41 88 45 L 91 58 Q 60 55 29 58 Z" />
    </clipPath>

    <!-- 後擋風玻璃裁切遮罩 -->
    <clipPath id="rearGlassClip">
      <path d="M 34 157 Q 60 159 86 157 L 84 163 Q 60 165 36 163 Z" />
    </clipPath>

    <!-- 車頂左側高光裁切遮罩 -->
    <clipPath id="roofClip">
      <rect x="34" y="62" width="52" height="91" rx="6" />
    </clipPath>
  </defs>

  <!-- 主車輛群組（含深藍色底部懸浮陰影） -->
  <g filter="url(#blueDropShadow)">

    <!-- 左右後視鏡 -->
    <g stroke="#183670" stroke-width="1.2" fill="#2D5FBD">
      <!-- 左後視鏡 -->
      <path d="M 29 49 L 20 47 L 20 53 L 29 52 Z" />
      <rect x="18" y="45" width="4" height="9" rx="1.5" fill="#4A80DE" />
      <!-- 右後視鏡 -->
      <path d="M 91 49 L 100 47 L 100 53 L 91 52 Z" />
      <rect x="98" y="45" width="4" height="9" rx="1.5" fill="#2652A6" />
    </g>

    <!-- 前輪輪拱微凸提示 -->
    <rect x="28" y="21" width="4" height="14" rx="2" fill="#102247" />
    <rect x="88" y="21" width="4" height="14" rx="2" fill="#102247" />

    <!-- 車身外殼主體（車頭朝上，深鈷藍外框線 #183670） -->
    <path d="
      M 37 13
      Q 60 9 83 13
      Q 88 14 89 20
      L 90 38
      Q 93 41 93 47
      L 93 159
      Q 93 166 85 167
      Q 60 169 35 167
      Q 27 166 27 159
      L 27 47
      Q 27 41 30 38
      L 31 20
      Q 32 14 37 13
      Z" fill="url(#bodyGrad)" stroke="#183670" stroke-width="1.6" stroke-linejoin="round" />

    <!-- 前保險桿深色飾條 -->
    <path d="M 38 13.5 Q 60 10.5 82 13.5" fill="none" stroke="#132B59" stroke-width="2" stroke-linecap="round" />

    <!-- 車頭燈（LED 冰晶白光） -->
    <path d="M 33 15.5 Q 37 13.5 42 14 L 41 16.5 Q 36 16.5 33 15.5 Z" fill="#F0F7FF" />
    <path d="M 87 15.5 Q 83 13.5 78 14 L 79 16.5 Q 84 16.5 87 15.5 Z" fill="#F0F7FF" />

    <!-- 校車引擎蓋中央隆起高光 -->
    <path d="M 43 16 Q 60 14 77 16 L 80 41 Q 60 39 40 41 Z" fill="url(#hoodHighlight)" />

    <!-- 引擎蓋左側冰藍色斜向高光反光 -->
    <polygon points="41,16 53,15 47,40 39,41" fill="url(#iceBlueSheen)" />
    <polygon points="56,15 61,15 57,40 52,40" fill="#E3F0FF" fill-opacity="0.26" />

    <!-- 引擎蓋兩側細微壓線 -->
    <path d="M 42 16 L 39 41" stroke="#1B3D80" stroke-opacity="0.55" stroke-width="1.2" fill="none" />
    <path d="M 78 16 L 81 41" stroke="#1B3D80" stroke-opacity="0.55" stroke-width="1.2" fill="none" />
    <line x1="60" y1="15" x2="60" y2="40" stroke="#1B3D80" stroke-opacity="0.35" stroke-width="1" />

    <!-- 前擋風玻璃（雙片式設計） -->
    <g clip-path="url(#frontGlassClip)">
      <rect x="28" y="40" width="64" height="20" fill="url(#glassGrad)" />
      <!-- 玻璃斜向反光條 -->
      <polygon points="36,40 46,40 38,60 28,60" fill="#FFFFFF" fill-opacity="0.16" />
      <polygon points="50,40 55,40 47,60 42,60" fill="#FFFFFF" fill-opacity="0.16" />
      <polygon points="68,40 78,40 70,60 60,60" fill="#FFFFFF" fill-opacity="0.16" />
      <!-- 前擋中央分隔柱 -->
      <line x1="60" y1="41" x2="60" y2="58" stroke="#1E262C" stroke-width="1.8" />
    </g>
    <path d="M 32 45 Q 60 41 88 45 L 91 58 Q 60 55 29 58 Z" fill="none" stroke="#11161A" stroke-width="1.2" />

    <!-- 車頂頂蓋區域 -->
    <rect x="34" y="62" width="52" height="91" rx="6" fill="url(#roofGrad)" stroke="#1B3D80" stroke-opacity="0.55" stroke-width="1" />

    <!-- 車頂左側冰藍色斜向高光反光帶 -->
    <g clip-path="url(#roofClip)">
      <polygon points="34,62 52,62 42,153 34,153" fill="url(#iceBlueSheen)" />
      <polygon points="55,62 61,62 52,153 46,153" fill="#DCEBFF" fill-opacity="0.22" />
    </g>

    <!-- 車頂加強肋條紋理 -->
    <g stroke="#1B3D80" stroke-opacity="0.38" stroke-width="1">
      <line x1="43" y1="65" x2="43" y2="150" />
      <line x1="51.5" y1="65" x2="51.5" y2="150" />
      <line x1="60" y1="65" x2="60" y2="150" />
      <line x1="68.5" y1="65" x2="68.5" y2="150" />
      <line x1="77" y1="65" x2="77" y2="150" />
    </g>

    <!-- 車頂逃生天窗 1（前側） -->
    <rect x="52" y="78" width="16" height="16" rx="2.5" fill="#4E85E3" stroke="#183670" stroke-width="1" />
    <rect x="55" y="81" width="10" height="10" rx="1.5" fill="#9EC7FF" fill-opacity="0.88" />
    <polygon points="55,81 61,81 57,91 55,91" fill="#EBF4FF" fill-opacity="0.5" />

    <!-- 車頂逃生天窗 2（後側） -->
    <rect x="52" y="116" width="16" height="16" rx="2.5" fill="#4E85E3" stroke="#183670" stroke-width="1" />
    <rect x="55" y="119" width="10" height="10" rx="1.5" fill="#9EC7FF" fill-opacity="0.88" />
    <polygon points="55,119 61,119 57,129 55,129" fill="#EBF4FF" fill-opacity="0.5" />

    <!-- 左側車窗列 -->
    <g fill="url(#glassGrad)" stroke="#11161A" stroke-width="0.8">
      <rect x="28.5" y="64" width="3.5" height="14" rx="1" />
      <rect x="28.5" y="81" width="3.5" height="14" rx="1" />
      <rect x="28.5" y="98" width="3.5" height="14" rx="1" />
      <rect x="28.5" y="115" width="3.5" height="14" rx="1" />
      <rect x="28.5" y="132" width="3.5" height="14" rx="1" />
    </g>
    <!-- 左側車窗反光條 -->
    <g fill="#FFFFFF" fill-opacity="0.18">
      <polygon points="28.5,67 32,65 32,69 28.5,71" />
      <polygon points="28.5,84 32,82 32,86 28.5,88" />
      <polygon points="28.5,101 32,99 32,103 28.5,105" />
      <polygon points="28.5,118 32,116 32,120 28.5,122" />
      <polygon points="28.5,135 32,133 32,137 28.5,139" />
    </g>

    <!-- 右側車窗列 -->
    <g fill="url(#glassGrad)" stroke="#11161A" stroke-width="0.8">
      <rect x="88" y="64" width="3.5" height="14" rx="1" />
      <rect x="88" y="81" width="3.5" height="14" rx="1" />
      <rect x="88" y="98" width="3.5" height="14" rx="1" />
      <rect x="88" y="115" width="3.5" height="14" rx="1" />
      <rect x="88" y="132" width="3.5" height="14" rx="1" />
    </g>
    <!-- 右側車窗反光條 -->
    <g fill="#FFFFFF" fill-opacity="0.18">
      <polygon points="88,67 91.5,65 91.5,69 88,71" />
      <polygon points="88,84 91.5,82 91.5,86 88,88" />
      <polygon points="88,101 91.5,99 91.5,103 88,105" />
      <polygon points="88,118 91.5,116 91.5,120 88,122" />
      <polygon points="88,135 91.5,133 91.5,137 88,139" />
    </g>

    <!-- 後擋風玻璃 -->
    <g clip-path="url(#rearGlassClip)">
      <rect x="33" y="156" width="54" height="9" fill="url(#glassGrad)" />
      <polygon points="42,156 49,156 44,165 37,165" fill="#FFFFFF" fill-opacity="0.15" />
      <polygon points="66,156 73,156 68,165 61,165" fill="#FFFFFF" fill-opacity="0.15" />
    </g>
    <path d="M 34 157 Q 60 159 86 157 L 84 163 Q 60 165 36 163 Z" fill="none" stroke="#11161A" stroke-width="1" />

    <!-- 車尾燈（警示紅光） -->
    <rect x="32" y="165" width="9" height="2.2" rx="1" fill="#FF4D4D" />
    <rect x="79" y="165" width="9" height="2.2" rx="1" fill="#FF4D4D" />

  </g>
</svg>