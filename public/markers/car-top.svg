<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" width="200" height="240" fill="none">
  <defs>
    <!-- 車身主體金屬漸層 -->
    <linearGradient id="bodyGrad" x1="100" y1="15" x2="100" y2="225" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3A4659" />
      <stop offset="50%" stop-color="#222936" />
      <stop offset="100%" stop-color="#141821" />
    </linearGradient>

    <!-- 玻璃座艙漸層 -->
    <linearGradient id="glassGrad" x1="100" y1="55" x2="100" y2="175" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4A8FE7" stop-opacity="0.85" />
      <stop offset="45%" stop-color="#1D3557" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#0D1726" stop-opacity="0.98" />
    </linearGradient>

    <!-- 玻璃反光高光 -->
    <linearGradient id="glassShine" x1="65" y1="60" x2="135" y2="130" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <!-- 輪胎立體漸層 -->
    <linearGradient id="tireGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0B0D12" />
      <stop offset="50%" stop-color="#262C36" />
      <stop offset="100%" stop-color="#0B0D12" />
    </linearGradient>

    <!-- 前大燈光暈 -->
    <filter id="headlightGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- 四個運動寬胎 (半嵌入式設計) -->
  <!-- 左前輪 -->
  <rect x="34" y="46" width="16" height="36" rx="7" fill="url(#tireGrad)" stroke="#11151C" stroke-width="1.5" />
  <!-- 右前輪 -->
  <rect x="150" y="46" width="16" height="36" rx="7" fill="url(#tireGrad)" stroke="#11151C" stroke-width="1.5" />
  <!-- 左後輪 -->
  <rect x="32" y="148" width="18" height="40" rx="8" fill="url(#tireGrad)" stroke="#11151C" stroke-width="1.5" />
  <!-- 右後輪 -->
  <rect x="150" y="148" width="18" height="40" rx="8" fill="url(#tireGrad)" stroke="#11151C" stroke-width="1.5" />

  <!-- 車尾底部空氣力學擴散器 (替代原圖梯形尾翼，更精簡大氣) -->
  <path d="M 78 214 L 122 214 L 116 225 C 115 227 113 228 110 228 L 90 228 C 87 228 85 227 84 225 Z" fill="#161B24" stroke="#2D3748" stroke-width="1.5" />
  <!-- 擴散器導流鰭片 -->
  <line x1="93" y1="216" x2="93" y2="226" stroke="#3A4659" stroke-width="1.5" stroke-linecap="round" />
  <line x1="100" y1="216" x2="100" y2="226" stroke="#3A4659" stroke-width="1.5" stroke-linecap="round" />
  <line x1="107" y1="216" x2="107" y2="226" stroke="#3A4659" stroke-width="1.5" stroke-linecap="round" />

  <!-- 車身主體輪廓 (流線型寬體超跑比例) -->
  <path d="M 100 16
           C 132 16, 154 34, 156 62
           C 157 78, 152 92, 152 115
           C 152 138, 158 152, 156 178
           C 154 202, 136 216, 100 216
           C 64 216, 46 202, 44 178
           C 42 152, 48 138, 48 115
           C 48 92, 43 78, 44 62
           C 46 34, 68 16, 100 16 Z" fill="url(#bodyGrad)" stroke="#4B586E" stroke-width="2" />

  <!-- 車頭引擎蓋肌肉摺線 -->
  <path d="M 72 30 Q 100 42 128 30" stroke="#53627A" stroke-width="1.5" stroke-linecap="round" opacity="0.6" />
  <path d="M 66 44 L 74 62" stroke="#141821" stroke-width="2" stroke-linecap="round" opacity="0.7" />
  <path d="M 134 44 L 126 62" stroke="#141821" stroke-width="2" stroke-linecap="round" opacity="0.7" />

  <!-- 未來感刀鋒 LED 頭燈 (呼應原圖黃色車燈，升級為銳利光條) -->
  <g filter="url(#headlightGlow)">
    <!-- 左前燈 -->
    <path d="M 56 42 C 62 31, 74 25, 84 24 C 75 29, 65 35, 56 42 Z" fill="#FDE047" />
    <!-- 右前燈 -->
    <path d="M 144 42 C 138 31, 126 25, 116 24 C 125 29, 135 35, 144 42 Z" fill="#FDE047" />
  </g>

  <!-- 極簡流線後視鏡 -->
  <path d="M 45 78 L 31 83 C 29 84, 29 87, 32 88 L 45 87 Z" fill="#2C3545" stroke="#4B586E" stroke-width="1.2" />
  <path d="M 155 78 L 169 83 C 171 84, 171 87, 168 88 L 155 87 Z" fill="#2C3545" stroke="#4B586E" stroke-width="1.2" />

  <!-- 一體式全景玻璃座艙 (前擋風玻璃 + 天窗 + 後窗) -->
  <path d="M 100 56
           C 122 56, 135 66, 137 82
           L 133 158
           C 131 174, 118 182, 100 182
           C 82 182, 69 174, 67 158
           L 63 82
           C 65 66, 78 56, 100 56 Z" fill="url(#glassGrad)" stroke="#63A4FF" stroke-width="1.2" stroke-opacity="0.5" />

  <!-- 座艙玻璃斜向光澤反射 -->
  <path d="M 100 58
           C 118 58, 130 66, 133 78
           L 120 120
           L 67 95
           L 66 80
           C 69 66, 82 58, 100 58 Z" fill="url(#glassShine)" />

  <!-- 車頂結構橫樑 (保留原圖中間橫線的設計語言，轉化為天窗結構線) -->
  <path d="M 65 104 Q 100 100 135 104" stroke="#1E2633" stroke-width="3.5" stroke-linecap="round" />
  <path d="M 68 144 Q 100 148 132 144" stroke="#1E2633" stroke-width="2.5" stroke-linecap="round" />

  <!-- 車尾貫穿式紅色 LED 尾燈 -->
  <path d="M 62 198 Q 100 208 138 198" stroke="#EF4444" stroke-width="3" stroke-linecap="round" opacity="0.9" />
  <path d="M 72 201 Q 100 208 128 201" stroke="#FCA5A5" stroke-width="1" stroke-linecap="round" />
</svg>