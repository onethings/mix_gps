<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 240" width="160" height="240">
  <defs>
    <!-- 底部陰影 -->
    <filter id="dropShadow" x="-15%" y="-10%" width="130%" height="125%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.35" />
    </filter>

    <!-- 曜石黑車身主漸層 -->
    <linearGradient id="blackBodyGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#141619" />
      <stop offset="12%" stop-color="#2c3036" />
      <stop offset="50%" stop-color="#3a3f47" />
      <stop offset="88%" stop-color="#2c3036" />
      <stop offset="100%" stop-color="#141619" />
    </linearGradient>

    <!-- 引擎蓋金屬反光漸層 -->
    <linearGradient id="hoodGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#23262b" />
      <stop offset="30%" stop-color="#454b54" />
      <stop offset="50%" stop-color="#525963" />
      <stop offset="70%" stop-color="#454b54" />
      <stop offset="100%" stop-color="#23262b" />
    </linearGradient>

    <!-- 車頂金屬反光漸層 -->
    <linearGradient id="roofGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4e555e" />
      <stop offset="50%" stop-color="#32373e" />
      <stop offset="100%" stop-color="#1c1f24" />
    </linearGradient>

    <!-- 擋風玻璃深色漸層 -->
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#161b22" />
      <stop offset="100%" stop-color="#0b0e12" />
    </linearGradient>

    <!-- 後車斗貨箱底色 -->
    <linearGradient id="bedGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#101214" />
      <stop offset="50%" stop-color="#1a1d21" />
      <stop offset="100%" stop-color="#101214" />
    </linearGradient>

    <!-- 頭燈微光漸層 -->
    <linearGradient id="headlightGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#d8f3ff" />
    </linearGradient>
  </defs>

  <!-- 整台車群組（含透明背景與自然陰影） -->
  <g filter="url(#dropShadow)">
    
    <!-- 四個輪胎突出部分 -->
    <rect x="30" y="45" width="4" height="26" rx="2" fill="#0a0a0c" />
    <rect x="126" y="45" width="4" height="26" rx="2" fill="#0a0a0c" />
    <rect x="30" y="168" width="4" height="26" rx="2" fill="#0a0a0c" />
    <rect x="126" y="168" width="4" height="26" rx="2" fill="#0a0a0c" />

    <!-- 左右後視鏡 -->
    <!-- 左後視鏡 -->
    <path d="M 33 82 L 23 84 C 20 85 20 92 23 93 L 33 94 Z" fill="url(#blackBodyGrad)" stroke="#0f1114" stroke-width="1" />
    <!-- 右後視鏡 -->
    <path d="M 127 82 L 137 84 C 140 85 140 92 137 93 L 127 94 Z" fill="url(#blackBodyGrad)" stroke="#0f1114" stroke-width="1" />

    <!-- 車身主輪廓 -->
    <path d="M 48 16 
             C 65 14, 95 14, 112 16 
             C 122 18, 126 26, 127 38 
             L 127 204 
             C 127 215, 122 220, 112 221 
             C 92 223, 68 223, 48 221 
             C 38 220, 33 215, 33 204 
             L 33 38 
             C 34 26, 38 18, 48 16 Z" fill="url(#blackBodyGrad)" stroke="#0d0e11" stroke-width="1.5" />

    <!-- 車頭水箱護罩（進氣格柵） -->
    <path d="M 52 16 C 68 15, 92 15, 108 16 L 105 21 C 90 20, 70 20, 55 21 Z" fill="#111317" />

    <!-- 左右大燈 (Headlights) -->
    <path d="M 37 32 C 37 25, 42 21, 51 20 L 49 27 C 43 28, 39 30, 37 32 Z" fill="url(#headlightGrad)" />
    <path d="M 123 32 C 123 25, 118 21, 109 20 L 111 27 C 117 28, 121 30, 123 32 Z" fill="url(#headlightGrad)" />

    <!-- 引擎蓋立體折線與高光 -->
    <path d="M 55 23 L 105 23 L 107 65 C 90 63, 70 63, 53 65 Z" fill="url(#hoodGrad)" opacity="0.85" />
    <!-- 引擎蓋兩條平行高光反光條 -->
    <rect x="59" y="29" width="3" height="34" rx="1.5" fill="#ffffff" opacity="0.28" />
    <rect x="98" y="29" width="3" height="34" rx="1.5" fill="#ffffff" opacity="0.28" />

    <!-- 前擋風玻璃 -->
    <path d="M 43 71 C 65 68, 95 68, 117 71 L 112 93 C 92 90, 68 90, 48 93 Z" fill="url(#glassGrad)" stroke="#080a0d" stroke-width="1" />
    <!-- 前擋風玻璃斜向反光 -->
    <polygon points="50,71 62,70 52,92 46,92" fill="#ffffff" opacity="0.12" />
    <polygon points="67,70 74,70 63,91 57,91" fill="#ffffff" opacity="0.08" />

    <!-- 左右側車窗 -->
    <polygon points="39,77 45,94 45,134 39,140" fill="url(#glassGrad)" stroke="#080a0d" stroke-width="0.8" />
    <polygon points="121,77 115,94 115,134 121,140" fill="url(#glassGrad)" stroke="#080a0d" stroke-width="0.8" />

    <!-- 駕駛艙車頂 (Roof) -->
    <rect x="47" y="94" width="66" height="44" rx="6" fill="url(#roofGrad)" stroke="#181b20" stroke-width="1" />
    <!-- 車頂左側高光邊條 -->
    <rect x="51" y="99" width="2.5" height="34" rx="1" fill="#ffffff" opacity="0.22" />

    <!-- 後擋風玻璃 -->
    <path d="M 48 139 L 112 139 L 115 147 L 45 147 Z" fill="url(#glassGrad)" stroke="#080a0d" stroke-width="0.8" />
    <!-- 後擋風玻璃反光 -->
    <polygon points="52,139 63,139 59,147 49,147" fill="#ffffff" opacity="0.1" />

    <!-- 第三煞車燈 (高位煞車燈) -->
    <rect x="70" y="137.5" width="20" height="2.2" rx="1" fill="#ff3b3b" />

    <!-- 後車斗 (Truck Bed) 外框與內部 -->
    <rect x="45" y="153" width="70" height="58" rx="3" fill="url(#bedGrad)" stroke="#0a0c0e" stroke-width="1.5" />
    
    <!-- 後車斗內部防滑直條紋 (6條) -->
    <rect x="53" y="156" width="4" height="52" rx="1.5" fill="#252930" />
    <rect x="63" y="156" width="4" height="52" rx="1.5" fill="#252930" />
    <rect x="73" y="156" width="4" height="52" rx="1.5" fill="#252930" />
    <rect x="83" y="156" width="4" height="52" rx="1.5" fill="#252930" />
    <rect x="93" y="156" width="4" height="52" rx="1.5" fill="#252930" />
    <rect x="103" y="156" width="4" height="52" rx="1.5" fill="#252930" />

    <!-- 車尾保險桿高光線條 -->
    <path d="M 46 216 C 68 218, 92 218, 114 216" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.25" />

    <!-- 左右紅色尾燈 (Taillights) -->
    <path d="M 36 205 L 40 206 L 40 216 C 37 215, 36 212, 36 205 Z" fill="#ff3b3b" />
    <path d="M 124 205 L 120 206 L 120 216 C 123 215, 124 212, 124 205 Z" fill="#ff3b3b" />

  </g>
</svg>