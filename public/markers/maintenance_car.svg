<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 180" width="120" height="180">
  <defs>
    <!-- 柔和的外陰影（配合黑色車身調整為深灰半透明發光陰影） -->
    <filter id="car-glow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="2" stdDeviation="4.5" flood-color="#000000" flood-opacity="0.35" />
    </filter>

    <!-- 車身主體黑色金屬烤漆漸層 -->
    <linearGradient id="black-body-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#141416" />
      <stop offset="22%" stop-color="#2c2d30" />
      <stop offset="50%" stop-color="#3a3b40" />
      <stop offset="78%" stop-color="#2c2d30" />
      <stop offset="100%" stop-color="#141416" />
    </linearGradient>

    <!-- 車頂與引擎蓋亮面漸層 -->
    <linearGradient id="black-roof-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#484a50" />
      <stop offset="50%" stop-color="#242528" />
      <stop offset="100%" stop-color="#121314" />
    </linearGradient>

    <!-- 深邃玻璃擋風窗漸層（與黑車身區隔的冷灰藍反光） -->
    <linearGradient id="glass-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#101418" />
      <stop offset="50%" stop-color="#1b2229" />
      <stop offset="100%" stop-color="#0a0c0e" />
    </linearGradient>

    <!-- 車身斜切環境光澤反射（保留原圖標誌性的斜向亮面） -->
    <linearGradient id="gloss-reflection" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.22" />
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.0" />
    </linearGradient>

    <!-- 車窗玻璃反光 -->
    <linearGradient id="glass-reflection" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02" />
    </linearGradient>

    <!-- 裁切路徑：限制高光在車身輪廓內 -->
    <clipPath id="body-clip">
      <path d="M 27 45 C 27 20, 44 13, 60 13 C 76 13, 93 20, 93 45 L 93 138 C 93 156, 78 165, 60 165 C 42 165, 27 156, 27 138 Z" />
    </clipPath>
  </defs>

  <!-- 整體車輛群組（帶外發光陰影） -->
  <g filter="url(#car-glow)">
    
    <!-- 左後視鏡 -->
    <path d="M 27 62 L 15 64 C 12.5 64.5, 12.5 70.5, 15 71 L 27 70.5 Z" fill="#26272b" stroke="#0d0d0e" stroke-width="1.2" stroke-linejoin="round" />
    
    <!-- 右後視鏡 -->
    <path d="M 93 62 L 105 64 C 107.5 64.5, 107.5 70.5, 105 71 L 93 70.5 Z" fill="#26272b" stroke="#0d0d0e" stroke-width="1.2" stroke-linejoin="round" />

    <!-- 車身主輪廓 -->
    <path d="M 27 45 C 27 20, 44 13, 60 13 C 76 13, 93 20, 93 45 L 93 138 C 93 156, 78 165, 60 165 C 42 165, 27 156, 27 138 Z" fill="url(#black-body-grad)" stroke="#09090a" stroke-width="1.8" />

    <!-- 車身內部細節（受車身輪廓裁切） -->
    <g clip-path="url(#body-clip)">
      
      <!-- 車頭水箱護罩 / 進氣口 -->
      <path d="M 47 15 L 73 15 L 70 19 L 50 19 Z" fill="#050505" stroke="#3a3c42" stroke-width="0.6" />

      <!-- 引擎蓋兩側折線 -->
      <path d="M 38 30 L 42 52" stroke="#111214" stroke-width="1.3" stroke-linecap="round" />
      <path d="M 39 30 L 43 52" stroke="#45474e" stroke-width="0.6" stroke-linecap="round" />
      
      <path d="M 82 30 L 78 52" stroke="#111214" stroke-width="1.3" stroke-linecap="round" />
      <path d="M 81 30 L 77 52" stroke="#45474e" stroke-width="0.6" stroke-linecap="round" />

      <!-- 白色LED頭燈（左 & 右） -->
      <path d="M 30 28 C 34 23, 40 21, 45 22 C 42 26, 37 29, 32 32 Z" fill="#ffffff" />
      <path d="M 90 28 C 86 23, 80 21, 75 22 C 78 26, 83 29, 88 32 Z" fill="#ffffff" />

      <!-- 前擋風玻璃 -->
      <path d="M 35 55 C 48 49, 72 49, 85 55 L 80 74 C 68 70, 52 70, 40 74 Z" fill="url(#glass-grad)" stroke="#08090a" stroke-width="1.2" />

      <!-- 左側車窗（前窗 + B柱 + 後窗） -->
      <path d="M 30 60 L 36 78 L 36 93 L 30 93 Z" fill="url(#glass-grad)" stroke="#08090a" stroke-width="1" />
      <path d="M 30 96 L 36 96 L 36 112 L 30 126 Z" fill="url(#glass-grad)" stroke="#08090a" stroke-width="1" />

      <!-- 右側車窗（前窗 + B柱 + 後窗） -->
      <path d="M 90 60 L 84 78 L 84 93 L 90 93 Z" fill="url(#glass-grad)" stroke="#08090a" stroke-width="1" />
      <path d="M 90 96 L 84 96 L 84 112 L 84 112 L 90 126 Z" fill="url(#glass-grad)" stroke="#08090a" stroke-width="1" />

      <!-- 車頂中央區塊 -->
      <rect x="39" y="76" width="42" height="44" rx="8" ry="8" fill="url(#black-roof-grad)" stroke="#121316" stroke-width="1.4" />
      <!-- 車頂內緣高光細線 -->
      <rect x="40" y="77" width="40" height="42" rx="7" ry="7" fill="none" stroke="#52555e" stroke-width="0.6" stroke-opacity="0.6" />

      <!-- 後擋風玻璃 -->
      <path d="M 40 125 C 52 128, 68 128, 80 125 L 84 140 C 70 145, 50 145, 36 140 Z" fill="url(#glass-grad)" stroke="#08090a" stroke-width="1.2" />

      <!-- 紅色尾燈（左 & 右） -->
      <path d="M 31 148 C 36 153, 42 155, 48 156 L 47 159 C 40 159, 34 156, 30 151 Z" fill="#ff3b3b" />
      <path d="M 89 148 C 84 153, 78 155, 72 156 L 73 159 C 80 159, 86 156, 90 151 Z" fill="#ff3b3b" />

      <!-- 玻璃上的斜向反光層 -->
      <polygon points="35,48 56,48 42,145 28,145" fill="url(#glass-reflection)" />

      <!-- 整體車身斜切光澤反射層（完全還原原圖光影角度） -->
      <polygon points="27,13 78,13 48,165 27,165" fill="url(#gloss-reflection)" />
      
    </g>

    <!-- 車身最外圈微弱高光邊緣（讓黑車在深色背景中依然立體清晰） -->
    <path d="M 27.8 45 C 27.8 20.8, 44.5 13.8, 60 13.8 C 75.5 13.8, 92.2 20.8, 92.2 45 L 92.2 138 C 92.2 155.2, 77.5 164.2, 60 164.2 C 42.5 164.2, 27.8 155.2, 27.8 138 Z" fill="none" stroke="#5a5d66" stroke-width="0.6" stroke-opacity="0.5" />
  </g>
</svg>