<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 180" width="120" height="180">
  <defs>
    <!-- 停車狀態光暈與底部陰影濾鏡 -->
    <filter id="parkedRedGlow" x="-50%" y="-50%" width="200%" height="200%">
      <!-- 柔和暗紅色擴散光暈（模擬車輛已停妥視覺狀態） -->
      <feGaussianBlur in="SourceAlpha" stdDeviation="8" result="blurGlow" />
      <feFlood flood-color="#8B0000" flood-opacity="0.45" result="colorGlow" />
      <feComposite in2="blurGlow" operator="in" result="shadowGlow" />
      
      <!-- 底部實體陰影 -->
      <feGaussianBlur in="SourceAlpha" stdDeviation="4" result="blurShadow" />
      <feOffset dx="0" dy="4" result="offsetShadow" />
      <feFlood flood-color="#260505" flood-opacity="0.5" result="colorShadow" />
      <feComposite in2="offsetShadow" operator="in" result="shadowBase" />
      
      <!-- 合併效果 -->
      <feMerge>
        <feMergeNode in="shadowGlow" />
        <feMergeNode in="shadowBase" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- 紅色金屬烤漆車身主體橫向多段漸層 (bodyRedGrad) -->
    <linearGradient id="bodyRedGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7D1111" />
      <stop offset="25%" stop-color="#B82222" />
      <stop offset="50%" stop-color="#E33939" />
      <stop offset="75%" stop-color="#B82222" />
      <stop offset="100%" stop-color="#6E0D0D" />
    </linearGradient>

    <!-- 車頂頂蓋垂直漸層 (roofRedGrad) -->
    <linearGradient id="roofRedGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF7676" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#991A1A" stop-opacity="0.8" />
    </linearGradient>

    <!-- 車窗玻璃漸層 (glassGrad) -->
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E262C" />
      <stop offset="35%" stop-color="#37434D" />
      <stop offset="75%" stop-color="#222B32" />
      <stop offset="100%" stop-color="#11161A" />
    </linearGradient>

    <!-- 後車斗貨箱底板深色質感漸層 -->
    <linearGradient id="bedGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E262C" />
      <stop offset="50%" stop-color="#2B363E" />
      <stop offset="100%" stop-color="#1A2126" />
    </linearGradient>

    <!-- 玻璃斜向反光裁切路徑 -->
    <clipPath id="windshieldClip">
      <path d="M 32 54 Q 60 49 88 54 L 84 70 Q 60 66 36 70 Z" />
    </clipPath>
    <clipPath id="rearWindowClip">
      <path d="M 36 105 Q 60 107 84 105 L 86 112 Q 60 114 34 112 Z" />
    </clipPath>
  </defs>

  <!-- 車輛主體群組（套用停車狀態紅色光暈與陰影濾鏡，背景維持 100% 透明） -->
  <g id="ford-pickup-red-parked" filter="url(#parkedRedGlow)">
    
    <!-- 輪胎微露細節 -->
    <rect x="23" y="34" width="5" height="20" rx="2" fill="#1A2024" />
    <rect x="92" y="34" width="5" height="20" rx="2" fill="#1A2024" />
    <rect x="23" y="124" width="5" height="22" rx="2" fill="#1A2024" />
    <rect x="92" y="124" width="5" height="22" rx="2" fill="#1A2024" />

    <!-- 左右後視鏡 -->
    <path d="M 26 60 L 18 62 Q 16 63 16 65 L 17 69 Q 18 70 20 70 L 26 68 Z" fill="url(#bodyRedGrad)" stroke="#520B0B" stroke-width="1.2" />
    <path d="M 94 60 L 102 62 Q 104 63 104 65 L 103 69 Q 102 70 100 70 L 94 68 Z" fill="url(#bodyRedGrad)" stroke="#520B0B" stroke-width="1.2" />

    <!-- 車身主體輪廓 -->
    <path d="
      M 34 14
      Q 60 10 86 14
      Q 93 16 94 24
      L 95 48
      Q 96 52 94 56
      L 94 114
      Q 96 118 95 122
      L 94 156
      Q 93 164 85 165
      Q 60 167 35 165
      Q 27 164 26 156
      L 25 122
      Q 24 118 26 114
      L 26 56
      Q 24 52 25 48
      L 26 24
      Q 27 16 34 14 Z" fill="url(#bodyRedGrad)" stroke="#520B0B" stroke-width="1.8" stroke-linejoin="round" />

    <!-- 前保桿與進氣格柵細節 -->
    <path d="M 38 14 Q 60 11 82 14 L 80 17 Q 60 15 40 17 Z" fill="#2A343B" opacity="0.85" />

    <!-- 車頭燈（LED 晶鑽白光） -->
    <path d="M 28 19 Q 32 16 39 16 L 37 21 Q 31 21 28 24 Z" fill="#E8FFDE" />
    <path d="M 92 19 Q 88 16 81 16 L 83 21 Q 89 21 92 24 Z" fill="#E8FFDE" />

    <!-- 引擎蓋金屬漆面斜向高光與細節 -->
    <!-- 引擎蓋兩側細微壓線 -->
    <path d="M 37 22 L 35 50" stroke="#520B0B" stroke-width="1.5" stroke-opacity="0.6" stroke-linecap="round" />
    <path d="M 83 22 L 85 50" stroke="#520B0B" stroke-width="1.5" stroke-opacity="0.6" stroke-linecap="round" />
    
    <!-- 引擎蓋左側斜向高光反光（重現金屬漆面質感） -->
    <g opacity="0.75">
      <path d="M 36 24 L 54 24 L 30 52 L 28 44 Z" fill="#FF9E9E" />
      <line x1="38" y1="23" x2="26" y2="48" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.65" stroke-linecap="round" />
      <line x1="45" y1="23" x2="31" y2="50" stroke="#FFD1D1" stroke-width="1.2" stroke-opacity="0.5" stroke-linecap="round" />
    </g>

    <!-- 前擋風玻璃 (glassGrad) -->
    <path d="M 32 54 Q 60 49 88 54 L 84 70 Q 60 66 36 70 Z" fill="url(#glassGrad)" stroke="#11161A" stroke-width="1" />
    <!-- 前擋風玻璃斜向白色反光條 -->
    <g clip-path="url(#windshieldClip)">
      <polygon points="36,48 48,48 34,74 22,74" fill="#FFFFFF" fill-opacity="0.15" />
      <polygon points="53,48 58,48 44,74 39,74" fill="#FFFFFF" fill-opacity="0.15" />
    </g>

    <!-- 左右側車窗 -->
    <path d="M 29 58 L 34 71 L 34 103 L 29 109 Q 28 83 29 58 Z" fill="url(#glassGrad)" />
    <path d="M 91 58 L 86 71 L 86 103 L 91 109 Q 92 83 91 58 Z" fill="url(#glassGrad)" />

    <!-- 車頂頂蓋漸層 (roofRedGrad) -->
    <rect x="35" y="70" width="50" height="34" rx="5" ry="5" fill="url(#roofRedGrad)" stroke="#520B0B" stroke-width="0.8" stroke-opacity="0.6" />
    
    <!-- 車頂左側斜向高光反光 -->
    <g clip-path="url(#roofClip)" opacity="0.6">
      <path d="M 37 72 L 50 72 L 40 96 L 37 96 Z" fill="#FFFFFF" fill-opacity="0.4" />
    </g>
    <!-- 車頂兩側導水槽加強立體線條 -->
    <line x1="40" y1="72" x2="40" y2="102" stroke="#520B0B" stroke-width="1" stroke-opacity="0.5" stroke-linecap="round" />
    <line x1="80" y1="72" x2="80" y2="102" stroke="#520B0B" stroke-width="1" stroke-opacity="0.5" stroke-linecap="round" />

    <!-- 後擋風玻璃 (glassGrad) -->
    <path d="M 36 105 Q 60 107 84 105 L 86 112 Q 60 114 34 112 Z" fill="url(#glassGrad)" stroke="#11161A" stroke-width="0.8" />
    <!-- 後擋風玻璃斜向反光條 -->
    <g clip-path="url(#rearWindowClip)">
      <polygon points="44,103 53,103 46,116 37,116" fill="#FFFFFF" fill-opacity="0.15" />
    </g>

    <!-- 皮卡車後貨斗 (Truck Bed) -->
    <rect x="33" y="116" width="54" height="43" rx="3" ry="3" fill="url(#bedGrad)" stroke="#520B0B" stroke-width="1.2" />
    <!-- 貨斗防滑底板直向壓紋 -->
    <g stroke="#37434D" stroke-width="1.5" stroke-opacity="0.7">
      <line x1="41" y1="119" x2="41" y2="156" />
      <line x1="48.5" y1="119" x2="48.5" y2="156" />
      <line x1="56" y1="119" x2="56" y2="156" />
      <line x1="64" y1="119" x2="64" y2="156" />
      <line x1="71.5" y1="119" x2="71.5" y2="156" />
      <line x1="79" y1="119" x2="79" y2="156" />
    </g>
    <!-- 貨斗兩側護欄內緣高光 -->
    <line x1="33" y1="117" x2="33" y2="158" stroke="#FF9E9E" stroke-width="1" stroke-opacity="0.5" />
    <line x1="87" y1="117" x2="87" y2="158" stroke="#FF9E9E" stroke-width="1" stroke-opacity="0.5" />

    <!-- 車尾門高光折線 -->
    <line x1="36" y1="162" x2="84" y2="162" stroke="#FF9E9E" stroke-width="1.2" stroke-opacity="0.6" stroke-linecap="round" />

    <!-- 車尾燈（警示紅光） -->
    <path d="M 27 156 L 30 156 L 30 163 Q 27 162 27 159 Z" fill="#FF4D4D" />
    <path d="M 93 156 L 90 156 L 90 163 Q 93 162 93 159 Z" fill="#FF4D4D" />
    <!-- 車頂第三煞車燈細節 -->
    <rect x="53" y="103.5" width="14" height="1.5" rx="0.75" fill="#FF4D4D" />

  </g>
</svg>