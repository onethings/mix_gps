<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 180" width="120" height="180">
  <defs>
    <!-- 1. 車身主體多段金屬烤漆橫向漸層 (深酒紅 #7D1111 到亮寶石紅 #E33939) -->
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7D1111" />
      <stop offset="22%" stop-color="#B82222" />
      <stop offset="48%" stop-color="#E33939" />
      <stop offset="55%" stop-color="#F25252" />
      <stop offset="78%" stop-color="#B82222" />
      <stop offset="100%" stop-color="#690C0C" />
    </linearGradient>

    <!-- 2. 車頂頂蓋金屬烤漆光影漸層 -->
    <linearGradient id="roofGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7878" stop-opacity="0.85" />
      <stop offset="45%" stop-color="#D62929" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#7D1111" stop-opacity="0.9" />
    </linearGradient>

    <!-- 3. 車窗玻璃反光漸層 -->
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E262C" />
      <stop offset="35%" stop-color="#37434D" />
      <stop offset="70%" stop-color="#222B32" />
      <stop offset="100%" stop-color="#11161A" />
    </linearGradient>

    <!-- 復古機械散熱風扇與金屬飾條漸層 -->
    <radialGradient id="fanGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#11161A" />
      <stop offset="65%" stop-color="#222B32" />
      <stop offset="100%" stop-color="#37434D" />
    </radialGradient>

    <!-- 4. 停車狀態光暈濾鏡 (parkedRedGlow：柔和暗紅色擴散光暈 + 底部立體投影) -->
    <filter id="parkedRedGlow" x="-35%" y="-30%" width="170%" height="160%">
      <!-- 外層柔和暗紅色擴散光暈 -->
      <feMorphology in="SourceAlpha" operator="dilate" radius="2" result="dilated" />
      <feGaussianBlur in="dilated" stdDeviation="6" result="redBlur" />
      <feFlood flood-color="#991111" flood-opacity="0.55" result="redColor" />
      <feComposite in="redColor" in2="redBlur" operator="in" result="outerRedGlow" />

      <!-- 內層緊緻寶石紅高亮度光環，強化淺色地圖邊界 -->
      <feGaussianBlur in="SourceAlpha" stdDeviation="2.5" result="tightBlur" />
      <feFlood flood-color="#E33939" flood-opacity="0.45" result="innerColor" />
      <feComposite in="innerColor" in2="tightBlur" operator="in" result="innerRedGlow" />

      <!-- 底部立體陰影 -->
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#2B0505" flood-opacity="0.45" result="baseShadow" />

      <feMerge>
        <feMergeNode in="outerRedGlow" />
        <feMergeNode in="innerRedGlow" />
        <feMergeNode in="baseShadow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- 裁切路徑：雙片式駕駛窗斜向反光 -->
    <clipPath id="vintageGlassClip">
      <path d="M 38 49 Q 48 43 58 46 L 58 57 Q 48 55 37 59 Z" />
      <path d="M 82 49 Q 72 43 62 46 L 62 57 Q 72 55 83 59 Z" />
    </clipPath>

    <!-- 裁切路徑：車身與車頂左側斜向金屬漆面高光 -->
    <clipPath id="bodySpecularClip">
      <path d="M 34 48 C 34 28, 43 17, 60 17 C 77 17, 86 28, 86 48 L 86 156 C 86 160, 83 162, 79 162 L 41 162 C 37 162, 34 160, 34 156 Z" />
    </clipPath>
    <clipPath id="roofSpecularClip">
      <rect x="41" y="62" width="38" height="94" rx="5" />
    </clipPath>
  </defs>

  <!-- 車輛主群組 (套用停車狀態暗紅光暈 parkedRedGlow，幾何中心精準對齊 60, 90) -->
  <g filter="url(#parkedRedGlow)">

    <!-- 50年代經典結構：前後外露式防撞排障器 / 緩衝器與車鉤 -->
    <path d="M 41 18 Q 60 11 79 18 L 76 24 L 44 24 Z" fill="#5E0B0B" stroke="#1E262C" stroke-width="1" />
    <rect x="57" y="10" width="6" height="6" rx="1.5" fill="#222B32" stroke="#11161A" stroke-width="1" />
    
    <!-- 車尾連接廊道與緩衝器 -->
    <rect x="46" y="160" width="28" height="6" rx="1" fill="#222B32" stroke="#11161A" stroke-width="1" />
    <rect x="57" y="165" width="6" height="5" rx="1.5" fill="#222B32" stroke="#11161A" stroke-width="1" />

    <!-- 車身外殼主體 (深酒紅到亮寶石紅金屬烤漆) -->
    <path d="M 34 48 
             C 34 28, 43 17, 60 17 
             C 77 17, 86 28, 86 48 
             L 86 156 
             C 86 160, 83 162, 79 162 
             L 41 162 
             C 37 162, 34 160, 34 156 Z" fill="url(#bodyGrad)" stroke="#590909" stroke-width="2" />

    <!-- 金屬烤漆質感：引擎蓋左側斜向高光反光帶 -->
    <g clip-path="url(#bodySpecularClip)">
      <polygon points="32,48 48,16 57,16 39,51" fill="#FF9E9E" fill-opacity="0.32" />
      <polygon points="41,49 59,16 62,16 44,50" fill="#FFFFFF" fill-opacity="0.22" />
    </g>

    <!-- 50年代短鼻引擎蓋 (Bulldog Nose) 凸起輪廓與壓線 -->
    <path d="M 40 44 C 42 29, 50 22, 60 22 C 70 22, 78 29, 80 44" fill="none" stroke="#660C0C" stroke-width="1.3" stroke-opacity="0.6" />
    
    <!-- 短鼻引擎蓋中央高光反光線 -->
    <path d="M 46 39 C 49 29, 54 25, 60 25 C 66 25, 71 29, 74 39" fill="none" stroke="#FF8A8A" stroke-width="2.2" stroke-linecap="round" stroke-opacity="0.7" />
    <ellipse cx="58" cy="33" rx="4.5" ry="6" fill="#FFB3B3" fill-opacity="0.35" />

    <!-- 50年代經典特徵：車鼻正中央單顆大型圓形探照頭燈 (停車狀態為柔和暖白微光) -->
    <rect x="55" y="16" width="10" height="6" rx="3" fill="#590909" />
    <ellipse cx="60" cy="18.5" rx="3.5" ry="2.2" fill="#FFF2F2" />

    <!-- 50年代經典特徵：高挑雙片式駕駛艙擋風玻璃 -->
    <path d="M 38 49 Q 48 43 58 46 L 58 57 Q 48 55 37 59 Z" fill="url(#glassGrad)" stroke="#11161A" stroke-width="1.2" />
    <path d="M 82 49 Q 72 43 62 46 L 62 57 Q 72 55 83 59 Z" fill="url(#glassGrad)" stroke="#11161A" stroke-width="1.2" />

    <!-- 擋風玻璃斜向白色反光條 -->
    <g clip-path="url(#vintageGlassClip)">
      <polygon points="35,61 46,41 51,41 40,61" fill="#FFFFFF" fill-opacity="0.2" />
      <polygon points="62,61 73,41 78,41 67,61" fill="#FFFFFF" fill-opacity="0.2" />
    </g>

    <!-- 駕駛室側邊三角窗與機械室圓形舷窗 -->
    <rect x="34.5" y="64" width="2.2" height="14" rx="1" fill="url(#glassGrad)" />
    <rect x="83.3" y="64" width="2.2" height="14" rx="1" fill="url(#glassGrad)" />
    <circle cx="35.5" cy="96" r="1.5" fill="#1E262C" />
    <circle cx="35.5" cy="122" r="1.5" fill="#1E262C" />
    <circle cx="84.5" cy="96" r="1.5" fill="#1E262C" />
    <circle cx="84.5" cy="122" r="1.5" fill="#1E262C" />

    <!-- 車頂主體高光區域 (套用 roofGrad) -->
    <rect x="41" y="62" width="38" height="94" rx="5" fill="url(#roofGrad)" />

    <!-- 金屬烤漆質感：車頂左側斜向漆面高光反光帶 -->
    <g clip-path="url(#roofSpecularClip)">
      <polygon points="38,96 54,60 63,60 44,104" fill="#FF9E9E" fill-opacity="0.28" />
      <polygon points="45,106 65,60 68,60 48,110" fill="#FFFFFF" fill-opacity="0.18" />
      <polygon points="38,142 56,102 62,102 42,148" fill="#FF9E9E" fill-opacity="0.2" />
    </g>

    <!-- 車頂兩側走道防滑扶手與壓線 -->
    <line x1="39.5" y1="62" x2="39.5" y2="156" stroke="#660C0C" stroke-width="1.2" stroke-opacity="0.6" />
    <line x1="80.5" y1="62" x2="80.5" y2="156" stroke="#660C0C" stroke-width="1.2" stroke-opacity="0.6" />

    <!-- 車頂三組大型圓形散熱風扇鼓包 -->
    <!-- 第一組散熱風扇 -->
    <g transform="translate(60, 78)">
      <circle r="10.5" fill="url(#fanGrad)" stroke="#590909" stroke-width="1.5" />
      <circle r="8.5" fill="none" stroke="#FF8A8A" stroke-width="0.7" stroke-opacity="0.5" />
      <path d="M -6 -2 L 6 2 M -2 6 L 2 -6 M -5 4 L 5 -4 M -4 -5 L 4 5" stroke="#B82222" stroke-width="1.2" stroke-opacity="0.75" />
      <circle r="2.5" fill="#E33939" stroke="#1E262C" stroke-width="0.8" />
    </g>

    <!-- 引擎室排氣煙囪 -->
    <rect x="53" y="94" width="5" height="9" rx="2" fill="#1E262C" stroke="#590909" stroke-width="1" />
    <rect x="62" y="94" width="5" height="9" rx="2" fill="#1E262C" stroke="#590909" stroke-width="1" />

    <!-- 第二組散熱風扇 -->
    <g transform="translate(60, 118)">
      <circle r="10.5" fill="url(#fanGrad)" stroke="#590909" stroke-width="1.5" />
      <circle r="8.5" fill="none" stroke="#FF8A8A" stroke-width="0.7" stroke-opacity="0.5" />
      <path d="M -6 -2 L 6 2 M -2 6 L 2 -6 M -5 4 L 5 -4 M -4 -5 L 4 5" stroke="#B82222" stroke-width="1.2" stroke-opacity="0.75" />
      <circle r="2.5" fill="#E33939" stroke="#1E262C" stroke-width="0.8" />
    </g>

    <!-- 第三組散熱風扇 -->
    <g transform="translate(60, 143)">
      <circle r="9.5" fill="url(#fanGrad)" stroke="#590909" stroke-width="1.5" />
      <circle r="7.5" fill="none" stroke="#FF8A8A" stroke-width="0.7" stroke-opacity="0.5" />
      <path d="M -5 -2 L 5 2 M -2 5 L 2 -5 M -4 4 L 4 -4" stroke="#B82222" stroke-width="1.2" stroke-opacity="0.75" />
      <circle r="2.2" fill="#E33939" stroke="#1E262C" stroke-width="0.8" />
    </g>

    <!-- 車頭輔助標誌燈與車尾警示紅燈 -->
    <circle cx="43" cy="23" r="1.8" fill="#FFF2F2" />
    <circle cx="77" cy="23" r="1.8" fill="#FFF2F2" />

    <!-- 車尾雙側警示紅燈 -->
    <rect x="38" y="159" width="5" height="2.5" rx="1" fill="#FF4D4D" />
    <rect x="77" y="159" width="5" height="2.5" rx="1" fill="#FF4D4D" />

  </g>
</svg>