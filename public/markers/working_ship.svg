<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 180" width="120" height="180">
  <defs>
    <!-- 船身主體漸層 (鈷藍 #2D5FBD 到 亮天藍 #87B8FF 的橫向立體金屬漸層) -->
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2D5FBD" />
      <stop offset="22%" stop-color="#588EE6" />
      <stop offset="50%" stop-color="#87B8FF" />
      <stop offset="78%" stop-color="#588EE6" />
      <stop offset="100%" stop-color="#244FA1" />
    </linearGradient>

    <!-- 艦橋頂蓋漸層 (垂直金屬烤漆光影) -->
    <linearGradient id="roofGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#B8D8FF" stop-opacity="0.92" />
      <stop offset="100%" stop-color="#3B71D4" stop-opacity="0.85" />
    </linearGradient>

    <!-- 艦橋玻璃漸層 (保留深色反光玻璃質感) -->
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E262C" />
      <stop offset="35%" stop-color="#37434D" />
      <stop offset="70%" stop-color="#222B32" />
      <stop offset="100%" stop-color="#11161A" />
    </linearGradient>

    <!-- 冰藍色斜向高光漸層 -->
    <linearGradient id="iceBlueSheen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EBF5FF" stop-opacity="0.48" />
      <stop offset="45%" stop-color="#B8DCFF" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <!-- 船體輪廓裁切遮罩 (限制斜向高光不超出船體輪廓) -->
    <clipPath id="hullClip">
      <path d="M 60,8
               C 82,18 96,42 96,68
               L 96,148
               C 96,161 88,169 76,170
               L 44,170
               C 32,169 24,161 24,148
               L 24,68
               C 24,42 38,18 60,8 Z" />
    </clipPath>

    <!-- 玻璃斜向反光條遮罩 -->
    <clipPath id="bridgeFrontGlassClip">
      <path d="M 30,98 Q 60,92 90,98 L 86,109 Q 60,105 34,109 Z" />
    </clipPath>
    <clipPath id="bridgeRearGlassClip">
      <path d="M 35,137 Q 60,140 85,137 L 87,144 Q 60,147 33,144 Z" />
    </clipPath>

    <!-- 柔和深藍色底部懸浮陰影濾鏡 -->
    <filter id="dropShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5" />
      <feOffset dx="0" dy="5" result="offsetblur" />
      <feFlood flood-color="#0D224D" flood-opacity="0.38" />
      <feComposite in2="offsetblur" operator="in" />
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- 整體套用柔和深藍色底部陰影，背景 100% 透明，中心點精準對齊 (60, 90) -->
  <g filter="url(#dropShadow)">

    <!-- 1. 大型船舶主輪廓 (結構與方向與上圖完全一致) -->
    <path d="M 60,8
             C 82,18 96,42 96,68
             L 96,148
             C 96,161 88,169 76,170
             L 44,170
             C 32,169 24,161 24,148
             L 24,68
             C 24,42 38,18 60,8 Z" fill="url(#bodyGrad)" stroke="#1D438A" stroke-width="2.2" stroke-linejoin="round" />

    <!-- 船首左側冰藍色斜向高光反光帶 -->
    <g clip-path="url(#hullClip)">
      <polygon points="34,12 58,12 30,92 18,92" fill="url(#iceBlueSheen)" />
      <polygon points="62,12 69,12 41,92 34,92" fill="#E6F2FF" opacity="0.22" />
    </g>

    <!-- 內舷牆邊線 -->
    <path d="M 60,13
             C 79,22 91,44 91,68
             L 91,146
             C 91,157 84,164 74,165
             L 46,165
             C 36,164 29,157 29,146
             L 29,68
             C 29,44 41,22 60,13 Z" fill="none" stroke="#244FA1" stroke-width="1" opacity="0.55" />

    <!-- 2. 船首前甲板高光與大型貨艙/甲板結構 -->
    <!-- 船首中央折線冰藍高光 -->
    <path d="M 60,14 L 60,44" stroke="#CFE5FF" stroke-width="2.8" stroke-linecap="round" opacity="0.78" />
    <!-- 船首兩側細微壓線 -->
    <path d="M 45,25 Q 39,37 37,50" fill="none" stroke="#244FA1" stroke-width="1.3" stroke-linecap="round" opacity="0.5" />
    <path d="M 75,25 Q 81,37 83,50" fill="none" stroke="#244FA1" stroke-width="1.3" stroke-linecap="round" opacity="0.5" />

    <!-- 前甲板雙段式大型貨艙蓋 / 設施區 -->
    <rect x="37" y="48" width="46" height="19" rx="3" fill="#3B71D4" fill-opacity="0.35" stroke="#244FA1" stroke-width="1.1" stroke-opacity="0.6" />
    <line x1="60" y1="48" x2="60" y2="67" stroke="#CFE5FF" stroke-width="1.5" opacity="0.7" />

    <rect x="36" y="71" width="48" height="20" rx="3" fill="#3B71D4" fill-opacity="0.35" stroke="#244FA1" stroke-width="1.1" stroke-opacity="0.6" />
    <line x1="60" y1="71" x2="60" y2="91" stroke="#CFE5FF" stroke-width="1.5" opacity="0.7" />

    <!-- 3. 大型上層建築 / 駕駛艦橋 -->
    <!-- 艦橋翼橋基底 -->
    <rect x="26" y="99" width="68" height="11" rx="2.5" fill="url(#bodyGrad)" stroke="#1D438A" stroke-width="1.3" />

    <!-- 主艦橋側窗 (左/右) -->
    <path d="M 32,108 L 35,112 L 35,135 L 32,139 C 30,129 30,118 32,108 Z" fill="url(#glassGrad)" />
    <path d="M 88,108 L 85,112 L 85,135 L 88,139 C 90,129 90,118 88,108 Z" fill="url(#glassGrad)" />

    <!-- 4. 艦橋前側全景駕駛艙玻璃 -->
    <path d="M 30,98 Q 60,92 90,98 L 86,109 Q 60,105 34,109 Z" fill="url(#glassGrad)" stroke="#11161A" stroke-width="0.9" />
    <g clip-path="url(#bridgeFrontGlassClip)">
      <polygon points="36,90 46,90 34,113 24,113" fill="#FFFFFF" opacity="0.15" />
      <polygon points="52,90 57,90 45,113 40,113" fill="#FFFFFF" opacity="0.15" />
      <polygon points="72,90 78,90 66,113 60,113" fill="#FFFFFF" opacity="0.15" />
    </g>

    <!-- 艦橋後側觀景窗 -->
    <path d="M 35,137 Q 60,140 85,137 L 87,144 Q 60,147 33,144 Z" fill="url(#glassGrad)" stroke="#11161A" stroke-width="0.8" />
    <g clip-path="url(#bridgeRearGlassClip)">
      <polygon points="48,134 57,134 45,149 36,149" fill="#FFFFFF" opacity="0.15" />
    </g>

    <!-- 5. 艦橋頂蓋 (roofGrad 垂直光影 + 左側冰藍色斜向高光反光) -->
    <rect x="35" y="109" width="50" height="28" rx="4" fill="url(#roofGrad)" stroke="#2D5FBD" stroke-width="1.1" />
    <!-- 頂蓋受光高光區 -->
    <rect x="40" y="112" width="40" height="9" rx="2.5" fill="#CFE5FF" opacity="0.5" />
    <!-- 頂蓋左側冰藍色斜向金屬高光條 -->
    <polygon points="39,110 51,110 41,136 36,136" fill="#EBF5FF" opacity="0.32" />
    <!-- 導航雷達橫桿與煙囪底座 -->
    <rect x="52" y="115" width="16" height="3" rx="1.5" fill="#FFFFFF" opacity="0.75" />
    <rect x="54" y="125" width="12" height="9" rx="2.5" fill="#1D438A" opacity="0.8" />

    <!-- 6. 船尾工作甲板與繫纜細節 -->
    <line x1="38" y1="152" x2="82" y2="152" stroke="#1D438A" stroke-width="1.2" stroke-linecap="round" opacity="0.5" />
    <line x1="42" y1="158" x2="78" y2="158" stroke="#1D438A" stroke-width="1.2" stroke-linecap="round" opacity="0.5" />

    <!-- 7. 船首探照燈 / 航行前燈 (LED 冰晶白光) -->
    <ellipse cx="44" cy="21" rx="2.2" ry="4.5" transform="rotate(-28 44 21)" fill="#EDF6FF" />
    <ellipse cx="76" cy="21" rx="2.2" ry="4.5" transform="rotate(28 76 21)" fill="#EDF6FF" />
    <!-- 船首頂端主桅燈 -->
    <circle cx="60" cy="12" r="2" fill="#EDF6FF" />

    <!-- 8. 船尾警示燈 (鮮紅色 #FF4D4D) -->
    <path d="M 38,167.5 L 52,168" fill="none" stroke="#FF4D4D" stroke-width="2.8" stroke-linecap="round" />
    <path d="M 82,167.5 L 68,168" fill="none" stroke="#FF4D4D" stroke-width="2.8" stroke-linecap="round" />

  </g>
</svg>