<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- 行駛/動態狀態：柔和草綠色微光暈（背景保持 100% 透明） -->
    <filter id="movingGreenGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4.5" result="blurOuter" />
      <feFlood flood-color="#3D8A24" flood-opacity="0.38" result="colorOuter" />
      <feComposite in="colorOuter" in2="blurOuter" operator="in" result="glowOuter" />
      
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.8" result="blurInner" />
      <feFlood flood-color="#58B838" flood-opacity="0.48" result="colorInner" />
      <feComposite in="colorInner" in2="blurInner" operator="in" result="glowInner" />
      
      <feMerge>
        <feMergeNode in="glowOuter" />
        <feMergeNode in="glowInner" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- 水平五段柱狀金屬/烤漆受光漸層（左暗部 -> 左過渡 -> 正中央最高光 -> 右過渡 -> 右暗部） -->
    <linearGradient id="movingGreenBody" x1="0%" y1="0%" x2="100%" y2="0%">
      <!-- 左側陰影邊緣 -->
      <stop offset="0%" stop-color="#58B838" />
      <!-- 左側光澤過渡 -->
      <stop offset="26%" stop-color="#7EE05A" />
      <!-- 正中央（最高光處） -->
      <stop offset="50%" stop-color="#96F272" />
      <!-- 右側光澤過渡 -->
      <stop offset="74%" stop-color="#7EE05A" />
      <!-- 右側陰影邊緣 -->
      <stop offset="100%" stop-color="#4FA832" />
    </linearGradient>

    <!-- 中心箭頭專用水平對稱受光漸層（對應箭頭寬度範圍，確保正中央脊線落在 #96F272） -->
    <linearGradient id="arrowGreenBody" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58B838" />
      <stop offset="28%" stop-color="#7EE05A" />
      <stop offset="50%" stop-color="#96F272" />
      <stop offset="72%" stop-color="#7EE05A" />
      <stop offset="100%" stop-color="#4FA832" />
    </linearGradient>

    <!-- 頂部清漆光澤高光漸層 -->
    <linearGradient id="topGlossHighlight" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.52" />
      <stop offset="45%" stop-color="#D8FFCA" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <!-- 裁切路徑：確保清漆高光只作用在圓環與箭頭本體上 -->
    <clipPath id="greenIconClip">
      <path fill-rule="evenodd" d="M64,14 A50,50 0 1,0 64,114 A50,50 0 1,0 64,14 Z M64,22 A42,42 0 1,1 64,106 A42,42 0 1,1 64,22 Z" />
      <path d="M64,37 C65.8,37 67.3,38.1 68.2,39.8 L86.5,75.8 C87.8,78.4 85.4,81.2 82.6,80.2 L65.5,74.1 C64.5,73.7 63.5,73.7 62.5,74.1 L45.4,80.2 C42.6,81.2 40.2,78.4 41.5,75.8 L59.8,39.8 C60.7,38.1 62.2,37 64,37 Z" />
    </clipPath>
  </defs>

  <!-- 主圖層（背景 100% 透明） -->
  <g filter="url(#movingGreenGlow)">
    <!-- 1. 外圓環主體 + 深綠色外框線條 (#3D8A24) -->
    <path fill-rule="evenodd" d="M64,14 A50,50 0 1,0 64,114 A50,50 0 1,0 64,14 Z M64,22 A42,42 0 1,1 64,106 A42,42 0 1,1 64,22 Z" fill="url(#movingGreenBody)" stroke="#3D8A24" stroke-width="1.5" stroke-linejoin="round" />

    <!-- 2. 中心導航箭頭主體 + 深綠色外框線條 (#3D8A24) -->
    <path d="M64,37 C65.8,37 67.3,38.1 68.2,39.8 L86.5,75.8 C87.8,78.4 85.4,81.2 82.6,80.2 L65.5,74.1 C64.5,73.7 63.5,73.7 62.5,74.1 L45.4,80.2 C42.6,81.2 40.2,78.4 41.5,75.8 L59.8,39.8 C60.7,38.1 62.2,37 64,37 Z" fill="url(#arrowGreenBody)" stroke="#3D8A24" stroke-width="1.5" stroke-linejoin="round" />

    <!-- 3. 頂部與中央受光面清漆反光層 -->
    <g clip-path="url(#greenIconClip)">
      <!-- 上半部柔和清漆反光 -->
      <ellipse cx="64" cy="36" rx="46" ry="32" fill="url(#topGlossHighlight)" />
      <!-- 箭頭正中央脊線高光（強化立體稜線感） -->
      <line x1="64" y1="39.5" x2="64" y2="72" stroke="#D8FFCA" stroke-width="1.4" stroke-linecap="round" opacity="0.7" />
    </g>
  </g>
</svg>