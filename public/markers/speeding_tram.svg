<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <!-- 柔和的深焦糖棕底部懸浮陰影 -->
    <filter id="dropShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5" />
      <feOffset dx="0" dy="3" result="offsetblur" />
      <feFlood flood-color="#3D1704" flood-opacity="0.38" />
      <feComposite in2="offsetblur" operator="in" />
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- 車身主體橫向金屬漸層：深琥珀橙 (#B84108) 至 亮陽光金橙 (#FF9A3C) -->
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B84108" />
      <stop offset="22%" stop-color="#EB6B1A" />
      <stop offset="50%" stop-color="#FF9A3C" />
      <stop offset="78%" stop-color="#E66314" />
      <stop offset="100%" stop-color="#A63805" />
    </linearGradient>

    <!-- 車頂頂蓋垂直金屬橙漸層 -->
    <linearGradient id="roofGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFC685" stop-opacity="0.94" />
      <stop offset="48%" stop-color="#F77B25" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#BD450A" stop-opacity="0.88" />
    </linearGradient>

    <!-- 車窗玻璃漸層 (glassGrad) -->
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E262C" />
      <stop offset="40%" stop-color="#37434D" />
      <stop offset="70%" stop-color="#222B32" />
      <stop offset="100%" stop-color="#11161A" />
    </linearGradient>

    <!-- 引擎蓋金屬橙反光漸層 -->
    <linearGradient id="hoodHighlight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE4C4" stop-opacity="0.75" />
      <stop offset="55%" stop-color="#FFB36B" stop-opacity="0.32" />
      <stop offset="100%" stop-color="#FF8C24" stop-opacity="0.06" />
    </linearGradient>

    <!-- 左側斜向暖金高光反光漸層 -->
    <linearGradient id="orangeSheenLeft" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFF0DB" stop-opacity="0.48" />
      <stop offset="60%" stop-color="#FFC285" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#FFF0DB" stop-opacity="0" />
    </linearGradient>

    <!-- 裁切路徑：車窗與車頂反光條用 -->
    <clipPath id="frontGlassClip">
      <path d="M 48 16 Q 60 14 72 16 L 75 23 Q 60 21 45 23 Z" />
    </clipPath>
    <clipPath id="rearGlassClip">
      <path d="M 45 97 Q 60 99 75 97 L 72 104 Q 60 106 48 104 Z" />
    </clipPath>
    <clipPath id="roofClip">
      <rect x="50" y="37" width="20" height="46" rx="2.5" />
    </clipPath>
  </defs>

  <!-- 整體置中 (中心點 60, 60)，套用深焦糖棕底部懸浮陰影 -->
  <g filter="url(#dropShadow)">
    <!-- 車身外殼（搭配深赤褐色外框線確保地圖輪廓清晰） -->
    <path d="
      M 49 12
      Q 60 10 71 12
      C 76 14 78 21 78 29
      L 78 91
      C 78 99 76 106 71 108
      Q 60 110 49 108
      C 44 106 42 99 42 91
      L 42 29
      C 42 21 44 14 49 12 Z" fill="url(#bodyGrad)" stroke="#7A2804" stroke-width="1.4" />

    <!-- 車身左側圓弧暖金金屬光澤帶 -->
    <path d="
      M 46.5 16
      C 44.5 20 44 25 44 31
      L 44 89
      C 44 95 44.5 100 46.5 104
      L 49.5 102
      C 48 98 47.5 94 47.5 89
      L 47.5 31
      C 47.5 26 48 22 49.5 18 Z" fill="url(#orangeSheenLeft)" />

    <!-- 車頭燈 (LED 晶鑽暖白光) -->
    <path d="M 47 13.5 Q 49.5 12.8 52 13.2 L 51 15.2 Q 48.5 15 46.5 15.5 Z" fill="#FFF8ED" />
    <path d="M 73 13.5 Q 70.5 12.8 68 13.2 L 69 15.2 Q 71.5 15 73.5 15.5 Z" fill="#FFF8ED" />

    <!-- 車尾燈 (警示紅光) -->
    <path d="M 46.5 104.5 Q 48.5 105 51 104.8 L 52 106.8 Q 49.5 107.2 47 106.5 Z" fill="#FF3B30" />
    <path d="M 73.5 104.5 Q 71.5 105 69 104.8 L 68 106.8 Q 70.5 107.2 73 106.5 Z" fill="#FF3B30" />

    <!-- 前擋風玻璃與左右三角窗 -->
    <path d="M 48 16 Q 60 14 72 16 L 75 23 Q 60 21 45 23 Z" fill="url(#glassGrad)" stroke="#1E262C" stroke-width="0.6" />
    <path d="M 45.5 16.8 L 44 23.5 L 43 23.5 C 43 19.5 44 17.5 45.5 16.8 Z" fill="url(#glassGrad)" />
    <path d="M 74.5 16.8 L 76 23.5 L 77 23.5 C 77 19.5 76 17.5 74.5 16.8 Z" fill="url(#glassGrad)" />

    <!-- 前擋斜向白色高光條 -->
    <g clip-path="url(#frontGlassClip)">
      <polygon points="48,25 55,13 58,13 51,25" fill="#FFFFFF" fill-opacity="0.16" />
      <polygon points="54,25 61,13 62.5,13 55.5,25" fill="#FFFFFF" fill-opacity="0.16" />
    </g>

    <!-- 後擋風玻璃與左右三角窗 -->
    <path d="M 45 97 Q 60 99 75 97 L 72 104 Q 60 106 48 104 Z" fill="url(#glassGrad)" stroke="#1E262C" stroke-width="0.6" />
    <path d="M 45.5 103.2 L 44 96.5 L 43 96.5 C 43 100.5 44 102.5 45.5 103.2 Z" fill="url(#glassGrad)" />
    <path d="M 74.5 103.2 L 76 96.5 L 77 96.5 C 77 100.5 76 102.5 74.5 103.2 Z" fill="url(#glassGrad)" />

    <!-- 後擋斜向白色高光條 -->
    <g clip-path="url(#rearGlassClip)">
      <polygon points="56,106 63,95 66,95 59,106" fill="#FFFFFF" fill-opacity="0.16" />
      <polygon points="62,106 69,95 70.5,95 63.5,106" fill="#FFFFFF" fill-opacity="0.16" />
    </g>

    <!-- 引擎蓋折線反光、左側暖金高光與兩側細微壓線 -->
    <polygon points="49,24.5 71,24.5 68,34 52,34" fill="url(#hoodHighlight)" />
    <!-- 引擎蓋左側暖金斜向高光反光 -->
    <polygon points="49.5,24.5 55.5,24.5 53,34 51,34" fill="#FFF3E0" fill-opacity="0.45" />
    <path d="M 47.5 24.5 L 46 35.5" stroke="#8C3106" stroke-opacity="0.6" stroke-width="0.9" fill="none" stroke-linecap="round" />
    <path d="M 72.5 24.5 L 74 35.5" stroke="#8C3106" stroke-opacity="0.6" stroke-width="0.9" fill="none" stroke-linecap="round" />

    <!-- 車尾蓋折線反光與兩側壓線 -->
    <polygon points="52,86 68,86 71,95.5 49,95.5" fill="url(#hoodHighlight)" opacity="0.6" />
    <path d="M 46 84.5 L 47.5 95.5" stroke="#8C3106" stroke-opacity="0.6" stroke-width="0.9" fill="none" stroke-linecap="round" />
    <path d="M 74 84.5 L 72.5 95.5" stroke="#8C3106" stroke-opacity="0.6" stroke-width="0.9" fill="none" stroke-linecap="round" />

    <!-- 左側車窗 (3扇精簡比例) -->
    <rect x="43" y="34" width="2.5" height="14" rx="1" fill="url(#glassGrad)" />
    <rect x="43" y="53" width="2.5" height="14" rx="1" fill="url(#glassGrad)" />
    <rect x="43" y="72" width="2.5" height="14" rx="1" fill="url(#glassGrad)" />
    <!-- 左側窗反光 -->
    <line x1="43" y1="42" x2="45.5" y2="39" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="1" />
    <line x1="43" y1="61" x2="45.5" y2="58" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="1" />
    <line x1="43" y1="80" x2="45.5" y2="77" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="1" />

    <!-- 右側車窗 (3扇精簡比例) -->
    <rect x="74.5" y="34" width="2.5" height="14" rx="1" fill="url(#glassGrad)" />
    <rect x="74.5" y="53" width="2.5" height="14" rx="1" fill="url(#glassGrad)" />
    <rect x="74.5" y="72" width="2.5" height="14" rx="1" fill="url(#glassGrad)" />
    <!-- 右側窗反光 -->
    <line x1="74.5" y1="42" x2="77" y2="39" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="1" />
    <line x1="74.5" y1="61" x2="77" y2="58" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="1" />
    <line x1="74.5" y1="80" x2="77" y2="77" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="1" />

    <!-- 車頂深琥珀框線與車頂頂蓋 -->
    <rect x="48" y="35" width="24" height="50" rx="3.5" fill="#852E05" />
    <rect x="50" y="37" width="20" height="46" rx="2.5" fill="url(#roofGrad)" />

    <!-- 車頂左側暖金斜向高光反光 -->
    <g clip-path="url(#roofClip)">
      <polygon points="48,54 62,36 67,36 52,55" fill="#FFF3E0" fill-opacity="0.38" />
      <polygon points="48,61 69,36 71,36 49,63" fill="#FFF3E0" fill-opacity="0.2" />
    </g>

    <!-- 車頂分隔線 -->
    <line x1="50" y1="60" x2="70" y2="60" stroke="#852E05" stroke-width="1" />

    <!-- 集電弓 (Pantograph) 細節 -->
    <g stroke="#591D02" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <!-- 底座與支架 -->
      <circle cx="60" cy="56" r="1.5" fill="#EB6B1A" stroke-width="1" />
      <line x1="60" y1="56" x2="60" y2="51" stroke-width="1.4" />
      <polygon points="57,47 63,47 61,51 59,51" stroke-width="1.1" fill="#FFB36B" fill-opacity="0.65" />
      <!-- 集電弓橫向滑板 -->
      <path d="M 52 45 Q 60 44 68 45" stroke-width="1.3" />
      <path d="M 53 46.5 Q 60 45.5 67 46.5" stroke-width="0.9" />
      <!-- 右側配線盒 -->
      <rect x="61.5" y="54" width="7.5" height="4" rx="0.5" stroke-width="0.9" />
      <line x1="61.5" y1="56" x2="69" y2="56" stroke-width="0.8" />
    </g>
  </g>
</svg>