<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 180" width="120" height="180">
  <defs>
    <!-- 底部柔和深藍色懸浮陰影 -->
    <filter id="blueDropShadow" x="-20%" y="-15%" width="140%" height="135%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0A1E46" flood-opacity="0.45" />
    </filter>

    <!-- 車身外殼橫向金屬漸層 (#87B8FF -> #2D5FBD) -->
    <linearGradient id="bodyMetallicGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3568C6" />
      <stop offset="18%" stop-color="#87B8FF" />
      <stop offset="52%" stop-color="#5893EB" />
      <stop offset="85%" stop-color="#3568C6" />
      <stop offset="100%" stop-color="#2D5FBD" />
    </linearGradient>

    <!-- 車頂主平台金屬漸層 (較亮天藍色調呈現受光面) -->
    <linearGradient id="roofMetallicGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#76ACFF" />
      <stop offset="25%" stop-color="#A6CCFF" />
      <stop offset="65%" stop-color="#7BB1FF" />
      <stop offset="100%" stop-color="#4A82DC" />
    </linearGradient>

    <!-- 引擎蓋金屬漸層 -->
    <linearGradient id="hoodMetallicGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#487FD9" />
      <stop offset="22%" stop-color="#96C3FF" />
      <stop offset="60%" stop-color="#68A1F5" />
      <stop offset="100%" stop-color="#2D5FBD" />
    </linearGradient>

    <!-- 左側冰藍色高光反光 -->
    <linearGradient id="iceBlueHighlight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E3F2FF" stop-opacity="0.75" />
      <stop offset="60%" stop-color="#BCE0FF" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#87B8FF" stop-opacity="0" />
    </linearGradient>

    <!-- 車頂冷氣蓋板漸層 -->
    <linearGradient id="acUnitGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#A8CEFF" />
      <stop offset="50%" stop-color="#7DB3FF" />
      <stop offset="100%" stop-color="#4F86DF" />
    </linearGradient>

    <!-- 擋風玻璃與天窗深色玻璃 -->
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2C353D" />
      <stop offset="50%" stop-color="#1E252B" />
      <stop offset="100%" stop-color="#14191D" />
    </linearGradient>

    <!-- 遮陽棚捲筒漸層 -->
    <linearGradient id="awningGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#69A3FA" />
      <stop offset="45%" stop-color="#9BC6FF" />
      <stop offset="100%" stop-color="#2D5FBD" />
    </linearGradient>
  </defs>

  <!-- 車輛主體群組 (含透明背景與懸浮陰影) -->
  <g filter="url(#blueDropShadow)">
    
    <!-- 左後視鏡支架與鏡殼 -->
    <path d="M 23 48 L 16 46 L 16 49 L 23 51 Z" fill="#1E262E" />
    <rect x="11" y="42" width="6.5" height="9" rx="2.2" fill="url(#bodyMetallicGrad)" stroke="#21468F" stroke-width="0.7" />
    <path d="M 12 43.2 L 15.5 43.2" stroke="#D8ECFF" stroke-width="0.9" stroke-linecap="round" opacity="0.8" />

    <!-- 右後視鏡支架與鏡殼 -->
    <path d="M 97 48 L 104 46 L 104 49 L 97 51 Z" fill="#1E262E" />
    <rect x="102.5" y="42" width="6.5" height="9" rx="2.2" fill="url(#bodyMetallicGrad)" stroke="#21468F" stroke-width="0.7" />
    <path d="M 103.5 43.2 L 107 43.2" stroke="#D8ECFF" stroke-width="0.9" stroke-linecap="round" opacity="0.8" />

    <!-- 車身外輪廓 (車頭朝上) -->
    <path d="
      M 27 12
      C 38 6, 82 6, 93 12
      C 97 15, 98 28, 97 44
      L 99 54
      L 99 156
      C 99 164, 94 169, 85 169
      L 35 169
      C 26 169, 21 164, 21 156
      L 21 54
      L 23 44
      C 22 28, 23 15, 27 12 Z" fill="url(#bodyMetallicGrad)" stroke="#20458C" stroke-width="0.9" />

    <!-- 車頭前保桿暗部折線與下緣陰影 -->
    <path d="M 29 11.5 C 42 7.5, 78 7.5, 91 11.5 C 88 13.5, 32 13.5, 29 11.5 Z" fill="#1F438A" opacity="0.65" />

    <!-- 左右頭燈 -->
    <path d="M 26.5 18 C 28 13.5, 34 11.5, 39 11.5 L 38 15.5 C 33 16, 29 17.5, 26.5 18 Z" fill="#F4F9FF" stroke="#75A9F9" stroke-width="0.5" />
    <path d="M 93.5 18 C 92 13.5, 86 11.5, 81 11.5 L 82 15.5 C 87 16, 91 17.5, 93.5 18 Z" fill="#F4F9FF" stroke="#75A9F9" stroke-width="0.5" />

    <!-- 引擎蓋立體區塊 -->
    <path d="M 29 19 C 40 15.5, 80 15.5, 91 19 L 92 36 C 75 33, 45 33, 28 36 Z" fill="url(#hoodMetallicGrad)" />
    <!-- 引擎蓋左側冰藍高光反光 -->
    <path d="M 31 19.5 C 36 18, 43 17.5, 48 17.5 L 46 34 C 40 34.2, 34 34.8, 30 35.5 Z" fill="url(#iceBlueHighlight)" />
    <!-- 引擎蓋中央微幅反光線 -->
    <line x1="49" y1="22" x2="71" y2="22" stroke="#DDF0FF" stroke-width="1" stroke-linecap="round" opacity="0.65" />

    <!-- 前擋風玻璃 -->
    <path d="M 28 38 C 44 34, 76 34, 92 38 L 88 53 C 73 50.5, 47 50.5, 32 53 Z" fill="url(#glassGrad)" stroke="#13181D" stroke-width="0.8" />
    <!-- 擋風玻璃斜向反光條 -->
    <polygon points="39,36.5 45,36 41,51.8 35,52.2" fill="#FFFFFF" opacity="0.14" />
    <polygon points="50,35.5 54,35.3 50,51.2 46,51.4" fill="#FFFFFF" opacity="0.10" />

    <!-- 左側車身側窗 (前後兩段) -->
    <path d="M 22.2 66 L 25.5 67 L 25.5 103 L 22.2 103 Z" fill="#1C232A" />
    <path d="M 22.2 111 L 25.5 111 L 25.5 145 L 22.2 146 Z" fill="#1C232A" />

    <!-- 車頂主體平台 -->
    <rect x="28" y="57" width="60" height="101" rx="7.5" fill="url(#roofMetallicGrad)" stroke="#2856AD" stroke-width="0.9" />

    <!-- 車頂左側冰藍色金屬高光反射帶 -->
    <path d="M 34 58 L 48 58 L 48 157 L 34 157 C 30.5 157, 29 154, 29 150 L 29 65 C 29 61, 30.5 58, 34 58 Z" fill="url(#iceBlueHighlight)" />

    <!-- 車頂中央裝飾細線 -->
    <line x1="59.5" y1="60" x2="59.5" y2="64" stroke="#E0F1FF" stroke-width="1.3" stroke-linecap="round" opacity="0.7" />
    <line x1="59.5" y1="88" x2="59.5" y2="92" stroke="#E0F1FF" stroke-width="1.3" stroke-linecap="round" opacity="0.7" />
    <line x1="59.5" y1="115" x2="59.5" y2="119" stroke="#E0F1FF" stroke-width="1.3" stroke-linecap="round" opacity="0.7" />
    <line x1="59.5" y1="149" x2="59.5" y2="154" stroke="#E0F1FF" stroke-width="1.3" stroke-linecap="round" opacity="0.7" />

    <!-- 前部車頂天窗 -->
    <rect x="44" y="66" width="31" height="20" rx="4.5" fill="url(#glassGrad)" stroke="#234A96" stroke-width="1" />
    <polygon points="48,67 53,67 49,85 45,85" fill="#FFFFFF" opacity="0.14" />
    <polygon points="56,67 59,67 55,85 52,85" fill="#FFFFFF" opacity="0.09" />

    <!-- 中部駐冷冷氣外機蓋 -->
    <rect x="45" y="93" width="29" height="21" rx="5" fill="url(#acUnitGrad)" stroke="#2652A6" stroke-width="0.9" />
    <!-- 冷氣頂部高光 -->
    <rect x="47.5" y="94.8" width="24" height="3.2" rx="1.5" fill="#DDF0FF" opacity="0.65" />
    <!-- 冷氣散熱格柵線 -->
    <line x1="51" y1="101.5" x2="68" y2="101.5" stroke="#2D5FBD" stroke-width="1.2" stroke-linecap="round" opacity="0.65" />
    <line x1="51" y1="105" x2="68" y2="105" stroke="#2D5FBD" stroke-width="1.2" stroke-linecap="round" opacity="0.65" />
    <line x1="51" y1="108.5" x2="68" y2="108.5" stroke="#2D5FBD" stroke-width="1.2" stroke-linecap="round" opacity="0.65" />

    <!-- 後部太陽能板陣列 (3x3 網格) -->
    <rect x="42" y="121" width="35" height="26" rx="2.5" fill="#1C232A" stroke="#234A96" stroke-width="0.9" />
    <!-- 太陽能板網格分隔線 -->
    <line x1="53.6" y1="121.5" x2="53.6" y2="146.5" stroke="#53687E" stroke-width="0.8" />
    <line x1="65.3" y1="121.5" x2="65.3" y2="146.5" stroke="#53687E" stroke-width="0.8" />
    <line x1="42.5" y1="129.6" x2="76.5" y2="129.6" stroke="#53687E" stroke-width="0.8" />
    <line x1="42.5" y1="138.3" x2="76.5" y2="138.3" stroke="#53687E" stroke-width="0.8" />
    <!-- 太陽能板反光 -->
    <polygon points="45,122 51,122 47,146 43,146" fill="#A8CEFF" opacity="0.12" />

    <!-- 右側車頂遮陽棚 (Awning) -->
    <rect x="90.5" y="56" width="5.5" height="103" rx="2.7" fill="url(#awningGrad)" stroke="#1E4287" stroke-width="0.8" />
    <line x1="92.2" y1="59" x2="92.2" y2="156" stroke="#DDF0FF" stroke-width="0.9" stroke-linecap="round" opacity="0.7" />

    <!-- 車尾第三煞車燈 -->
    <rect x="51" y="159.5" width="18" height="2" rx="1" fill="#FF4B4B" />

    <!-- 後擋風玻璃 -->
    <path d="M 31 162.5 L 89 162.5 L 87 166.5 C 70 167.5, 50 167.5, 33 166.5 Z" fill="url(#glassGrad)" stroke="#151A20" stroke-width="0.6" />
    <polygon points="36,162.8 43,162.8 41,166.5 34,166.3" fill="#FFFFFF" opacity="0.16" />

    <!-- 左右紅色尾燈 -->
    <path d="M 23.2 160 C 25.5 161.5, 28.5 163, 30.2 164.5 L 29.8 167.5 C 26 167, 23.8 165.5, 23.2 162.5 Z" fill="#F04747" stroke="#A62626" stroke-width="0.4" />
    <path d="M 96.8 160 C 94.5 161.5, 91.5 163, 89.8 164.5 L 90.2 167.5 C 94 167, 96.2 165.5, 96.8 162.5 Z" fill="#F04747" stroke="#A62626" stroke-width="0.4" />

    <!-- 車尾底部深藍色保桿陰影收邊 -->
    <path d="M 30 168 C 45 169.5, 75 169.5, 90 168" stroke="#183673" stroke-width="1.2" fill="none" stroke-linecap="round" />

  </g>
</svg>