<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <!-- 主體橫向金屬銀漸層：亮銀白 (#E4E8ED) 至 冷鐵灰 (#7D838B) -->
    <linearGradient id="metallicSilver" x1="0%" y1="15%" x2="100%" y2="85%">
      <stop offset="0%" stop-color="#E4E8ED" />
      <stop offset="35%" stop-color="#C4CAD2" />
      <stop offset="75%" stop-color="#9CA2AB" />
      <stop offset="100%" stop-color="#7D838B" />
    </linearGradient>

    <!-- 左側亮銀白高光反光漸層 -->
    <linearGradient id="silverHighlight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95" />
      <stop offset="45%" stop-color="#E4E8ED" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#7D838B" stop-opacity="0" />
    </linearGradient>

    <!-- 柔和冷炭灰底部懸浮陰影濾鏡 -->
    <filter id="floatingShadowSilver" x="-20%" y="-20%" width="140%" height="145%">
      <feDropShadow dx="0" dy="10" stdDeviation="7" flood-color="#1F242B" flood-opacity="0.38" />
      <feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-color="#2E353E" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- 整體套用懸浮陰影，背景完全透明 -->
  <g filter="url(#floatingShadowSilver)">
    
    <!-- 1. 外圓環主體與深灰色外框線（確保淺色/白色地圖高辨識度） -->
    <!-- 深灰色底框線 (外徑與內徑包覆) -->
    <circle cx="128" cy="124" r="96" fill="none" stroke="#454B54" stroke-width="13.5" />
    <!-- 金屬銀填充圓環 -->
    <circle cx="128" cy="124" r="96" fill="none" stroke="url(#metallicSilver)" stroke-width="10.5" />
    <!-- 外圓環左側亮銀白高光反光 -->
    <path d="M 60 192 A 96 96 0 0 1 196 56" fill="none" stroke="url(#silverHighlight)" stroke-width="3" stroke-linecap="round" />

    <!-- 2. 旗幟主體（採用 evenodd 挖空白色方格，並加上深灰色輪廓描邊） -->
    <g transform="translate(2, -2)">
      <path fill="url(#metallicSilver)" stroke="#454B54" stroke-width="1.8" stroke-linejoin="round" fill-rule="evenodd" d="
        M 72 80
        C 68.5 81, 66.5 84.5, 67.5 88
        L 94 188
        C 95 191.5, 98.5 193.5, 102 192.5
        C 105.5 191.5, 107.5 188, 106.5 184.5
        L 98.5 154
        C 113 145, 128 147, 143 151
        C 158 155, 173 156, 188 147
        C 190.5 145.5, 191.8 142.5, 191 139.5
        L 175 79
        C 174 75.5, 170 74, 167 76
        C 154 84, 140 83, 126 79
        C 111 75, 95 73, 78 80
        Z

        /* 挖空方格：第1列第1格 (左上白格) */
        M 82 88
        C 91 84.5, 99 84.5, 107 86
        L 111 101
        C 103 99.5, 95 99.5, 86 103
        Z

        /* 挖空方格：第1列第3格 (中上白格) */
        M 129 90.5
        C 137 92.5, 145 93, 152 91.5
        L 156 106.5
        C 149 108, 141 107.5, 133 105.5
        Z

        /* 挖空方格：第2列第2格 (中左白格) */
        M 111 101
        C 118 102.5, 125 104, 133 105.5
        L 137 121
        C 129 119.5, 122 118, 115 116.5
        Z

        /* 挖空方格：第2列第4格 (右中白格) */
        M 156 106.5
        C 162 105, 167 102.5, 172 99
        L 176 114.5
        C 171 118, 166 120.5, 160 122
        Z

        /* 挖空方格：第3列第1格 (左下白格) */
        M 90 118.5
        C 99 115, 107 115, 115 116.5
        L 119 132
        C 111 130.5, 103 130.5, 94 134
        Z

        /* 挖空方格：第3列第3格 (中下白格) */
        M 137 121
        C 145 123, 153 123.5, 160 122
        L 164 137.5
        C 157 139, 149 138.5, 141 136.5
        Z
      " />

      <!-- 旗桿左側純白金屬高光線 -->
      <path d="M 71.5 85.5 L 97.5 185.5" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-opacity="0.9" />
      
      <!-- 旗面上緣亮銀高光反光 -->
      <path d="M 78.5 82.5 C 95 76, 111 78, 126 82 C 140 86, 154 87, 166.5 79" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-opacity="0.85" />
    </g>
  </g>
</svg>