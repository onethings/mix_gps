<?xml version="1.0" encoding="UTF-8"?>
<svg width="120" height="180" viewBox="0 0 120 180" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <defs>
                                <!-- 1. 底部懸浮立體陰影 (stdDeviation="5", #1A3312, opacity="0.35") -->
                                <filter id="camperShadow" x="-30%" y="-20%" width="160%" height="140%">
                                    <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#1A3312" flood-opacity="0.35"/>
                                </filter>

                                <!-- 2. 車身主體橫向漸層 (模擬圓弧車身立體受光) -->
                                <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                                    <stop offset="0%" stop-color="#58B838"/>
                                    <stop offset="22%" stop-color="#7EE05A"/>
                                    <stop offset="50%" stop-color="#96F272"/>
                                    <stop offset="78%" stop-color="#7EE05A"/>
                                    <stop offset="100%" stop-color="#4FA832"/>
                                </linearGradient>

                                <!-- 3. 車頂頂蓋垂直漸層 -->
                                <linearGradient id="roofGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                                    <stop offset="0%" stop-color="#B8FF9E" stop-opacity="0.9"/>
                                    <stop offset="100%" stop-color="#68CC47" stop-opacity="0.8"/>
                                </linearGradient>

                                <!-- 4. 車窗與天窗反光玻璃漸層 -->
                                <linearGradient id="glassGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                                    <stop offset="0%" stop-color="#1E262C"/>
                                    <stop offset="35%" stop-color="#37434D"/>
                                    <stop offset="70%" stop-color="#222B32"/>
                                    <stop offset="100%" stop-color="#11161A"/>
                                </linearGradient>
                            </defs>

                            <!-- 露營車整體群組 (中心點 x=60, y=90，朝向正上方/北方) -->
                            <g filter="url(#camperShadow)">
                                <!-- 左右側後視鏡 -->
                                <!-- 左後視鏡 -->
                                <path d="M 24 46 L 14 48.5 L 14 51.5 L 24 50 Z" fill="#1E262C"/>
                                <path d="M 11.5 45.5 C 11.5 43.8, 14.5 43, 17.5 44 L 18.5 51.5 C 15.5 52.5, 11.5 51.5, 11.5 49 Z" fill="#58B838" stroke="#3D8A24" stroke-width="1.2"/>
                                <path d="M 12.8 45.2 C 14.2 44.3, 16 44.3, 17 44.8" stroke="#B6FF9C" stroke-width="0.9" stroke-opacity="0.7" stroke-linecap="round"/>

                                <!-- 右後視鏡 -->
                                <path d="M 96 46 L 106 48.5 L 106 51.5 L 96 50 Z" fill="#1E262C"/>
                                <path d="M 108.5 45.5 C 108.5 43.8, 105.5 43, 102.5 44 L 101.5 51.5 C 104.5 52.5, 108.5 51.5, 108.5 49 Z" fill="#4FA832" stroke="#3D8A24" stroke-width="1.2"/>
                                <path d="M 107.2 45.2 C 105.8 44.3, 104 44.3, 103 44.8" stroke="#B6FF9C" stroke-width="0.9" stroke-opacity="0.7" stroke-linecap="round"/>

                                <!-- 車身主體輪廓 (流線車頭 + 加寬露營車廂，對稱於 x=60, y=90) -->
                                <path d="M 32 13&#xA;                                         C 42 8.5, 78 8.5, 88 13&#xA;                                         C 93.5 15.5, 95.5 23, 96 34&#xA;                                         L 96 53&#xA;                                         C 97.8 55, 98.5 58, 98.5 63&#xA;                                         L 98.5 156&#xA;                                         C 98.5 163.5, 93.5 168, 85 168&#xA;                                         L 35 168&#xA;                                         C 26.5 168, 21.5 163.5, 21.5 156&#xA;                                         L 21.5 63&#xA;                                         C 21.5 58, 22.2 55, 24 53&#xA;                                         L 24 34&#xA;                                         C 24.5 23, 26.5 15.5, 32 13 Z" fill="url(#bodyGrad)" stroke="#3D8A24" stroke-width="1.8" stroke-linejoin="round"/>

                                <!-- 車頭保桿與氣壩細節 -->
                                <path d="M 41 12.2 Q 60 10.2 79 12.2" stroke="#3D8A24" stroke-width="1.4" stroke-linecap="round"/>
                                <path d="M 33 16.5 Q 60 14 87 16.5" stroke="#47992C" stroke-width="1" stroke-opacity="0.5"/>

                                <!-- 車頭 LED 晶鑽頭燈 (#E8FFDE) -->
                                <path d="M 27 18.5 C 28.5 14.5, 33.5 13, 39.5 13.5 L 36.5 18 C 32 18, 28.5 19, 27 21.5 Z" fill="#E8FFDE" stroke="#3D8A24" stroke-width="0.7"/>
                                <path d="M 93 18.5 C 91.5 14.5, 86.5 13, 80.5 13.5 L 83.5 18 C 88 18, 91.5 19, 93 21.5 Z" fill="#E8FFDE" stroke="#3D8A24" stroke-width="0.7"/>

                                <!-- 引擎蓋折線高光與兩側細微壓線 -->
                                <!-- 兩側細微壓線 (#47992C, 50%) -->
                                <path d="M 36.5 19 L 33 36.5" stroke="#47992C" stroke-width="1.2" stroke-opacity="0.5" stroke-linecap="round"/>
                                <path d="M 83.5 19 L 87 36.5" stroke="#47992C" stroke-width="1.2" stroke-opacity="0.5" stroke-linecap="round"/>
                                <!-- 中央折線高光 (#B6FF9C, 70%) -->
                                <path d="M 43 18 L 41 34.5" stroke="#B6FF9C" stroke-width="1.6" stroke-opacity="0.7" stroke-linecap="round"/>
                                <path d="M 77 18 L 79 34.5" stroke="#B6FF9C" stroke-width="1.6" stroke-opacity="0.7" stroke-linecap="round"/>
                                <path d="M 48 22.5 Q 60 21 72 22.5" stroke="#B6FF9C" stroke-width="1.4" stroke-opacity="0.7" stroke-linecap="round"/>

                                <!-- 前擋風玻璃 (glassGrad) -->
                                <path d="M 28.5 39.5&#xA;                                         C 36 35.5, 84 35.5, 91.5 39.5&#xA;                                         L 88.5 55.5&#xA;                                         C 79 52.5, 41 52.5, 31.5 55.5 Z" fill="url(#glassGrad)" stroke="#11161A" stroke-width="1.2" stroke-linejoin="round"/>
                                <!-- 前擋雨刷 -->
                                <path d="M 39 38.2 L 56 37.2 M 62 37.8 L 79 37.2" stroke="#11161A" stroke-width="1.2" stroke-linecap="round"/>
                                <!-- 前擋玻璃斜向白色高光條 (#FFFFFF, 15%) -->
                                <polygon points="36,37.8 44,37.3 38,53.2 32.5,54.2" fill="#FFFFFF" fill-opacity="0.15"/>
                                <polygon points="50,37 54.5,37 48.5,52.8 44,53" fill="#FFFFFF" fill-opacity="0.15"/>
                                <polygon points="73,37.3 77.5,37.8 71.5,53.2 67,52.8" fill="#FFFFFF" fill-opacity="0.15"/>

                                <!-- 駕駛座與露營車廂側窗 -->
                                <!-- 左側車窗 -->
                                <path d="M 24.5 45 L 28 46 L 28 56 L 24.5 55 Z" fill="url(#glassGrad)"/>
                                <path d="M 22.2 69 L 25.5 69.5 L 25.5 104 L 22.2 104.5 Z" fill="url(#glassGrad)"/>
                                <path d="M 22.2 112 L 25.5 112.5 L 25.5 144 L 22.2 144.5 Z" fill="url(#glassGrad)"/>
                                <!-- 右側車窗 -->
                                <path d="M 95.5 45 L 92 46 L 92 56 L 95.5 55 Z" fill="url(#glassGrad)"/>
                                <path d="M 97.8 69 L 94.5 69.5 L 94.5 104 L 97.8 104.5 Z" fill="url(#glassGrad)"/>
                                <path d="M 97.8 112 L 94.5 112.5 L 94.5 144 L 97.8 144.5 Z" fill="url(#glassGrad)"/>

                                <!-- 右側收折式車邊帳 (Rolled Side Awning Cassette) -->
                                <rect x="93" y="61" width="4.4" height="92" rx="2.2" fill="#4FA832" stroke="#3D8A24" stroke-width="1"/>
                                <line x1="94.7" y1="64" x2="94.7" y2="150" stroke="#B6FF9C" stroke-width="1" stroke-opacity="0.7" stroke-linecap="round"/>

                                <!-- 延伸式露營車頂外殼 (roofGrad) -->
                                <path d="M 32 58.5&#xA;                                         C 40 55.5, 80 55.5, 88 58.5&#xA;                                         C 90.5 59.5, 92 62, 92 65.5&#xA;                                         L 92 150&#xA;                                         C 92 153, 89.8 155, 86.5 155&#xA;                                         L 33.5 155&#xA;                                         C 30.2 155, 28 153, 28 150&#xA;                                         L 28 65.5&#xA;                                         C 28 62, 29.5 59.5, 32 58.5 Z" fill="url(#roofGrad)" stroke="#3D8A24" stroke-width="1.3"/>

                                <!-- 車頂前緣流線導流高光 -->
                                <path d="M 34 60 Q 60 57 86 60" stroke="#B8FF9E" stroke-width="2" stroke-opacity="0.9" stroke-linecap="round"/>

                                <!-- 車頂縱向加強筋與中央高光脊線 -->
                                <line x1="37" y1="66" x2="37" y2="149" stroke="#47992C" stroke-width="1.1" stroke-opacity="0.45" stroke-linecap="round"/>
                                <line x1="83" y1="66" x2="83" y2="149" stroke="#47992C" stroke-width="1.1" stroke-opacity="0.45" stroke-linecap="round"/>
                                <line x1="60" y1="62" x2="60" y2="151" stroke="#B8FF9E" stroke-width="2" stroke-opacity="0.85" stroke-linecap="round"/>

                                <!-- 車頂前部全景天窗 (Skylight Hatch) -->
                                <rect x="44" y="67" width="32" height="20" rx="4" fill="url(#glassGrad)" stroke="#3D8A24" stroke-width="1.2"/>
                                <polygon points="48,68.5 54,68.5 49,85.5 46,85.5" fill="#FFFFFF" fill-opacity="0.15"/>
                                <polygon points="58,68.5 61.5,68.5 56.5,85.5 53,85.5" fill="#FFFFFF" fill-opacity="0.15"/>

                                <!-- 車頂中段駐冷空調機組 (Roof AC Unit) -->
                                <rect x="45" y="93" width="30" height="22" rx="4.5" fill="#8AE868" stroke="#3D8A24" stroke-width="1.1"/>
                                <path d="M 48 95.5 L 72 95.5" stroke="#B8FF9E" stroke-width="1.5" stroke-opacity="0.9" stroke-linecap="round"/>
                                <line x1="51" y1="101" x2="69" y2="101" stroke="#3D8A24" stroke-width="1" stroke-opacity="0.6" stroke-linecap="round"/>
                                <line x1="51" y1="105" x2="69" y2="105" stroke="#3D8A24" stroke-width="1" stroke-opacity="0.6" stroke-linecap="round"/>
                                <line x1="51" y1="109" x2="69" y2="109" stroke="#3D8A24" stroke-width="1" stroke-opacity="0.6" stroke-linecap="round"/>

                                <!-- 車頂後段太陽能充電板 (Solar Panel) -->
                                <rect x="42" y="121" width="36" height="26" rx="2.5" fill="#1E262C" stroke="#3D8A24" stroke-width="1.1"/>
                                <!-- 太陽能板格線與反光 -->
                                <line x1="54" y1="121" x2="54" y2="147" stroke="#37434D" stroke-width="0.9"/>
                                <line x1="66" y1="121" x2="66" y2="147" stroke="#37434D" stroke-width="0.9"/>
                                <line x1="42" y1="129.5" x2="78" y2="129.5" stroke="#37434D" stroke-width="0.9"/>
                                <line x1="42" y1="138.5" x2="78" y2="138.5" stroke="#37434D" stroke-width="0.9"/>
                                <polygon points="46,122.5 52,122.5 47,145.5 43.5,145.5" fill="#FFFFFF" fill-opacity="0.15"/>

                                <!-- 後擋風玻璃與車尾燈組 -->
                                <path d="M 31 158 L 89 158 L 87 163.5 C 78 164.8, 42 164.8, 33 163.5 Z" fill="url(#glassGrad)" stroke="#11161A" stroke-width="1" stroke-linejoin="round"/>
                                <polygon points="38,158.8 44,158.8 41,163.8 36,163.8" fill="#FFFFFF" fill-opacity="0.15"/>

                                <!-- 高位第三煞車燈 (#FF4D4D) -->
                                <rect x="51" y="155.5" width="18" height="2" rx="1" fill="#FF4D4D"/>

                                <!-- 左右 LED 警示尾燈 (#FF4D4D) -->
                                <path d="M 23.5 158 L 30.5 163.5 L 30.5 166.5 C 25.5 166, 23 164, 23 160.5 Z" fill="#FF4D4D" stroke="#3D8A24" stroke-width="0.6"/>
                                <path d="M 96.5 158 L 89.5 163.5 L 89.5 166.5 C 94.5 166, 97 164, 97 160.5 Z" fill="#FF4D4D" stroke="#3D8A24" stroke-width="0.6"/>

                                <!-- 後保桿踏板線 -->
                                <line x1="36" y1="166" x2="84" y2="166" stroke="#3D8A24" stroke-width="1.2" stroke-linecap="round"/>
                            </g>
                        </svg>