<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <defs>
    <!-- 停車狀態暗紅色擴散光暈濾鏡 -->
    <filter id="parkedRedGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8" result="blurOuter" />
      <feFlood flood-color="#7D1111" flood-opacity="0.6" result="colorOuter" />
      <feComposite in="colorOuter" in2="blurOuter" operator="in" result="glowOuter" />

      <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="blurInner" />
      <feFlood flood-color="#B81D1D" flood-opacity="0.75" result="colorInner" />
      <feComposite in="colorInner" in2="blurInner" operator="in" result="glowInner" />

      <feMerge>
        <feMergeNode in="glowOuter" />
        <feMergeNode in="glowInner" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- 金屬烤漆主漸層（深酒紅 #7D1111 到 亮寶石紅 #E33939） -->
    <linearGradient id="metallicRubyGrad" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#610A0A" />
      <stop offset="22%" stop-color="#A81818" />
      <stop offset="48%" stop-color="#E33939" />
      <stop offset="72%" stop-color="#961313" />
      <stop offset="100%" stop-color="#570808" />
    </linearGradient>

    <!-- 外環立體金屬漸層 -->
    <linearGradient id="ringMetalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B51C1C" />
      <stop offset="25%" stop-color="#7D1111" />
      <stop offset="50%" stop-color="#E33939" />
      <stop offset="75%" stop-color="#6B0C0C" />
      <stop offset="100%" stop-color="#9E1616" />
    </linearGradient>

    <!-- 細緻暖金/亮紅金屬倒角描邊漸層 -->
    <linearGradient id="bevelStrokeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD4B8" stop-opacity="0.95" />
      <stop offset="35%" stop-color="#F26B6B" stop-opacity="0.85" />
      <stop offset="70%" stop-color="#7D1111" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#FF9E80" stop-opacity="0.8" />
    </linearGradient>

    <!-- 旗面與圓環斜向鏡面高光反光漸層 -->
    <linearGradient id="glossSpecularGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.48" />
      <stop offset="60%" stop-color="#FFAAAA" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.02" />
    </linearGradient>

    <!-- 旗面（含中空五角星）的複合路徑與裁切 -->
    <mask id="flagStarMask">
      <rect x="0" y="0" width="300" height="300" fill="white" />
      <!-- 中央鏤空五角星（保持地圖背景 100% 透明穿透） -->
      <polygon points="154,107 162.5,124.2 181.5,127 167.8,140.4 171,159.3 154,150.4 137,159.3 140.2,140.4 126.5,127 145.5,124.2" fill="black" />
    </mask>

    <clipPath id="flagBodyClip">
      <path d="M 85 95 C 115 74, 152 80, 178 86 C 194 89, 205 83, 212 76 L 226 164 C 216 173, 202 178, 185 174 C 158 168, 125 166, 102 184 L 85 95 Z" />
    </clipPath>

    <clipPath id="ringClip">
      <path fill-rule="evenodd" d="M 150 28 A 122 122 0 1 0 150 272 A 122 122 0 1 0 150 28 Z M 150 40 A 110 110 0 1 1 150 260 A 110 110 0 1 1 150 40 Z" />
    </clipPath>
  </defs>

  <!-- 整體套用 parkedRedGlow 停車狀態暗紅色擴散光暈 -->
  <g filter="url(#parkedRedGlow)">

    <!-- 1. 外圍精密幾何金屬圓環 -->
    <g>
      <!-- 圓環立體陰影底座 -->
      <circle cx="151" cy="152" r="116" fill="none" stroke="#420505" stroke-width="12" opacity="0.7" />
      <!-- 圓環主體金屬漸層 -->
      <circle cx="150" cy="150" r="116" fill="none" stroke="url(#ringMetalGrad)" stroke-width="11" />
      <!-- 圓環斜向鏡面高光（上半部反光切面） -->
      <g clip-path="url(#ringClip)">
        <path d="M 20 120 Q 150 90 280 75 L 280 15 L 20 15 Z" fill="url(#glossSpecularGrad)" />
      </g>
      <!-- 圓環外緣與內緣精密金屬倒角高光線 -->
      <circle cx="150" cy="150" r="121.5" fill="none" stroke="url(#bevelStrokeGrad)" stroke-width="1.3" />
      <circle cx="150" cy="150" r="110.5" fill="none" stroke="url(#bevelStrokeGrad)" stroke-width="1.2" />
    </g>

    <!-- 2. 精密幾何星形旗幟與旗桿 -->
    <g>
      <!-- 旗幟與旗桿立體厚度陰影層（營造浮雕厚實感） -->
      <g transform="translate(2, 2.5)" mask="url(#flagStarMask)">
        <path d="M 79 94 C 78.2 89, 85.8 87.8, 86.8 92.8 L 87.2 94.5 C 116 74, 152 80, 178 86 C 194 89, 205 83, 212 76 L 226 164 C 216 173, 202 178, 185 174 C 158 168, 125 166, 102 184 L 109.5 227 C 110.3 232, 102.7 233.3, 101.8 228.3 L 79 94 Z" fill="#3B0404" />
      </g>

      <!-- 旗幟與旗桿主體（套用五角星透明遮罩，讓地圖底色可完全穿透星星） -->
      <g mask="url(#flagStarMask)">
        <!-- 旗桿 + 旗面主金屬烤漆層 -->
        <path d="M 79 94 C 78.2 89, 85.8 87.8, 86.8 92.8 L 87.2 94.5 C 116 74, 152 80, 178 86 C 194 89, 205 83, 212 76 L 226 164 C 216 173, 202 178, 185 174 C 158 168, 125 166, 102 184 L 109.5 227 C 110.3 232, 102.7 233.3, 101.8 228.3 L 79 94 Z" fill="url(#metallicRubyGrad)" />

        <!-- 旗面斜向鏡面烤漆高光切面 -->
        <g clip-path="url(#flagBodyClip)">
          <path d="M 75 70 L 225 65 L 228 112 Q 150 122 88 145 Z" fill="url(#glossSpecularGrad)" />
        </g>

        <!-- 旗桿左側高光圓柱反光 -->
        <line x1="82.5" y1="93" x2="104.5" y2="226" stroke="#FF9999" stroke-width="1.8" stroke-linecap="round" opacity="0.55" />
      </g>

      <!-- 旗幟外輪廓金屬倒角高光描邊 -->
      <path d="M 79 94 C 78.2 89, 85.8 87.8, 86.8 92.8 L 87.2 94.5 C 116 74, 152 80, 178 86 C 194 89, 205 83, 212 76 L 226 164 C 216 173, 202 178, 185 174 C 158 168, 125 166, 102 184 L 109.5 227 C 110.3 232, 102.7 233.3, 101.8 228.3 L 79 94 Z" fill="none" stroke="url(#bevelStrokeGrad)" stroke-width="1.4" stroke-linejoin="round" />

      <!-- 中央鏤空五角星內圈金屬倒角描邊 -->
      <polygon points="154,107 162.5,124.2 181.5,127 167.8,140.4 171,159.3 154,150.4 137,159.3 140.2,140.4 126.5,127 145.5,124.2" fill="none" stroke="url(#bevelStrokeGrad)" stroke-width="1.6" stroke-linejoin="round" />
    </g>

  </g>
</svg>